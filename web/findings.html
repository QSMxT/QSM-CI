<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSM-CI · Results</title>
  <script>
    // Findings are now a tab on the combined Results page. Forward, preserving any query string.
    (function () {
      var q = new URLSearchParams(location.search);
      if (!q.get("tab")) q.set("tab", "findings");
      location.replace("results.html?" + q.toString());
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans bg-gray-50 dark:bg-gray-950">
  <p style="padding:2rem;font-family:system-ui">Redirecting to the <a href="results.html?tab=findings">Findings tab</a>…</p>
</body>
</html>
