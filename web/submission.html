<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSM-CI · Submission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="js/app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    .hljs { background: transparent; padding: 0; }
    main pre { border: 1px solid rgba(148,163,184,0.18); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    /* inline code chips (prose, not code blocks) */
    main :not(pre) > code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82em; padding: 0.1em 0.38em; border-radius: 0.375rem;
      background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0;
    }
    .dark main :not(pre) > code { background: rgba(148,163,184,0.14); color: #cbd5e1; border-color: rgba(148,163,184,0.2); }
    /* dual-range windowing slider with value bubbles + intensity histogram */
    .dualrange { position: relative; height: 66px; }
    .dualrange .hist { position: absolute; top: 16px; left: 0; width: 100%; height: 26px; display: block; }
    .dualrange .track { position: absolute; top: 46px; left: 0; right: 0; height: 6px; border-radius: 9999px; background: #e5e7eb; }
    .dark .dualrange .track { background: #374151; }
    .dualrange .fill { position: absolute; top: 46px; height: 6px; border-radius: 9999px; background: #6366f1; }
    .dualrange input[type=range] { position: absolute; top: 41px; left: 0; width: 100%; height: 16px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
    .dualrange input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; height: 16px; width: 16px; border-radius: 9999px; background: #fff; border: 2px solid #6366f1; cursor: grab; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .dualrange input[type=range]::-moz-range-thumb { pointer-events: auto; height: 16px; width: 16px; border-radius: 9999px; background: #fff; border: 2px solid #6366f1; cursor: grab; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .dark .dualrange input[type=range]::-webkit-slider-thumb { background: #1f2937; }
    .dark .dualrange input[type=range]::-moz-range-thumb { background: #1f2937; }
    /* value bubbles double as click-to-edit inputs (contenteditable) */
    .win-bubble { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; line-height: 1; padding: 3px 6px; border-radius: 6px; background: #111827; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; cursor: text; }
    .win-bubble:hover { background: #1f2937; }
    .win-bubble:focus { outline: none; box-shadow: 0 0 0 2px #a5b4fc; }
    .dark .win-bubble { background: #4f46e5; }
    .dark .win-bubble:hover { background: #6366f1; }
    /* viewer loading spinner */
    .spinner { width: 20px; height: 20px; border-radius: 9999px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* intensity readout pill: hide until NiiVue populates it (avoids an empty box) */
    #intensity:empty { display: none; }
    /* Fullscreen: the whole viewer section goes fullscreen (canvas + histogram + controls stay usable).
       The canvas wrapper grows to fill the leftover height; NiiVue's ResizeObserver on it repaints the
       GL canvas. !important overrides the wrapper's inline height:480px. */
    #viewer-section:fullscreen { display: flex; flex-direction: column; border-radius: 0; overflow-y: auto; }
    #viewer-section:fullscreen #viewer-canvas-wrap { flex: 1 1 auto; height: auto !important; min-height: 0; }
    /* hover for the fullscreen button (hover:bg-black/70 + hover:text-white aren't in the purged CSS) */
    #fullscreen-btn:hover { background: rgba(0,0,0,0.7); color: #fff; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.32/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
</head>
<body class="font-sans text-gray-900 bg-gray-50 antialiased dark:bg-gray-950 dark:text-gray-100">
  <header id="site-nav"></header>

  <main class="mx-auto max-w-7xl px-6 py-8">
    <a href="results.html" class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 dark:hover:text-gray-200">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      All results
    </a>

    <div class="mt-4 grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6">
      <!-- sidebar -->
      <aside class="lg:sticky lg:top-20 self-start">
        <div class="rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden dark:border-gray-800 dark:bg-gray-900">
          <div class="p-3 border-b border-gray-100 space-y-2 dark:border-gray-800">
            <!-- dataset / domain: the in-silico (2019) QSM phantom, χ-separation, or the in-vivo (2016)
                 challenge. The χ-separation and In-vivo buttons are revealed only when such runs exist,
                 so the sidebar isn't cluttered with an empty category. -->
            <div id="domain-toggle" class="inline-flex w-full rounded-lg bg-gray-100 p-1 text-[11px] font-medium dark:bg-gray-800">
              <button data-domain="invivo" class="flex-1 rounded-md px-2 py-1 transition hidden">In vivo (2016)</button>
              <button data-domain="qsm" class="flex-1 rounded-md px-2 py-1 transition">In silico (2019)</button>
              <button data-domain="chisep" class="flex-1 rounded-md px-2 py-1 transition hidden">χ-sep (2026)</button>
              <button data-domain="repro" class="flex-1 rounded-md px-2 py-1 transition hidden">Harm. (2026)</button>
            </div>
            <div id="nav-toggle" class="inline-flex w-full rounded-lg bg-gray-100 p-1 text-xs font-medium dark:bg-gray-800">
              <button data-mode="stages" class="flex-1 rounded-md px-2 py-1 transition">Stages</button>
              <button data-mode="pipelines" class="flex-1 rounded-md px-2 py-1 transition">Pipelines</button>
            </div>
            <input id="run-filter" type="search" placeholder="Filter…" class="w-full rounded-lg border-gray-300 text-sm px-3 py-1.5 focus:border-emerald-500 focus:ring-emerald-500 dark:bg-gray-800 dark:border-gray-700" />
          </div>
          <nav id="run-list" class="max-h-[calc(100vh-13rem)] overflow-y-auto p-2"></nav>
        </div>
      </aside>

      <!-- content -->
      <div>
        <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <div class="flex flex-wrap items-center gap-3">
            <h1 id="sub-title" class="text-2xl font-bold tracking-tight">Loading…</h1>
            <div id="sub-badges" class="flex gap-2"></div>
          </div>
          <p id="sub-meta" class="mt-2 text-sm text-gray-500 dark:text-gray-400"></p>
          <div id="method-info" class="mt-3 border-t border-gray-100 pt-3 space-y-2 dark:border-gray-800"></div>
        </div>

        <div id="how-to-run" class="mt-6 hidden rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900"></div>

        <!-- Dataset switch for a dipole method scored on more than one dataset (In vivo 2016 /
             In silico 2019): keep the same algorithm open, swap the dataset. Populated by viewer.js. -->
        <div id="dataset-switch" class="mt-6 hidden"></div>

        <!-- Phantom switch for a χ-separation method scored on more than one phantom: keep the same
             algorithm open, swap the phantom shown in the viewer/metrics. Populated by viewer.js. -->
        <div id="chisep-phantom-switch" class="mt-6 hidden"></div>

        <div class="mt-6 grid xl:grid-cols-5 gap-6">
          <section id="viewer-section" class="xl:col-span-3 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-gray-900">
            <!-- canvas -->
            <div id="viewer-canvas-wrap" class="relative rounded-xl overflow-hidden bg-black" style="height:480px">
              <canvas id="gl1" class="absolute inset-0 h-full w-full block"></canvas>
              <!-- intensity readout floats over the canvas so a long value string never reflows the layout -->
              <div id="intensity" class="pointer-events-none absolute top-2 left-2 z-10 max-w-[calc(100%-1rem)] truncate rounded-md bg-black/50 px-2 py-0.5 text-xs tabular-nums text-gray-200 backdrop-blur-sm"></div>
              <!-- fullscreen toggle: takes the whole viewer section (canvas + histogram + controls) fullscreen -->
              <button id="fullscreen-btn" type="button" title="Fullscreen — Shift+scroll to zoom · Shift+drag to pan"
                class="absolute top-2 right-2 z-20 rounded-md bg-black/50 p-1.5 text-gray-200 backdrop-blur-sm transition">
                <svg id="fs-icon-open" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
                <svg id="fs-icon-close" width="16" height="16" class="hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></svg>
              </button>
              <div id="viewer-loading" class="absolute inset-0 z-10 hidden items-center justify-center gap-3 bg-black/40 backdrop-blur-sm text-sm font-medium text-gray-100">
                <span class="spinner"></span> Loading volume…
              </div>
              <div id="viewer-note" class="absolute inset-0 hidden items-center justify-center px-6 text-center text-sm text-gray-400 bg-gray-50 dark:bg-gray-900"></div>
            </div>
            <!-- layer selector (beneath the viewer) -->
            <div id="layer-row" class="mt-4 flex flex-wrap items-center gap-3">
              <div class="inline-flex rounded-lg bg-gray-100 p-1 text-sm font-medium dark:bg-gray-800" id="layer-tabs">
                <button data-layer="recon" class="rounded-md px-3 py-1 transition">Reconstruction</button>
                <button data-layer="truth" class="rounded-md px-3 py-1 transition">Ground truth</button>
              </div>
              <!-- χ-separation source toggle (χ+ vs χ−); shown only for chi-separation runs -->
              <div class="hidden inline-flex rounded-lg bg-gray-100 p-1 text-sm font-medium dark:bg-gray-800" id="chisep-tabs">
                <button data-comp="para" class="rounded-md px-3 py-1 transition">χ+ paramagnetic</button>
                <button data-comp="dia" class="rounded-md px-3 py-1 transition">χ− diamagnetic</button>
              </div>
              <label class="flex items-center gap-1.5 text-sm text-gray-600 dark:text-gray-300" title="Overlay the error map on top of the selected map">
                <input id="t-error" type="checkbox" class="accent-emerald-600" /> Error map
              </label>
            </div>
            <!-- control panel -->
            <div id="viewer-controls" class="mt-4 rounded-xl bg-gray-50 p-4 space-y-4 dark:bg-gray-800/50">
              <div class="flex flex-wrap items-center gap-x-5 gap-y-3 text-sm">
                <div class="inline-flex rounded-lg bg-white p-1 text-xs font-medium ring-1 ring-gray-200 dark:bg-gray-800 dark:ring-gray-700" id="view-tabs">
                  <button data-view="multiplanar" class="rounded-md px-2.5 py-1 transition">3-plane</button>
                  <button data-view="axial" class="rounded-md px-2.5 py-1 transition">Axial</button>
                  <button data-view="coronal" class="rounded-md px-2.5 py-1 transition">Coronal</button>
                  <button data-view="sagittal" class="rounded-md px-2.5 py-1 transition">Sagittal</button>
                  <button data-view="render" class="rounded-md px-2.5 py-1 transition">3D</button>
                </div>
                <div class="flex items-center gap-3 text-gray-500 dark:text-gray-400">
                  <label class="flex items-center gap-1.5"><input id="t-colorbar" type="checkbox" class="accent-emerald-600" /> Colorbar</label>
                  <label class="flex items-center gap-1.5"><input id="t-crosshair" type="checkbox" class="accent-emerald-600" checked /> Crosshair</label>
                  <label class="flex items-center gap-1.5"><input id="t-interp" type="checkbox" class="accent-emerald-600" /> Smooth</label>
                </div>
                <!-- discoverability hint for the modifier-key interactions (scroll alone still changes slice) -->
                <span class="ml-auto text-xs text-gray-400 dark:text-gray-500">Scroll = slice · <span class="whitespace-nowrap">Shift+scroll = zoom</span> · <span class="whitespace-nowrap">Shift+drag = pan</span></span>
              </div>
              <!-- windowing: one section per shown map (base, then error overlay) -->
              <div class="space-y-3">
                <div id="win-base"></div>
                <div id="win-error-section" class="hidden space-y-2 border-t border-gray-200 pt-3 dark:border-gray-700">
                  <div id="win-error"></div>
                  <label class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">Error overlay opacity
                    <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" class="accent-emerald-600 flex-1" />
                    <span id="opacity-val" class="w-9 shrink-0 text-right text-xs tabular-nums">100%</span>
                  </label>
                </div>
              </div>
            </div>
          </section>

          <section class="xl:col-span-2 rounded-2xl border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-800 dark:bg-gray-900">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="font-semibold text-gray-900 dark:text-gray-100">Metrics</h2>
              <!-- Metrics / per-region values / per-region error. Hidden until this run's per-run
                   regions file (results/<id>/regions.json, via regions_url) loads. -->
              <div id="metrics-tabs" class="hidden inline-flex rounded-lg bg-gray-100 p-0.5 text-xs dark:bg-gray-800">
                <button data-mtab="metrics" class="rounded-md px-2.5 py-1 font-medium">Metrics</button>
                <button data-mtab="regions" class="rounded-md px-2.5 py-1 font-medium">Regions</button>
                <button data-mtab="error" class="rounded-md px-2.5 py-1 font-medium">Error</button>
              </div>
            </div>
            <p id="metrics-sub" class="mt-0.5 text-xs text-gray-500 dark:text-gray-400"></p>
            <div id="metrics-table-wrap">
              <table class="mt-4 w-full text-sm">
                <thead>
                  <tr class="text-xs uppercase tracking-wide text-gray-400 dark:text-gray-500">
                    <th class="pb-2 text-left font-medium">Metric</th>
                    <th class="pb-2 text-right font-medium">Value</th>
                    <th class="pb-2 pl-3 text-right font-medium">Rank</th>
                  </tr>
                </thead>
                <tbody id="metrics-body" class="divide-y divide-gray-100 dark:divide-gray-800"></tbody>
              </table>
            </div>
            <div id="metrics-regions-wrap" class="mt-4 hidden"></div>
          </section>
        </div>

        <!-- per-run resource usage over time (memory + CPU), rendered by viewer.js via uPlot.
             Hidden until a run's resources.json is found; stays hidden for DNF runs. -->
        <section id="resources-panel" class="mt-6 hidden rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
          <h2 class="font-semibold text-gray-900 dark:text-gray-100">Resource usage</h2>
          <p id="resources-sub" class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">Memory and CPU sampled once per second during the container run. CPU is in cores: above 1 means the method used more than one core.</p>
          <div id="resources-chart" class="mt-4"></div>
        </section>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
