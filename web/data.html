<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSM-CI · Results</title>
  <script>
    // The benchmark-data page is now integrated into the Results page as a per-dataset "Info" tab.
    // Forward, mapping the old anchors to the closest dataset where we can.
    (function () {
      var h = (location.hash || "").toLowerCase();
      var ds = "sim";
      if (h.indexOf("chi") > -1 || h.indexOf("separation") > -1) ds = "chisep";
      else if (h.indexOf("2016") > -1 || h.indexOf("vivo") > -1 || h.indexOf("cosmos") > -1) ds = "invivo";
      var tab = ds === "sim" ? "&tab=info" : "";
      location.replace("results.html?dataset=" + ds + tab);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans bg-gray-50 dark:bg-gray-950">
  <p style="padding:2rem;font-family:system-ui">The benchmark-data page is now the <a href="results.html?tab=info">Info tab</a> on the Results page…</p>
</body>
</html>
