<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSM-CI · Results</title>
  <script>
    // The leaderboard now lives on results.html (a tabbed Results page). Forward here, preserving
    // deep links: ?method=<slug> → the algorithm page; ?view/stage/variant → the matching tab.
    (function () {
      var q = new URLSearchParams(location.search);
      var m = q.get("method");
      if (m) { location.replace("submission.html?method=" + encodeURIComponent(m)); return; }
      location.replace("results.html" + (q.toString() ? "?" + q.toString() : ""));
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans bg-gray-50 dark:bg-gray-950">
  <p style="padding:2rem;font-family:system-ui">Redirecting to the <a href="results.html">Results page</a>…</p>
</body>
</html>
