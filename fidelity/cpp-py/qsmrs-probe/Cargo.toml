# Calls QSM.rs's ports of the C++ and Python originals directly, NIfTI in and out, for the first
# look in fidelity/cpp-py (QSMxT/QSM-CI#302). Only for the ports qsmxt exposes no command for
# (best-path and PRELUDE unwrapping, Gibbs removal, MP-PCA, mask morphology) and for settings qsmxt does not take (BET's
# subdivisions). qsm-core is pinned to the QSM.rs commit measured; change `rev` to look again.
[package]
name = "qsmrs-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# QSM.rs main a44046e (PRELUDE and morphology checks, 2026-11-02); `parallel`, as the qsmxt binary builds it.
qsm-core = { git = "https://github.com/astewartau/QSM.rs.git", rev = "a44046ea02c3c05dc54e370486ee445edc7b5fc5", features = ["parallel"] }

[profile.release]
opt-level = 3
