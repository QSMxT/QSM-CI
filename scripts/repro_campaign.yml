# The harmonization (repro) matrix: which methods run, the parity versions of the QSM.rs ports, and
# the authors' own chains. Read by scripts/pipeline.py --campaign (the Bunya matrix) and by
# scripts/gen_manifest.py (which lists the parity versions in web/algorithms.json, so the site and
# repro_eval.py keep their pipelines).
#
# methods:   the submissions in the matrix. Every QSM.rs port of a stage the matrix composes, plus the
#            originals that have no port. An original with a parity-checked port is left out: the
#            port stands for it, and its parity version (below) reproduces the original's settings.
# gpu:       methods the CPU matrix skips (matrix_gpu.slurm runs them with --campaign-part gpu).
# variants:  parity versions, `<base slug>.<tag>`: the base submission run with `set` (the parity
#            pair's candidate_set in parity/thresholds.yml, plus the original's reference values from
#            QSM.rs's advice rules; Recommended and Required rules win over both). Only where that
#            differs from the base's defaults. A variant of a field-mapping method enters the matrix
#            only through its `chain`.
# Left out as duplicates of the default (v11 results identical in every run): RESHARP's authors'
# radius 3 mm and iLSQR's STI Suite padding 12 mm are QSM.rs's defaults since v0.41.0.
# Left out after a look at the results: QSM.jl's SHARP (sharp-qsmrs with variant qsmjl) erodes so
# much of the brain edge that a median of 6 regions survive the 90% coverage rule (every other
# background removal keeps 20-25), so almost no pair has the 8 common regions a fit needs.
# chain:     on a field-mapping variant: the background-removal methods, dipole inversions and spans
#            it composes with — one authors' pipeline, not the whole matrix.

methods:
  field-mapping: [romeo-qsmrs, laplacian-qsmrs]
  unwrap+bfr: [iqfm-qsmrs]
  bfr: [bfrnet-qsmrs, harperella-qsmrs, iharperella-qsmrs, ismv-qsmrs, lbv-qsmrs, pdf-qsmrs,
        resharp-qsmrs, sharp-qsmrs, vsharp-qsmrs]
  dipole: [amp-pe-qsmrs, fansi-nltgv-qsmrs, fansi-nltv-qsmrs, hdqsm-qsmrs, heidi-qsmrs, ilsqr-qsmrs,
           inr-qsm, ir2qsm-qsmrs, l1qsm-qsmrs, lpcnn-qsmrs, lsqr-qsmrs, medi-qsmrs, modip,
           modl-qsm-qsmrs, ndi-qsmrs, nltv-qsmrs, qsmgan-qsmrs, qsmnet-plus-qsmrs, qsmnet-qsmrs,
           qsmnetme-qsmrs, rts-qsmrs, star-qsmrs, tikhonov-qsmrs, tkd-qsmrs, tsvd-qsmrs, tv-qsmrs,
           whqsm-qsmrs, xqsm-qsmrs]
  bfr+dipole: [autoqsm-qsmrs, nextqsm-qsmrs, qsmart-qsmrs, tfi-qsmrs, tgv-qsmrs]
  end-to-end: [iqsm-plus-qsmrs, iqsm-qsmrs, ukb-qsm]

gpu: [inr-qsm, modip]

variants:
  # V-SHARP: the default no longer deconvolves (#416, as in QSMxT), which is STI
  # Suite's setting, so vsharp-qsmrs.sti is gone and the deconvolved runs are this variant.
  vsharp-qsmrs.deconv:
    base: vsharp-qsmrs
    label: simulation-tuned (TSVD 0.05)
    set: {deconvolve: true, threshold: 0.05}
  vsharp-qsmrs.qsmjl:
    base: vsharp-qsmrs
    label: QSM.jl parity
    # deconvolve: the QSM.jl parity runs deconvolved; explicit since the base default is off (#416).
    set: {ball: qsmjl, grid: native, max_radius: 12, min_radius: 1, radius_step: 1, deconvolve: true,
          threshold: 0.05}
  ismv-qsmrs.qsmjl:
    base: ismv-qsmrs
    label: QSM.jl parity
    set: {variant: qsmjl, tol: 1e-3, max_iter: 500}
  # v11 re-runs of fixed methods: pre-release build of QSMxT main 625b9f3, image
  # ghcr.io/astewartau/qsm-ci/qsmxt@sha256:d9e80a9b39c8e5a5d68fcb94fc7a894534ee16e9ec5180013e6420462bfa4f72
  # (:interim-625b9f3; models image :interim-625b9f3-models-1 = sha256:5bf528837f273985d2bfc3aa53dfb1e5825fd22d2dfb82abc67ca831c9f3c3f9).
  # It ran iSMV, HARPERELLA (default whole rim and .sti), iHARPERELLA, NDI and WH-QSM in those chains;
  # the algorithm.yml files keep the v11.0.0 pin until the next QSMxT release.
  harperella-qsmrs.sti:
    base: harperella-qsmrs
    label: STI Suite rim (v11.0.0 default)
    set: {rim: sti}
  iharperella-qsmrs.wholerim:
    base: iharperella-qsmrs
    label: whole rim (QSMxT recommendation; pre-release build)
    set: {rim: whole}
  # Erode the mask before background removal (#426): dose check for iHARPERELLA,
  # HARPERELLA, and Laplacian's target case PDF/LBV (also after ROMEO, as the control).
  iharperella-qsmrs.erode1:
    base: iharperella-qsmrs
    label: mask eroded 1 voxel before BFR (pre-release build)
    set: {erode_voxels: 1}
  iharperella-qsmrs.erode3:
    base: iharperella-qsmrs
    label: mask eroded 3 voxels before BFR (pre-release build)
    set: {erode_voxels: 3}
  iharperella-qsmrs.wholerim-erode3:
    base: iharperella-qsmrs
    label: whole rim, mask eroded 3 voxels (pre-release build)
    set: {rim: whole, erode_voxels: 3}
  harperella-qsmrs.erode3:
    base: harperella-qsmrs
    label: mask eroded 3 voxels before BFR (pre-release build)
    set: {erode_voxels: 3}
  pdf-qsmrs.erode3:
    base: pdf-qsmrs
    label: mask eroded 3 voxels before BFR
    set: {erode_voxels: 3}
  lbv-qsmrs.erode3:
    base: lbv-qsmrs
    label: mask eroded 3 voxels before BFR
    set: {erode_voxels: 3}
  pdf-qsmrs.parity:
    base: pdf-qsmrs
    label: recommended iterations
    set: {n_cg: 300}
  star-qsmrs.sti:
    base: star-qsmrs
    label: STI Suite script parity
    set: {te: first, pad: 12}
  ndi-qsmrs.maskp999:
    base: ndi-qsmrs
    label: in-mask p99.9 weight normaliser (pre-release build)
    set: {weight_norm: mask-p999}
  whqsm-qsmrs.flatinmask:
    base: whqsm-qsmrs
    label: flat weight in the mask (pre-release build)
    set: {weight: flat-in-mask}
  heidi-qsmrs.parity:
    base: heidi-qsmrs
    label: HEIDI parity
    set: {denoise_reference_itk: true}
  tfi-qsmrs.parity:
    base: tfi-qsmrs
    label: MEDI parity
    set: {kernel: original, precision: single}
  tgv-qsmrs.parity:
    base: tgv-qsmrs
    label: TGV package parity
    set: {reference_divergence: true, reference_edge_erosion: true, reference_output_box: true}
  qsmart-qsmrs.parity:
    base: qsmart-qsmrs
    label: QSMART parity
    set: {offset_grid: qsmart-reference}
  laplacian-qsmrs.sti:
    base: laplacian-qsmrs
    label: STI Suite
    set: {solver: fft, fft_pad: 12, unmasked: true, weighting: tes}
    chain:
      bfrs: [vsharp-qsmrs]
      dipoles: [ilsqr-qsmrs, star-qsmrs, star-qsmrs.sti]
      spans: []
  laplacian-qsmrs.qsmart:
    base: laplacian-qsmrs
    label: QSMART
    set: {solver: mirror, unmasked: true, b0_estimation: qsmart-echofit}
    chain:
      bfrs: []
      dipoles: []
      spans: [qsmart-qsmrs, qsmart-qsmrs.parity]
  fit-ppm-complex-qsmrs.parity:
    base: fit-ppm-complex-qsmrs
    label: MEDI parity
    set: {unwrapping: medi-region-growing}
    chain:
      bfrs: [pdf-qsmrs, pdf-qsmrs.parity]
      dipoles: [medi-qsmrs]
      spans: [tfi-qsmrs, tfi-qsmrs.parity]
