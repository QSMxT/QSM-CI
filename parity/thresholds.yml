# Port parity pairs and the agreement each must keep (scripts/parity.py, .github/workflows/parity.yml,
# docs/parity.md).
#
# A pair is an original implementation (`reference`) and its QSM.rs port (`candidate`): two
# submissions with the same `algorithm:` in algorithm.yml, the candidate with `source: qsmrs` and the
# reference with any other source. The reference is always named here, never inferred, so an
# algorithm with several originals (e.g. an STI Suite one and a Julia one) is no special case: each
# original that is checked gets its own entry. Key an entry by the algorithm when it is that
# algorithm's only pair, else by the reference's slug (e.g. `ilsqr-qsmjl`).
# `python scripts/parity.py pairs` lists the configured pairs, any that no longer match
# algorithm.yml, and the algorithms that have an original and a port but no pair here.
#
#   enabled:          run by `parity.yml` with algorithm=enabled, which is what a QSM.rs release runs.
#                     A disabled pair can still be run by naming it; that is how it gets a baseline.
#   blocked_by:       on a disabled pair: the issue that says why its port does not match its
#                     original yet. The status shows it as a "gap", never as a pass, and it gets no
#                     limits that would bless the gap.
#   note:             on a disabled pair without blocked_by: why it is not enabled (status column).
#   qsmrs_paths:      the QSM.rs source files (or directories) the port's result depends on. A commit
#                     on QSM.rs main touching any of them (or `qsmrs_shared_paths`) makes the last
#                     check stale (`parity.py status`, rule b). They are the port's own modules, the
#                     pipeline files QSMxT calls it through (src/pipeline/, not followed further),
#                     and every module those import (`use crate::…`, `super::…`, inline
#                     `crate::…` paths), followed through shared code (fft.rs, grid.rs,
#                     constants.rs, kernels/, solvers/, utils/) but not into another algorithm's
#                     module that a shared file also serves (utils/multi_echo.rs imports
#                     unwrap/romeo.rs; that does not make ROMEO part of MEDI). Another algorithm's
#                     module the port itself imports is listed (sharp.rs uses inversion/medi.rs's
#                     sphere kernel). Recheck the list when the port's imports change.
#   qsmxt_paths:      the QSMxT files that wire the step the port's run.sh calls (`qsmxt invert
#                     tkd`: the CLI flags and defaults, the subcommand, the engine config it reads).
#                     A commit on QSMxT main touching any of them (or `qsmxt_shared_paths`) since
#                     the QSMxT commit last checked makes it stale (rule f). Optional.
#   qsmrs_models:     true when the QSM.rs side runs a deep-learning model: a qsmxt built from
#                     source has no weights (and a run no network), so parity.yml adds them with
#                     algorithms/_qsmxt/models.Dockerfile, as the pinned -models image has them.
#   reference_set:    `--set NAME=VALUE` overrides for the reference / candidate method (not its
#   candidate_set:    prefix steps), at the pair level or per dataset (the dataset's win): how a
#                     pair runs both sides with matched settings where their defaults differ (the
#                     Julia submissions' README "QSM.rs-matched" column). Changing one re-baselines.
#   reference_names:  {native: compared name} for intermediates the reference writes under other
#   candidate_names:  names (CONTRACT.md, "Intermediates"); {name: x, complement: true} also turns a
#                     mask into its complement inside the dataset mask; {name: x, clip_min: v}
#                     clamps values below v (a deviation the port documents; the name may stay).
#   intermediates_only: true when the final artifact is not like for like (the port reaches it by
#                     another route): it is reported without limits, and the pair passes on its
#                     intermediates' limits (at least one must be compared). The status and badge
#                     show the worst of those.
#   datasets:         one entry per scripts/datasets.json key the pair is checked on:
#     <artifact>:     limits on the final produced artifact (chimap), compared inside the dataset
#                     mask: nrmse_max (%, ‖cand − ref‖ / ‖ref‖), correlation_min, max_abs_max and
#                     p99_abs_max (ppm). An enabled pair with no limits for a dataset fails there.
#     intermediates:  {<name>: limits} for intermediates both sides write under that name; binary
#                     maps take dice_min. An intermediate with no limits is reported but never fails.
#     feed:           {<artifact>: <reference intermediate>}: give the candidate the reference's
#                     intermediate in place of the dataset's artifact, so the port starts from
#                     exactly what the original computed and only the steps after it are compared.
#                     Changing it changes what is measured: re-baseline.
#     <side>_prefix:  slugs run before that side when the dataset lacks the boundary it consumes.
#     measured:       the runs the limits came from, and the image each side ran. Informational.
#
# Staleness (`parity.py status`, docs/parity.md): an enabled pair's last check on a dataset is stale
# when the reference image changed, QSM.rs main touched its qsmrs_paths or Cargo.lock, QSMxT main
# touched its qsmxt_paths or Cargo.lock, its settings or limits here changed, it was never checked,
# or it failed. There is no age limit. Comment-only changes and the ignore lists below never count,
# and `parity.py attest` records a review that nothing since can move a check.
qsmrs_repo: astewartau/QSM.rs
qsmrs_branch: main
qsmrs_shared_paths: [Cargo.lock]   # every pair: a dependency update can move any result
qsmxt_repo: QSMxT/QSMxT
qsmxt_branch: main
# The qsmxt binary is built from QSMxT's lockfile (qsm-core is a dependency there, so QSM.rs's own
# Cargo.lock does not pick the versions of rustfft and the rest in the binary that ran).
qsmxt_shared_paths: [Cargo.lock]
# What cannot move a result, so it never makes a check stale (besides comment-only Rust changes,
# which never do): QSM.rs's pipeline rules only advise (no computation reads them), and these
# lockfile packages are not built on the Linux runners parity uses.
qsmrs_ignore_paths: [src/pipeline/rules.rs]
lock_ignore_packages: ["windows*", "wasm-bindgen*", "js-sys", "web-sys"]
# Where the site (and parity/badges/<pair>.json) is published; the QSM.rs README's badges read it.
site_url: https://qsmxt.github.io/QSM-CI

# QSM.rs methods with no original code to check against (QSMxT/QSM-CI#302): they keep ground-truth
# tests in QSM.rs instead. Each gets a "no original" row on the Parity page and a badge, never a pair.
#   covers: the QSM.rs functions (README rows) it stands for; note: optional, shown with it.
no_original:
  cosmos:
    covers: COSMOS (`cosmos`, `cosmos_weighted`)
  harperella:
    covers: HARPERELLA (`harperella`)
    note: not in STI Suite 3.0 (paper-based); iHARPERELLA is paired with STI Suite's
  slicewise-unwrap:
    covers: slice-wise (2D) unwrapping (`unwrap_slicewise`, `unwrap_slicewise_multi_echo`)
    note: QSM.rs's own wrapper (any unwrapper per slice, plus an inter-echo 2π pass)
    # Checked 2026-11-02 (QSMxT/QSM-CI#302): no published method or code does this. The nearest
    # originals cover one unwrapper each: FSL `prelude -s` (slice-wise PRELUDE; it differs from
    # QSM.rs's slice-wise PRELUDE: it writes 0 in small in-slice components, 14k/23k in-mask voxels
    # on sim/KKI, and 0.1–0.6 % of the rest take another wrap count beyond a per-component offset;
    # fidelity/cpp-py) and CLEARSWI.jl's `laplacianslice` (CLEAR-SWI's own step, ported in
    # QSM.rs's swi.rs, not here). The inter-echo consistency pass has no published counterpart.
  robust-fit:
    covers: robust echo combination (`multi_echo_robust_fit`)
    note: QSM.rs's own IRLS fit (Tukey/Huber loss, one robust scale over the mask)
    # Checked 2026-11-02: no published robust multi-echo field fit with code. The paper the QSM.rs
    # README cites for it (Biondetti et al., MRM 2022, PMC9545116; code emmabiondetti/multi-echo-qsm)
    # compares weighted averaging and a non-linear complex fit, not a robust fit. Generic IRLS
    # routines (MATLAB robustfit, statsmodels RLM) fit one regression at a time with its own scale;
    # QSM.rs's whole-mask scale, magnitude standardisation and degeneracy guard are its own design.
  motion-correction:
    covers: motion correction (`motion`)
    note: QSM.rs's own rigid registration (NCC, Powell, pyramid) and complex-domain resampling
    # Checked 2026-11-02: the module follows no published code. FSL FLIRT/MCFLIRT, ANTs and SPM
    # register with other cost functions, optimisers and schedules, so they are other algorithms,
    # not originals of this one; a comparison against them would measure that, not a port.
  morphology:
    covers: erosion / dilation, closing (`erode_mask`, `dilate_mask`, `morphological_close`)
    note: set definitions, no authored algorithm; identical to scipy.ndimage
    # Checked 2026-11-02 with fidelity/cpp-py/qsmrs-probe `morph` (QSM.rs a44046e): erode_mask and
    # dilate_mask equal scipy.ndimage.binary_erosion / binary_dilation (6-connected cross,
    # `iterations`, border_value 0), and morphological_close equals binary_dilation then
    # binary_erosion with the same ball (border_value 0), voxel for voxel, on the sim and KKI masks
    # and on a mask cut to touch the array faces (1, 2 and 5 iterations; radius 1 and 3). MATLAB's
    # imerode/imdilate(strel('sphere')) variants QSMART uses are checked by the qsmart pair.

# Originals checked outside the parity workflow, as fixture runs (fidelity/cpp-py): their port is
# not a QSM-CI stage, or their image cannot be published, so they have no pair here and are not
# `no_original` either. PRELUDE (`unwrap_prelude`): FSL `prelude` (fsl-fugue 2603.0,
# algorithms/_fsl-prelude, local only under FSL's licence). With FSL's full-3-D mode (`-f`), every
# in-mask voxel of every echo takes the same wrap count as QSM.rs at 6 and at 8 partitions, on sim
# (4 echoes) and KKI (5 echoes) (2026-11-02, QSM.rs a44046e); FSL's defaults (8 partitions,
# regions labelled slice by slice) are not implemented in QSM.rs (astewartau/QSM.rs#397).

# Limits are the agreement measured with the QSM.rs under test at the time (the current QSMxT main
# build, not only the pinned image), plus a margin (scripts/parity.py derive_limits: NRMSE +10 %
# +0.5 pp, correlation −0.01, |Δ| +25 % and at least 1e-6 ppm, Dice −0.01). A limit is never
# loosened to hide a gap: a change that makes agreement worse is fixed, or re-baselined with the
# reason in the PR. To re-baseline, dispatch parity.yml with baseline=true and paste the block its
# report prints.

pairs:
  qsmart:
    reference: qsmart-matlab   # the authors' QSMART v1.0, compiled; bit-identical to licensed MATLAB (v3)
    candidate: qsmart-qsmrs    # QSM.rs port via qsmxt (bfr+dipole: total field → χ)
    enabled: true
    qsmrs_paths: [src/bgremove/sdf.rs, src/error.rs, src/fft.rs, src/grid.rs,
                  src/inversion/ilsqr.rs, src/kernels/, src/pipeline/config.rs,
                  src/pipeline/qsmart.rs, src/pipeline/referencing.rs, src/pipeline/rules.rs,
                  src/utils/bias_correction.rs, src/utils/connected.rs, src/utils/curvature.rs,
                  src/utils/frangi.rs, src/utils/morphology.rs,
                  src/utils/morphology/signal_erosion.rs, src/utils/n4.rs, src/utils/padding.rs,
                  src/utils/portable_math.rs, src/utils/qsmart.rs, src/utils/threshold.rs,
                  src/utils/vasculature.rs]
    qsmxt_paths: &qsmart_wiring [src/cli.rs, src/commands/common.rs, src/commands/qsmart.rs,
                                 src/pipeline/config.rs, crates/qsmxt-engine/src/config.rs,
                                 crates/qsmxt-engine/src/bridge.rs,
                                 crates/qsmxt-engine/src/stages/qsmart.rs]
    # recon.m's intermediate names (fidelity/README.md) → the names they are compared under.
    reference_names:
      tfs: totalfield
      R_0: reliability
      vasc_only: { name: vessel_mask, complement: true }   # vasc_only = mask without vessels
      lfs1: localfield_stage1
      chi1: chimap_stage1
      lfs2: localfield_stage2
      chi2: chimap_stage2
    # The authors' adjust_offset.m builds its dipole on -N/2:N/2-1, half a step off the FFT grid
    # when a dimension is odd (the sim, 164×205×205); QSM.rs keeps the FFT grid as its default and
    # the authors' as an option (astewartau/QSM.rs#386), which the pair turns on. No effect on KKI.
    candidate_set: { offset_grid: qsmart-reference }
    datasets:
      # The port starts from the original's own total field (Laplacian unwrapping + QSMART's
      # magnitude-weighted echo fit) and its own reliability map R_0 (`qsmxt qsmart --reliability`,
      # Ashley 2026-10-31; parity only, scoring runs qsmart-qsmrs without one), so the comparison
      # covers QSMART's own steps: vasculature detection, the two SDF stages, the two iLSQR
      # inversions and the offset adjustment.
      #
      # Limits: re-baselined with the R_0 feed (run 41190547845: QSMxT main 9cfe3f9, qsm-core
      # 15c938f, built by this workflow), plus the margins above. The same build without the feed
      # (run 41190566176): sim NRMSE 16.32 %, KKI 0.779 %. The pinned qsmxt v10.0.0 (QSM.rs v0.39.0)
      # is far outside them (sim NRMSE 65.9 %, KKI 133.8 %, without the feed): those runs record
      # the gap, not a limit. Reference image: matlab-qsmart v3, sha256:e0e8bc69… (algorithm.yml);
      # both datasets re-measured on v4 (below). KKI has all-even dims, so v3 never padded it; it
      # is unchanged and its limits stand.
      sim:
        feed: { totalfield: totalfield, reliability: reliability }
        # matlab-qsmart v4 (no even-dim padding, as the authors' code) with the candidate on
        # offset_grid=qsmart-reference (astewartau/QSM.rs#386, QSMxT/QSMxT#468), run 41214814110:
        # NRMSE 0.359 %, r 1.0000, max |Δ| 0.0310 ppm, p99 |Δ| 0.0000913 ppm; stage-1 local field
        # 0.075 %, χ1 0.126 %, stage-2 local field 0.202 %, χ2 0.551 %, vessel mask Dice 1.
        # Identical with qsm-core at QSM.rs main 6500518 (QSMxT/QSMxT#469; run 41214822789). On the
        # FFT grid (QSM.rs's default; local run) NRMSE is 3.57 %. Before (v3, padded; run
        # 41190547845): 13.45 %, r 0.9909, max 0.125, p99 0.00897; stage-2 local field 8.54 %, χ2
        # 27.3 %, vessel Dice 0.988: the padding changed the original's vessel mask, total field and
        # both stages.
        chimap: { nrmse_max: 0.895, correlation_min: 0.989, max_abs_max: 0.0388, p99_abs_max: 0.000115 }
        measured:
          main: "run 41214814110: QSMxT main 7daaa49, qsm-core c03d4d0, v4, R_0 fed, qsmart-reference grid (limits)"
          main-6500518: "run 41214822789: QSMxT#469, qsm-core 6500518, same result"
          v3: "run 41190547845: QSMxT main 9cfe3f9, qsm-core 15c938f, R_0 fed, v3 (padded), NRMSE 13.45 %"
          unfed: "run 41190566176: QSMxT main 9cfe3f9, qsm-core 15c938f, no R_0, NRMSE 16.32 %, r 0.9868"
          pinned: "run 40530165113: qsmxt v10.0.0 sha256:9258c10e…, NRMSE 65.94 %, r 0.8003"
      # In vivo (EMTP travelling head, KKI Philips 3 T, public). R_0 rejects no voxel here: the
      # result is the same with and without the feed (runs 41190547845, 41190566176).
      s002001-kki-achieva-bridge-run1:
        feed: { totalfield: totalfield, reliability: reliability }
        # Measured: NRMSE 0.779 %, r 1.0000, max |Δ| 0.0455 ppm, p99 |Δ| 0.000446 ppm, the same on
        # v3 and v4 and with either offset grid (all dims even).
        chimap: { nrmse_max: 1.36, correlation_min: 0.989, max_abs_max: 0.0569, p99_abs_max: 0.000558 }
        measured:
          main: "run 41190547845: QSMxT main 9cfe3f9, qsm-core 15c938f, R_0 fed (limits)"
          v4: "runs 41214814110, 41214822789: v4, qsmart-reference grid, NRMSE 0.779 % (unchanged)"
          pinned: "run 40530165113: qsmxt v10.0.0 sha256:9258c10e…, NRMSE 133.8 %, r 0.5346"

  # ---- In vivo inputs. The KKI travelling head has no ground-truth fields, so a pair that starts
  # from a field gets one from QSM.rs steps run before its reference (`reference_prefix`), and the
  # candidate is fed exactly what the reference was given (`feed`): both sides start from the same
  # voxels, and only the pair's own step is compared. Prefix steps run the QSM.rs under test.

  # ---- STI Suite originals (MATLAB, compiled on the real toolboxes; fidelity: QSMxT/QSM-CI#304)
  ilsqr:
    reference: ilsqr-sti
    candidate: ilsqr-qsmrs
    enabled: true
    # Was sim 18.0 % / KKI 17.2 % NRMSE at QSM.rs da928e0 (40 iterations, the GUI's; the container
    # runs QSM_iLSQR's own 100, now QSM.rs's default), then 0.99 % / 1.78 % at main 7f8271e (run
    # 41019608126): FastQSM's kernel closing differed from imclose's. With that fixed
    # (astewartau/QSM.rs#372): 0.0024 % / 0.017 % at qsmxt's default double precision (run
    # 41023156365), the same as with STI's single precision (`--set precision=single`, run
    # 41026767896: 0.0024 % / 0.017 %), so the pair checks the default.
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/ilsqr.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/padding.rs]
    qsmxt_paths: &invert_wiring [src/cli.rs, src/commands/common.rs, src/commands/invert.rs]
    datasets:
      sim:
        # Measured: NRMSE 0.002378 %, r 1.000000, max |Δ| 9.0e-05 ppm, p99 |Δ| 2.2e-06 ppm.
        chimap: { nrmse_max: 0.503, correlation_min: 0.989, max_abs_max: 0.000113, p99_abs_max: 2.72e-06 }
        measured: { main: "run 41256314678: QSMxT main a78074c, QSM.rs main afed56b (limits)" }
      s002001-kki-achieva-bridge-run1:
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }
        # Measured: NRMSE 0.01666 %, r 1.000000, max |Δ| 1.65e-04 ppm, p99 |Δ| 2.1e-05 ppm.
        chimap: { nrmse_max: 0.519, correlation_min: 0.989, max_abs_max: 0.000207, p99_abs_max: 2.68e-05 }
        measured: { main: "run 41256314678: QSMxT main a78074c, QSM.rs main afed56b (limits)" }
  vsharp:
    reference: vsharp-sti
    candidate: vsharp-qsmrs
    enabled: true
    # Closed by STI Suite's ball (astewartau/QSM.rs#332) and its even crop and single-precision mask
    # resampling (#361): from NRMSE sim 40.7 %, KKI 58.5 % at da928e0 to STI's float32 rounding.
    qsmrs_paths: [src/bgremove/sharp.rs, src/bgremove/smv.rs, src/bgremove/vsharp.rs, src/error.rs,
                  src/fft.rs, src/grid.rs, src/inversion/medi.rs, src/kernels/,
                  src/pipeline/bg_removal.rs, src/pipeline/rules.rs, src/utils/padding.rs]
    qsmxt_paths: &bgremove_vsharp_wiring [src/cli.rs, src/commands/common.rs,
                                          src/commands/bgremove.rs,
                                          crates/qsmxt-engine/src/config.rs]
    # STI Suite's V_SHARP does not deconvolve; neither does the wrapper's default (QSMxT's), but the
    # sim-tuned value does, so the pair says so explicitly.
    candidate_set: { deconvolve: "false" }
    datasets:
      sim:
        # Measured: NRMSE 0.00090 %, r 1.000000, max |Δ| 6.3e-07 ppm, p99 |Δ| 2.1e-07 ppm.
        localfield: { nrmse_max: 0.501, correlation_min: 0.989, max_abs_max: 1.0e-6, p99_abs_max: 1.0e-6 }
        measured: { main: "run 41019310531: QSMxT main 2533f94, QSM.rs main 7f8271e; vsharp-sti v2 (limits)" }
      s002001-kki-achieva-bridge-run1:
        reference_prefix: [laplacian-qsmrs]
        feed: { totalfield: totalfield }
        # Measured: NRMSE 0.00022 %, r 1.000000, max |Δ| 4.9e-07 ppm, p99 |Δ| 7.5e-08 ppm.
        localfield: { nrmse_max: 0.501, correlation_min: 0.989, max_abs_max: 1.0e-6, p99_abs_max: 1.0e-6 }
        measured: { main: "run 41019310531: QSMxT main 2533f94, QSM.rs main 7f8271e; vsharp-sti v2 (limits)" }
  iharperella:
    reference: iharperella-sti    # STI Suite 3.0's iHARPERELLA, compiled; identical to licensed MATLAB (v2)
    candidate: iharperella-qsmrs  # QSM.rs's port of it (astewartau/QSM.rs#270), via qsmxt bgremove iharperella
    enabled: true
    # Same algorithm: with both sides' defaults (LSQR tol 0.001, no padding; QSM.rs
    # IharperellaParams::default, probed from STI Suite 3.0) the outputs agree to 5e-9 % NRMSE at
    # 5 LSQR iterations and 2e-5 % at 10 (KKI, run locally on the CI's qsmxt build). Past ~10
    # iterations LSQR amplifies rounding about 5x per iteration, in the original too: at its
    # default 40 iterations, STI against itself with a 1-ulp change to the float32 input differs
    # by 2.4 % (sim cropped to even) and 2.6 % (KKI), and QSM.rs against STI by 4.4 % / 16.7-20.9 %
    # (run 41315128824: KKI 20.88 %, r 0.979). So the pair checks the algorithm at 10 iterations,
    # where it is deterministic to rounding; the default 40 only measures the chaos.
    reference_set: { niter: 10 }
    # rim sti: STI's own rule, explicitly (iHARPERELLA's default; whole-rim zeroing is an option).
    candidate_set: { max_iter: 10, rim: sti }
    qsmrs_paths: [src/bgremove/iharperella.rs, src/error.rs, src/fft.rs, src/grid.rs,
                  src/inversion/ilsqr.rs, src/kernels/, src/pipeline/bg_removal.rs,
                  src/pipeline/rules.rs, src/utils/padding.rs]
    qsmxt_paths: *bgremove_vsharp_wiring
    # Not on sim: its 164x205x205 grid has odd dimensions, where STI Suite 3.0's iHARPERELLA does
    # not remove the background (r 0.10 with the true local field, gradients along the two odd
    # axes; cropped to 164x204x204 it gives r 0.86, and QSM.rs r 0.86 on the full grid). QSM.rs
    # keeps working on odd grids (astewartau/QSM.rs#393).
    datasets:
      s002001-kki-achieva-bridge-run1:
        reference_prefix: [laplacian-qsmrs]
        feed: { totalfield: totalfield }
        # Measured (10 iterations): NRMSE 3.9e-5 %, r 1.000000, max |Δ| 6.0e-08 ppm, p99 |Δ| 3.0e-08 ppm.
        localfield: { nrmse_max: 0.501, correlation_min: 0.989, max_abs_max: 1.0e-6, p99_abs_max: 1.0e-6 }
        measured: { main: "run 41318552428: QSMxT main 2c1661c, QSM.rs main 92dcc3b; iharperella-sti v2 (limits)" }
  star:
    reference: star-sti
    candidate: star-qsmrs   # ci_skip until a qsmxt release has `qsmxt invert star`: runs against a build
    enabled: true
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/star.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/echo_time.rs,
                  src/utils/padding.rs]
    qsmxt_paths: *invert_wiring
    # star-sti scales the field to phase at the first echo and pads 12 voxels per side (recon.m);
    # star-qsmrs defaults to the sum and STI's GUI padding [8 8 20].
    candidate_set: { te: first, pad: 12 }
    datasets:
      sim:
        # Measured: NRMSE 0.002332 % (0.326 % with STI's GUI padding [8 8 20], run 40605505892).
        chimap: { nrmse_max: 0.503, correlation_min: 0.989, max_abs_max: 8.95e-05, p99_abs_max: 2.29e-06 }
        measured: { main: "run 41019608126: QSMxT main 2533f94, QSM.rs main 7f8271e (limits)" }
      s002001-kki-achieva-bridge-run1:
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }
        # Measured: NRMSE 0.002147 % (6.68 % with STI's GUI padding, run 40605505892).
        chimap: { nrmse_max: 0.503, correlation_min: 0.989, max_abs_max: 1.64e-05, p99_abs_max: 3.45e-06 }
        measured: { main: "run 41019608126: QSMxT main 2533f94, QSM.rs main 7f8271e (limits)" }
  medi:
    reference: medi-cornell
    candidate: medi-qsmrs
