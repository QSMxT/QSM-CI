# Port parity pairs and the agreement each must keep (scripts/parity.py, .github/workflows/parity.yml,
# docs/parity.md).
#
# A pair is an original implementation (`reference`) and its QSM.rs port (`candidate`): two
# submissions with the same `algorithm:` in algorithm.yml, the candidate with `source: qsmrs` and the
# reference with any other source. The reference is always named here, never inferred, so an
# algorithm with several originals (e.g. an STI Suite one and a Julia one) is no special case: each
# original that is checked gets its own entry. Key an entry by the algorithm when it is that
# algorithm's only pair, else by the reference's slug (e.g. `ilsqr-qsmjl`).
# `python scripts/parity.py pairs` lists the configured pairs, any that no longer match
# algorithm.yml, and the algorithms that have an original and a port but no pair here.
#
#   enabled:          run by `parity.yml` with algorithm=enabled, which is what a QSM.rs release runs.
#                     A disabled pair can still be run by naming it; that is how it gets a baseline.
#   blocked_by:       on a disabled pair: the issue that says why its port does not match its
#                     original yet. The status shows it as a "gap", never as a pass, and it gets no
#                     limits that would bless the gap.
#   note:             on a disabled pair without blocked_by: why it is not enabled (status column).
#   qsmrs_paths:      the QSM.rs source files (or directories) the port's result depends on. A commit
#                     on QSM.rs main touching any of them (or `qsmrs_shared_paths`) makes the last
#                     check stale (`parity.py status`, rule b). They are the port's own modules, the
#                     pipeline files QSMxT calls it through (src/pipeline/, not followed further),
#                     and every module those import (`use crate::…`, `super::…`, inline
#                     `crate::…` paths), followed through shared code (fft.rs, grid.rs,
#                     constants.rs, kernels/, solvers/, utils/) but not into another algorithm's
#                     module that a shared file also serves (utils/multi_echo.rs imports
#                     unwrap/romeo.rs; that does not make ROMEO part of MEDI). Another algorithm's
#                     module the port itself imports is listed (sharp.rs uses inversion/medi.rs's
#                     sphere kernel). Recheck the list when the port's imports change.
#   qsmxt_paths:      the QSMxT files that wire the step the port's run.sh calls (`qsmxt invert
#                     tkd`: the CLI flags and defaults, the subcommand, the engine config it reads).
#                     A commit on QSMxT main touching any of them (or `qsmxt_shared_paths`) since
#                     the QSMxT commit last checked makes it stale (rule f). Optional.
#   reference_set:    `--set NAME=VALUE` overrides for the reference / candidate method (not its
#   candidate_set:    prefix steps), at the pair level or per dataset (the dataset's win): how a
#                     pair runs both sides with matched settings where their defaults differ (the
#                     Julia submissions' README "QSM.rs-matched" column). Changing one re-baselines.
#   reference_names:  {native: compared name} for intermediates the reference writes under other
#   candidate_names:  names (CONTRACT.md, "Intermediates"); {name: x, complement: true} also turns a
#                     mask into its complement inside the dataset mask.
#   datasets:         one entry per scripts/datasets.json key the pair is checked on:
#     <artifact>:     limits on the final produced artifact (chimap), compared inside the dataset
#                     mask: nrmse_max (%, ‖cand − ref‖ / ‖ref‖), correlation_min, max_abs_max and
#                     p99_abs_max (ppm). An enabled pair with no limits for a dataset fails there.
#     intermediates:  {<name>: limits} for intermediates both sides write under that name; binary
#                     maps take dice_min. An intermediate with no limits is reported but never fails.
#     feed:           {<artifact>: <reference intermediate>}: give the candidate the reference's
#                     intermediate in place of the dataset's artifact, so the port starts from
#                     exactly what the original computed and only the steps after it are compared.
#                     Changing it changes what is measured: re-baseline.
#     <side>_prefix:  slugs run before that side when the dataset lacks the boundary it consumes.
#     measured:       the runs the limits came from, and the image each side ran. Informational.
#
# Staleness (`parity.py status`, docs/parity.md): an enabled pair's last check on a dataset is stale
# when the reference image changed, QSM.rs main touched its qsmrs_paths or Cargo.lock, QSMxT main
# touched its qsmxt_paths or Cargo.lock, its settings or limits here changed, it was never checked,
# or it failed. There is no age limit.
qsmrs_repo: astewartau/QSM.rs
qsmrs_branch: main
qsmrs_shared_paths: [Cargo.lock]   # every pair: a dependency update can move any result
qsmxt_repo: QSMxT/QSMxT
qsmxt_branch: main
# The qsmxt binary is built from QSMxT's lockfile (qsm-core is a dependency there, so QSM.rs's own
# Cargo.lock does not pick the versions of rustfft and the rest in the binary that ran).
qsmxt_shared_paths: [Cargo.lock]
# Where the site (and parity/badges/<pair>.json) is published; the QSM.rs README's badges read it.
site_url: https://qsmxt.github.io/QSM-CI

# QSM.rs methods with no original code to check against (QSMxT/QSM-CI#302): they keep ground-truth
# tests in QSM.rs instead. Each gets a "no original" row on the Parity page and a badge, never a pair.
#   covers: the QSM.rs functions (README rows) it stands for; note: optional, shown with it.
no_original:
  cosmos:
    covers: COSMOS (`cosmos`, `cosmos_weighted`)
  harperella:
    covers: HARPERELLA (`harperella`)
  prelude:
    covers: PRELUDE (`unwrap_prelude`)
    note: clean-room by design
  slicewise-unwrap:
    covers: slice-wise (2D) unwrapping (`unwrap_slicewise`, `unwrap_slicewise_multi_echo`)
  robust-fit:
    covers: robust echo combination (`multi_echo_robust_fit`)
  motion-correction:
    covers: motion correction (`motion`)
  morphology:
    covers: erosion / dilation, closing (`erode_mask`, `dilate_mask`, `morphological_close`)

# Limits are the agreement measured with the QSM.rs under test at the time (the current QSMxT main
# build, not only the pinned image), plus a margin (scripts/parity.py derive_limits: NRMSE +10 %
# +0.5 pp, correlation −0.01, |Δ| +25 % and at least 1e-6 ppm, Dice −0.01). A limit is never
# loosened to hide a gap: a change that makes agreement worse is fixed, or re-baselined with the
# reason in the PR. To re-baseline, dispatch parity.yml with baseline=true and paste the block its
# report prints.

pairs:
  qsmart:
    reference: qsmart-matlab   # the authors' QSMART v1.0, compiled; bit-identical to licensed MATLAB (v3)
    candidate: qsmart-qsmrs    # QSM.rs port via qsmxt (bfr+dipole: total field → χ)
    enabled: true
    qsmrs_paths: [src/bgremove/sdf.rs, src/error.rs, src/fft.rs, src/grid.rs,
                  src/inversion/ilsqr.rs, src/kernels/, src/pipeline/config.rs,
                  src/pipeline/qsmart.rs, src/pipeline/referencing.rs, src/pipeline/rules.rs,
                  src/utils/bias_correction.rs, src/utils/connected.rs, src/utils/curvature.rs,
                  src/utils/frangi.rs, src/utils/morphology.rs,
                  src/utils/morphology/signal_erosion.rs, src/utils/n4.rs, src/utils/padding.rs,
                  src/utils/portable_math.rs, src/utils/qsmart.rs, src/utils/threshold.rs,
                  src/utils/vasculature.rs]
    qsmxt_paths: &qsmart_wiring [src/cli.rs, src/commands/common.rs, src/commands/qsmart.rs,
                                 src/pipeline/config.rs, crates/qsmxt-engine/src/config.rs,
                                 crates/qsmxt-engine/src/bridge.rs,
                                 crates/qsmxt-engine/src/stages/qsmart.rs]
    # recon.m's intermediate names (fidelity/README.md) → the names they are compared under.
    reference_names:
      tfs: totalfield
      R_0: reliability
      vasc_only: { name: vessel_mask, complement: true }   # vasc_only = mask without vessels
      lfs1: localfield_stage1
      chi1: chimap_stage1
      lfs2: localfield_stage2
      chi2: chimap_stage2
    datasets:
      # The port starts from the original's own total field (Laplacian unwrapping + QSMART's
      # magnitude-weighted echo fit), so the comparison covers QSMART's own steps: vasculature
      # detection, the two SDF stages, the two iLSQR inversions and the offset adjustment.
      #
      # Limits: measured with QSMxT main 8a7072a (qsm-core da928e0) built by this workflow, plus
      # the margins above. The pinned qsmxt v10.0.0 (QSM.rs v0.39.0) is far outside them (sim NRMSE
      # 65.9 %, KKI 133.8 %): those runs record the gap, not a limit. Reference image both times:
      # matlab-qsmart v3, sha256:e0e8bc69… (algorithm.yml).
      sim:
        feed: { totalfield: totalfield }
        # Measured: NRMSE 16.71 %, r 0.9862, max |Δ| 0.283 ppm, p99 |Δ| 0.0100 ppm.
        # The original leaves 331 voxels out by its echo-fit reliability (R_0); qsmart-qsmrs takes
        # no R_0, so it reconstructs them too. The gap is mostly where the original's stage 2 runs
        # (tissue outside its vessel mask, 37 % of the brain: NRMSE 37.4 %; inside the vessel
        # mask 12.4 %); qsmxt qsmart does not write its stage maps yet, so it is not localised
        # further.
        chimap: { nrmse_max: 18.9, correlation_min: 0.976, max_abs_max: 0.354, p99_abs_max: 0.0126 }
        measured:
          main: "run 40536005482: QSMxT main 8a7072a, qsm-core da928e0 (limits)"
          pinned: "run 40530165113: qsmxt v10.0.0 sha256:9258c10e…, NRMSE 65.94 %, r 0.8003"
      # In vivo (EMTP travelling head, KKI Philips 3 T, public). R_0 rejects no voxel here.
      s002001-kki-achieva-bridge-run1:
        feed: { totalfield: totalfield }
        # Measured: NRMSE 4.618 %, r 0.9990, max |Δ| 0.0640 ppm, p99 |Δ| 0.00435 ppm.
        chimap: { nrmse_max: 5.58, correlation_min: 0.988, max_abs_max: 0.0801, p99_abs_max: 0.00544 }
        measured:
          main: "run 40536005482: QSMxT main 8a7072a, qsm-core da928e0 (limits)"
          pinned: "run 40530165113: qsmxt v10.0.0 sha256:9258c10e…, NRMSE 133.8 %, r 0.5346"

  # ---- In vivo inputs. The KKI travelling head has no ground-truth fields, so a pair that starts
  # from a field gets one from QSM.rs steps run before its reference (`reference_prefix`), and the
  # candidate is fed exactly what the reference was given (`feed`): both sides start from the same
  # voxels, and only the pair's own step is compared. Prefix steps run the QSM.rs under test.

  # ---- STI Suite originals (MATLAB, compiled on the real toolboxes; fidelity: QSMxT/QSM-CI#304)
  ilsqr:
    reference: ilsqr-sti
    candidate: ilsqr-qsmrs
    enabled: false
    # QSM.rs main da928e0 (runs 40605505892, 40607732498): NRMSE sim 18.0 % (r 0.9837), KKI 17.2 %
    # (r 0.9853), on the same support; --pad-mm 12 (STI's padsize) changes nothing.
    blocked_by: QSMxT/QSM-CI#311   # STI Suite port gaps; a QSM.rs issue is to be filed (PR body)
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/ilsqr.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/padding.rs]
    qsmxt_paths: &invert_wiring [src/cli.rs, src/commands/common.rs, src/commands/invert.rs]
    datasets:
      sim: {}
      s002001-kki-achieva-bridge-run1:
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }
  vsharp:
    reference: vsharp-sti
    candidate: vsharp-qsmrs
    enabled: false
    # QSM.rs main da928e0 (runs 40605505892, 40607732498): NRMSE sim 40.7 % (r 0.934), KKI 58.5 %
    # (r 0.882), on the same eroded support; deconvolve false and the default give identical output.
    blocked_by: QSMxT/QSM-CI#311   # STI Suite port gaps; a QSM.rs issue is to be filed (PR body)
    qsmrs_paths: [src/bgremove/sharp.rs, src/bgremove/smv.rs, src/bgremove/vsharp.rs, src/error.rs,
                  src/fft.rs, src/grid.rs, src/inversion/medi.rs, src/kernels/,
                  src/pipeline/bg_removal.rs, src/pipeline/rules.rs, src/utils/padding.rs]
    qsmxt_paths: &bgremove_vsharp_wiring [src/cli.rs, src/commands/common.rs,
                                          src/commands/bgremove.rs,
                                          crates/qsmxt-engine/src/config.rs]
    # STI Suite's V_SHARP does not deconvolve; QSM.rs's vsharp does by default.
    candidate_set: { deconvolve: "false" }
    datasets:
      sim: {}
      s002001-kki-achieva-bridge-run1:
        reference_prefix: [laplacian-qsmrs]
        feed: { totalfield: totalfield }
  star:
    reference: star-sti
    candidate: star-qsmrs   # ci_skip until a qsmxt release has `qsmxt invert star`: runs against a build
    enabled: true
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/star.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/echo_time.rs,
                  src/utils/padding.rs]
    qsmxt_paths: *invert_wiring
    # star-sti scales the field to phase at the first echo (recon.m); star-qsmrs defaults to the sum.
    candidate_set: { te: first }
    datasets:
      sim:
        # Measured: NRMSE 0.326 %, r 0.999995, max |Δ| 0.00050 ppm, p99 |Δ| 0.00023 ppm.
        chimap: { nrmse_max: 0.859, correlation_min: 0.989, max_abs_max: 0.000623, p99_abs_max: 0.000288 }
        measured: { main: "run 40605505892: QSMxT main 8a7072a, QSM.rs main da928e0 (limits)" }
      # KKI travelling head: NRMSE 6.68 %, r 0.9983 (run 40605505892) — not a match yet, so no
      # limits; it joins once the in-vivo difference is explained (the STI Suite gap issue). Config
      # to run it by name: reference_prefix [laplacian-qsmrs, vsharp-qsmrs], feed {localfield}.
  medi:
    reference: medi-cornell
    candidate: medi-qsmrs
    enabled: true
    # medi-cornell v4 (QSMxT/QSM-CI#309) runs MEDI 2024.11.26 at its own defaults, which QSM.rs
    # main's MediParams share (names and values): both sides run their defaults.
    qsmrs_paths: [src/constants.rs, src/error.rs, src/fft.rs, src/grid.rs, src/inversion/medi.rs,
                  src/inversion/msmv.rs, src/inversion/tfi.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/bias_correction.rs,
                  src/utils/connected.rs, src/utils/echo_time.rs, src/utils/fibermetric.rs,
                  src/utils/frangi.rs, src/utils/gradient.rs, src/utils/mask.rs,
                  src/utils/morphology.rs, src/utils/morphology/signal_erosion.rs,
                  src/utils/multi_echo.rs, src/utils/r2star.rs]
    qsmxt_paths: *invert_wiring
    datasets:
      sim:
        # Measured: NRMSE 0.0290 %, r 1.000000, max |Δ| 0.00043 ppm, p99 |Δ| 2.2e-05 ppm.
        chimap: { nrmse_max: 0.532, correlation_min: 0.989, max_abs_max: 0.000535, p99_abs_max: 2.77e-05 }
        measured: { main: "run 40613723628: QSMxT main 8a7072a, QSM.rs main da928e0; medi-cornell v4 sha256:b81527b0… (limits)" }
      s002001-kki-achieva-bridge-run1:
        # Measured: NRMSE 0.0039 %, r 1.000000, max |Δ| 0.00017 ppm, p99 |Δ| 5.4e-06 ppm.
        chimap: { nrmse_max: 0.505, correlation_min: 0.989, max_abs_max: 0.000214, p99_abs_max: 6.75e-06 }
        measured: { main: "run 40613723628: QSMxT main 8a7072a, QSM.rs main da928e0; medi-cornell v4 sha256:b81527b0… (limits)" }
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }

  # ---- MATLAB originals (QSMxT/QSM-CI#309)
  amp-pe:
    reference: amp-pe       # ci_skip for scoring (diverges on real multi-echo data); parity runs it
    candidate: amp-pe-qsmrs  # runner: self-hosted, so the pair's job runs there (about 1 h)
    enabled: true
    qsmrs_paths: [src/constants.rs, src/error.rs, src/fft.rs, src/grid.rs, src/inversion/admm.rs,
                  src/inversion/amp_pe.rs, src/kernels/, src/pipeline/inversion.rs,
                  src/pipeline/rules.rs, src/utils/gradient.rs, src/utils/ops.rs,
                  src/utils/special.rs, src/utils/wavelet.rs]
    qsmxt_paths: *invert_wiring
    datasets:
      # In silico only: on the KKI travelling head the original was killed (exit 137) on the
      # self-hosted runner (run 40605505892), as it diverges on real multi-echo data.
      sim:
        # Measured: NRMSE 0.477 %, r 0.99999, max |Δ| 0.0362 ppm, p99 |Δ| 0.00046 ppm.
        chimap: { nrmse_max: 1.03, correlation_min: 0.989, max_abs_max: 0.0453, p99_abs_max: 0.000571 }
        measured: { main: "run 40605505892: QSMxT main 8a7072a, QSM.rs main da928e0 (limits)" }
  decompose:
    reference: decompose-qsm   # ci_skip for scoring (hours per run); parity runs it, self-hosted
    candidate: decompose-qsmrs
    enabled: true
    # The port follows the reference (astewartau/QSM.rs#333, #338, #339): principal-branch phases,
    # a QSM per echo, MATLAB lsqcurvefit's trust-region-reflective solver, and MATLAB's elementary
    # functions (FDLIBM 5.3). The remainder is rounding in the ~2 % of voxels where a compartment
    # collapses, where the fit has no unique answer: a 1-ulp change inside QSM.rs moves QSM.rs
    # against itself by the same amount (χ+ 4.86 %, χ− 4.05 %). MATLAB is bit-repeatable across
    # CPUs and worker counts. Details: astewartau/QSM.rs#329.
    qsmrs_paths: [src/error.rs, src/pipeline/rules.rs, src/pipeline/separation.rs,
                  src/separation/decompose.rs, src/separation/mod.rs, src/solvers/,
                  src/utils/fdlibm.rs]
    qsmxt_paths: &separate_wiring [src/cli.rs, src/commands/common.rs, src/commands/separate.rs,
                                   crates/qsmxt-engine/src/bridge.rs]
    datasets:
      chisep-mc:
        # Measured: χ+ NRMSE 4.90 %, r 0.9983, max |Δ| 0.045 ppm, p99 |Δ| 0.0020 ppm;
        # χ− NRMSE 4.22 %, r 0.9986, max 0.035, p99 0.0041 (with #339: 4.89 % / 4.20 %, local run).
        chi-para: { nrmse_max: 5.9, correlation_min: 0.988, max_abs_max: 0.0561, p99_abs_max: 0.00255 }
        chi-dia: { nrmse_max: 5.14, correlation_min: 0.988, max_abs_max: 0.0442, p99_abs_max: 0.0051 }
        measured: { main: "run 40808807722: QSM.rs#338 e8f434c with QSMxT main + #448; decompose-qsm sha256:a273a9b3… (limits)" }

  # ---- Python originals (QSMxT/QSM-CI#312)
  wavesep:
    reference: wavesep        # WaveSep f3a192e, unmodified (fidelity: QSMxT/QSM-CI#312)
    candidate: wavesep-qsmrs  # added by #312
    enabled: false
    # Baseline on chisep-mc (run 40620192564: QSMxT main 8a7072a, QSM.rs main da928e0, both sides
    # Dr 137, λ 0.02, α 0.2, db4, 100 iterations): χ+ NRMSE 11.9 % (r 0.9829, max |Δ| 0.041 ppm,
    # p99 |Δ| 0.017 ppm), χ− 10.4 % (r 0.9674, max 0.036, p99 0.013). #312's synthetic case agrees to
    # 0.11 % / 1.1 %, so the port differs from the original on this phantom; cause not found yet
    # (reported on #312). Not enabled until it is.
    blocked_by: QSMxT/QSM-CI#312
    qsmrs_paths: [src/error.rs, src/grid.rs, src/pipeline/rules.rs, src/pipeline/separation.rs,
                  src/separation/mod.rs, src/separation/wavesep.rs, src/utils/wavelet.rs]
    qsmxt_paths: *separate_wiring
    datasets:
      chisep-mc: {}

  # ---- Julia originals (QSM.jl, ROMEO.jl, TGV.jl in the pinned julia-qsm image; QSMxT/QSM-CI#307).
  # Parity only: never scored (`parity_only: true`). Matched settings: each README's "QSM.rs-matched"
  # column.
  tkd:
    reference: tkd-qsmjl
    candidate: tkd-qsmrs
    enabled: false
    # Fix pending: QSM.jl's fast-FFT padding by default (draft astewartau/QSM.rs#323, stacked on
    # #321); the matched pad=-1 below is for main. QSMxT main does not build against #321-#323 yet
    # (rechecked at 2a3a373 / 8e30a54, run 40620298336), so they are unmeasured.
    blocked_by: astewartau/QSM.rs#323
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/tkd.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/mask.rs,
                  src/utils/padding.rs]
    qsmxt_paths: *invert_wiring
    reference_set: { pad: -1 }
    datasets:
      sim:
        # QSM.rs main da928e0, matched settings: NRMSE 0 % (identical).
      s002001-kki-achieva-bridge-run1:
        # QSM.rs main da928e0, matched settings: NRMSE 0.689 %, r 0.99998, max |Δ| 0.00278 ppm, p99 |Δ| 0.00095 ppm.
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }
  tsvd:
    reference: tsvd-qsmjl
    candidate: tsvd-qsmrs
    enabled: false
    # Fix pending: QSM.jl's fast-FFT padding by default (draft astewartau/QSM.rs#323, stacked on
    # #321); the matched pad=-1 below is for main. QSMxT main does not build against #321-#323 yet
    # (rechecked at 2a3a373 / 8e30a54, run 40620298336), so they are unmeasured.
    blocked_by: astewartau/QSM.rs#323
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/tkd.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/mask.rs,
                  src/utils/padding.rs]
    qsmxt_paths: *invert_wiring
    reference_set: { pad: -1 }
    datasets:
      sim:
        # QSM.rs main da928e0, matched settings: NRMSE 0 % (identical).
      s002001-kki-achieva-bridge-run1:
        # QSM.rs main da928e0, matched settings: NRMSE 0.570 %, r 0.99998, max |Δ| 0.00205 ppm, p99 |Δ| 0.00060 ppm.
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }
  tikhonov:
    reference: tikhonov-qsmjl
    candidate: tikhonov-qsmrs
    enabled: false
    # Fix pending: QSM.jl's fast-FFT padding by default (draft astewartau/QSM.rs#323, stacked on
    # #321); the matched pad=-1 below is for main. QSMxT main does not build against #321-#323 yet
    # (rechecked at 2a3a373 / 8e30a54, run 40620298336), so they are unmeasured.
    blocked_by: astewartau/QSM.rs#323
    qsmrs_paths: [src/fft.rs, src/grid.rs, src/inversion/tikhonov.rs, src/kernels/,
                  src/pipeline/inversion.rs, src/pipeline/rules.rs, src/utils/mask.rs,
                  src/utils/padding.rs]
    qsmxt_paths: *invert_wiring
    reference_set: { pad: -1 }
    datasets:
      sim:
        # QSM.rs main da928e0, matched settings: NRMSE 0 % (identical).
      s002001-kki-achieva-bridge-run1:
        # QSM.rs main da928e0, matched settings: NRMSE 0.519 %, r 0.99999, max |Δ| 0.00175 ppm, p99 |Δ| 0.00059 ppm.
        reference_prefix: [laplacian-qsmrs, vsharp-qsmrs]
        feed: { localfield: localfield }
  tv:
    reference: tv-qsmjl
    candidate: tv-qsmrs
    enabled: false
    # Fix pending: QSM.jl's fast-FFT padding by default (draft astewartau/QSM.rs#323, stacked on
