  # iQSM, iQSM+ and iQFM take every echo's wrapped phase (4-D), as the originals do (`run.py
  # --echo_4d`), so the pairs start from the dataset's own inputs: no prefix, no feed. Per echo the
  # ports match the networks to float32 rounding (astewartau/QSM.rs#330). The echo weighting of the
  # authors' code is not consistent (checked 2026-10-31, sunhongfu/iQSM 81f5462, iQSM_Plus 3ba25f5):
  #   - iQSM and iQFM in MATLAB: echofit(TE·χ, mag, TE), i.e. weights mag·TE² (iQSM
  #     legacy/matlab/demo_multi_echo.m:155-160 with iQSM_fcns/echofit.m; iQSM_Plus
  #     legacy/matlab/iQSM.m:262-267, legacy/matlab/iQFM.m:265-270, iQFM_multi_echo.m).
  #   - iQSM+ in MATLAB: weights (mag·TE)² (iQSM_Plus legacy/matlab/iQSM_plus.m:273-275).
  #   - Every Python driver: (mag·TE)² (iQSM run.py:170, app.py:416; iQSM_Plus run.py:199,
  #     app.py:415), although each prints "Magnitude × TE² weighted averaging".
  # QSM-CI's iqsm, iqsm-plus and iqfm entries run the Python drivers, so (mag·TE)² on both sides:
  # QSM.rs's default since astewartau/QSM.rs#385 / QSMxT/QSMxT#467 (`--echo-weighting mag2-te2`;
  # the MATLAB mag·TE² is `mag-te2`, an option for iQSM and iQFM only).
