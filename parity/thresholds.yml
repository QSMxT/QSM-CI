  fit-ppm-complex:
    reference: fit-ppm-complex-cornell   # MEDI 2024.11.26 Fit_ppm_complex + unwrapPhase (#322)
    candidate: fit-ppm-complex-qsmrs     # ci_skip for scoring: v10.0.0 has no complex fit
    enabled: true
    # The whole field map: the candidate unwraps with QSM.rs's port of MEDI's region-growing
    # unwrapPhase (`qsmxt fieldmap medi-region-growing`, astewartau/QSM.rs#425), not its default
    # ROMEO. With ROMEO the total fields differed by unwrapper (sim 3.8 %, KKI 7.6 % NRMSE) and the
    # pair was intermediates only. The intermediates are compared by name as before: ifreq_raw (the
    # fit before unwrapping, rad per echo spacing, wrapped), n_std (its noise map) and r2star
    # (ARLO). Both sides write them in MEDI's units and sign; the candidate writes float32, hence
    # ~2.5e-6 % NRMSE.
    candidate_set: { unwrapping: medi-region-growing }
    # ARLO: QSM.rs clamps negative R2* at 0 (a documented deviation, src/utils/r2star.rs), where
    # arlo.m returns negative noise estimates; unclamped the maps differ by exactly those voxels
    # (sim 4068 voxels, NRMSE 0.91 %, max |Δ| 108 Hz; KKI 18985, 3.87 %, 96 Hz) and agree to float32
    # rounding everywhere else. The reference's r2star is clamped the same way before comparing.
    reference_names: { r2star: { name: r2star, clip_min: 0 } }
    qsmrs_paths: [src/error.rs, src/grid.rs, src/pipeline/field_mapping.rs,
                  src/pipeline/phase_utils.rs, src/pipeline/rules.rs,
                  src/unwrap/medi_region_growing.rs, src/utils/multi_echo.rs, src/utils/r2star.rs]
    # `qsmxt fieldmap medi-region-growing --complex-fit-output/--complex-fit-noise-output`
    # (QSMxT/QSMxT#462) and `qsmxt r2star`; written out because &fieldmap_wiring is defined
    # further down.
    qsmxt_paths: [src/cli.rs, src/commands/common.rs, src/commands/fieldmap.rs,
                  src/commands/r2star.rs, src/pipeline/config.rs,
                  crates/qsmxt-engine/src/bridge.rs, crates/qsmxt-engine/src/fieldmap.rs]
    datasets:
      sim:
        # Measured: totalfield identical (NRMSE 0, max |Δ| 0 ppm, both float32); ifreq_raw NRMSE
        # 2.55e-06 %, max |Δ| 1.2e-07; n_std 2.51e-06 %, 1.1e-07; r2star (clamped reference)
        # 2.6e-06 %, max |Δ| 1.5e-05 Hz. All float32 rounding.
        totalfield: { nrmse_max: 0.501, correlation_min: 0.99, max_abs_max: 1.0e-06, p99_abs_max: 1.0e-06 }
        intermediates:
          ifreq_raw: { nrmse_max: 0.501, correlation_min: 0.99, max_abs_max: 1.0e-06, p99_abs_max: 1.0e-06 }
          n_std: { nrmse_max: 0.501, correlation_min: 0.989, max_abs_max: 1.0e-06, p99_abs_max: 1.0e-06 }
          r2star: { nrmse_max: 0.501, correlation_min: 0.99, max_abs_max: 1.86e-05, p99_abs_max: 4.08e-06 }
        measured:
          main: "run 41383188529: QSMxT main 865a92f, QSM.rs main a44046e; matlab-medi sha256:7efa4bd6… (intermediates' limits)"
          pr425: "run 41635345604: QSMxT af9262d (QSMxT/QSMxT medi-region-growing), QSM.rs 17bf7b8 (astewartau/QSM.rs#425); matlab-medi sha256:7efa4bd6… (totalfield limits)"
      s002001-kki-achieva-bridge-run1:
        # Measured: totalfield identical (NRMSE 0, max |Δ| 0 ppm); ifreq_raw NRMSE 2.56e-06 %,
        # max |Δ| 1.2e-07; n_std 2.42e-06 %, 5.1e-13; r2star (clamped reference) 2.5e-06 %,
        # max |Δ| 1.4e-05 Hz.
        totalfield: { nrmse_max: 0.501, correlation_min: 0.989, max_abs_max: 1.0e-06, p99_abs_max: 1.0e-06 }
        intermediates:
          ifreq_raw: { nrmse_max: 0.501, correlation_min: 0.99, max_abs_max: 1.0e-06, p99_abs_max: 1.0e-06 }
          n_std: { nrmse_max: 0.501, correlation_min: 0.989, max_abs_max: 1.0e-06, p99_abs_max: 1.0e-06 }
