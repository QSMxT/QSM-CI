name: score

# Recompute leaderboard results and publish viewer volumes — only when something actually changed
# (not on a weekly timer). Scoring is PARALLELISED across GitHub-hosted runners: a full re-run is
# split into N disjoint shards (pipeline.py --shard i/N, column-sharded so each bfr localfield is
# computed once), a focused re-run fans out one job per changed slug. Each job writes its own runs +
# volumes; a single merge job combines them, publishes volumes to Hugging Face, and commits the
# small results/index.json (which triggers the Pages deploy).
#
# Scope (scripts/score_plan.py — the `plan` job):
#   - everything changed on main since the last COMPLETED scoring (results/scoring-state.json),
#     plus whatever an earlier run planned but did not finish, minus what another still-running
#     score run is already covering at an up-to-date commit. So a cancelled / displaced / timed-out
#     run's work is picked up by the next run instead of being silently lost.
#   - a changed algorithm  -> that algorithm's isolated run + every composed combo that includes it
#   - changed scorer / orchestration (eval, pipeline, stages) -> a full re-run of everything
#   - `[skip score]` in a commit message -> that commit contributes nothing to the scope (per commit,
#     so it still holds when later real changes are bundled into the same run). Unlike GitHub's own
#     skip token it stops ONLY scoring: the tests still run and the Pages deploy still fires.
#   - an algorithm.yml edit that cannot move a number (description, authors, runner tier, …) does
#     not rescore the method.
#
# Concurrency: there is deliberately NO workflow-level group. The old one ("one rescore at a time")
# queued whole runs behind each other for a day, and GitHub keeps only ONE pending run per group —
# a third push cancelled the second and its scope was never scored. Instead:
#   - each score TASK has its own concurrency group (score-<task id>) with cancel-in-progress: a
#     newer commit's f-medi cancels an older run's f-medi (which was going to be overwritten) and
#     leaves that run's other tasks alone; unrelated pushes overlap freely.
#   - a cancelled/timed-out task still uploads the rows it finished (pipeline.py flushes after every
#     row; the upload runs `if: always()`), and merge publishes them. The `.done` marker says whether
#     the task completed; the rest becomes `pending` in results/scoring-state.json for the next run.
#   - merge jobs serialise themselves (lowest run id first) so two never publish/commit at once.
#
# Runner tiers (`runner:` in algorithm.yml — see scripts/score_plan.py): hosted (default, inside the
# shard sweep), hosted-large, self-hosted (own focus job on the private 31 GB box; may exceed 6 h via
# timeout_minutes:), and manual/gpu — NEVER scheduled automatically, only by a workflow_dispatch that
# names the slug in `scope` (or include_manual=true). MoDIP and INR-QSM are manual: one inversion takes
# ~12-17 h on the shared box, so no cap makes them feasible automatically.

on:
  push:
    branches: [main]
    paths:
      - "algorithms/**"
      - "eval/**"
      - "scripts/pipeline.py"
      - "scripts/publish_volumes.py"
      - "stages.yml"
      # NB: score.yml itself is intentionally NOT here — editing the workflow shouldn't rescore the
      # world. For a real scoring-logic change, dispatch with scope=all.
  workflow_dispatch:
    inputs:
      scope:
        description: "all | <comma-separated slugs> (default: auto = everything unscored since the last completed run). Naming a manual-tier slug (modip, inr-qsm) or a method with manual_phantoms scores it."
        default: "auto"
      include:
        description: "MANUAL recovery only: comma-separated slugs; re-score ONLY the composed pipelines they form (gt is always a field source, so 'bfrnet,medi-cornell' -> gt~bfrnet~medi-cornell; add a field-mapping slug for its prefix). Use to refill a combo that DNF'd on a transient/infra failure. Overrides scope. NOT for algorithm changes — those must re-score the full matrix."
        default: ""
      include_manual:
        description: "true = also plan the manual-tier methods / manual phantoms (with scope=all: the WHOLE matrix incl. modip + inr-qsm; expect days of self-hosted time)"
        default: "false"
      shards:
        description: "number of parallel shards for a full re-run"
        default: "12"
      dry_run:
        description: "true = score + merge but DON'T publish volumes or commit (upload a candidate index artifact instead)"
        default: "false"

defaults:
  run:
    shell: bash

# Read-only token by default: the plan/score jobs only run method containers and pass artifacts
# around. Only `merge` commits (job-level `contents: write` there).
permissions:
  contents: read
  actions: read   # plan reads other in-progress runs; the orphan-container reaper checks a run's status

env:
  TRACK: sim
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"   # shallow checkout has no tags for setuptools-scm
  # GitHub-hosted runners have ~16 GB RAM; pipeline.py's default of 4 concurrent containers (tuned for
  # the ~31 GB self-hosted box) OOM-kills the runner when MATLAB/DL containers coincide ("hosted runner
  # lost communication"). Cap at 2 — parallelism comes from the shard matrix, not intra-shard threads.
  QSM_CI_JOBS: "2"

jobs:
  # What to score and where: scripts/score_plan.py (unit-tested in tests/test_score_plan.py).
  plan:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
      full: ${{ steps.plan.outputs.full }}
      slugs: ${{ steps.plan.outputs.slugs }}
      base: ${{ steps.plan.outputs.base }}
      skipped_manual: ${{ steps.plan.outputs.skipped_manual }}   # manual-tier tasks owed but not scheduled
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the scope walks main back to the last completed scoring
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}   # fallback base when there is no scoring-state yet
          # Dispatch inputs: via env, never interpolated into a script (free-text fields).
          SCOPE: ${{ github.event.inputs.scope }}
          INCLUDE: ${{ github.event.inputs.include }}
          INCLUDE_MANUAL: ${{ github.event.inputs.include_manual }}
          SHARDS: ${{ github.event.inputs.shards }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}   # lets the planner skip tasks another running score run already covers
        run: |
          pip install -q pyyaml
          python3 scripts/score_plan.py

  score:
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    # One group per TASK: a newer run's copy of this task supersedes an older run's (its rows were
    # about to be overwritten anyway), and nothing else is touched. The cancelled job still uploads
    # the rows it finished (see the always() upload below).
    concurrency:
      group: score-${{ matrix.task.id }}
      cancel-in-progress: true
    # Runner, wall-clock budget and intra-job container parallelism are chosen per task by the plan
    # job (ubuntu-latest/360/2 by default; the 31 GB self-hosted runners/360/4 for `runner: self-hosted`
    # methods, with per-method timeout_minutes:/jobs: overrides). QSM_CI_JOBS here overrides the
    # workflow-level cap of 2.
    runs-on: ${{ matrix.task.runs_on }}
    timeout-minutes: ${{ matrix.task.timeout }}
    env:
      QSM_CI_JOBS: ${{ matrix.task.jobs }}
      # Per-job container tag — qsm_ci.containers labels every container it starts with this, so the
      # post-job kill step (and the next job's reaper) can identify exactly THIS job's containers.
      QSMCI_JOB_TAG: ${{ github.run_id }}-${{ matrix.task.id }}
      # Matrix values derive from the dispatch inputs (scope / include slugs): they reach the shell
      # through env, never interpolated into a `run:` script.
      TASK_ID: ${{ matrix.task.id }}
      PHANTOM: ${{ matrix.task.phantom || 'sim' }}
    steps:
      - uses: actions/checkout@v7

      # Persistent self-hosted boxes: cancelling an Actions job kills the docker CLIENT process but
      # NOT its container (`--rm` only cleans up after exit), so cancelled score runs used to leave
      # MATLAB/DL containers silently consuming the shared 31 GB runner's memory for hours — until
      # the oom-killer started taking out OTHER runs' jobs (observed 2026-08-26: ~27 GB of orphans).
      # Reap running qsm-ci containers whose owning run (the qsmci.run label, stamped by
      # qsm_ci.containers) is no longer active; unlabeled qsm-ci-* strays are reaped past 12 h.
      # Anything unconfirmable is kept (fail-safe). No-op on hosted runners (fresh VM every job).
      - name: Reap orphaned qsm-ci containers (self-hosted)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QSMCI_JOB_TAG: ${{ github.run_id }}-${{ matrix.task.id }}
        run: |
          command -v docker >/dev/null 2>&1 || exit 0
          python3 - <<'PY'
          import datetime, json, os, subprocess, urllib.request, urllib.error
          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout.strip()
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)
          ids = sh("docker", "ps", "-q", "--filter", "label=qsmci").split()
          ids += [i for i in sh("docker", "ps", "-q", "--filter", "name=qsm-ci-").split() if i not in ids]
          now = datetime.datetime.now(datetime.timezone.utc)
          me, mytag = os.environ["RUN_ID"], os.environ.get("QSMCI_JOB_TAG", "")
          active_names = None   # in-progress job names of MY run, fetched once on first need
          for c in ids:
              info = json.loads(sh("docker", "inspect", c) or "[]")
              if not info:
                  continue
              labels = info[0]["Config"].get("Labels") or {}
              rid, jtag = labels.get("qsmci.run"), labels.get("qsmci.job")
              kill = False
              if rid == me:
                  # Same run: my own / untagged containers are sacrosanct; another job's container is
                  # kept ONLY while that job is still in progress (else it's a failed sibling's
                  # leftover — the very orphans that cascaded OOM through a long run's later jobs).
                  if not jtag or jtag == mytag:
                      continue
                  if active_names is None:
                      try:
                          active_names = [j["name"] for j in api(f"/repos/{os.environ['REPO']}/actions/runs/{me}/jobs?per_page=100&filter=latest").get("jobs", [])
                                          if j.get("status") == "in_progress"]
                      except Exception:
                          active_names = None
                  if active_names is None:
                      continue                          # can't confirm -> keep
                  sfx = jtag[len(me) + 1:]
                  kill = not any(("(" + sfx + ",") in n or ("(" + sfx + ")") in n for n in active_names)
              elif rid:
                  try:
                      kill = api(f"/repos/{os.environ['REPO']}/actions/runs/{rid}").get("status") == "completed"
                  except urllib.error.HTTPError as e:
                      kill = e.code == 404              # run gone entirely
                  except Exception:
                      kill = False                      # can't confirm -> keep
              else:
                  started = info[0]["State"]["StartedAt"][:19] + "+00:00"
                  kill = (now - datetime.datetime.fromisoformat(started)).total_seconds() > 12 * 3600
              if kill:
                  print("reaping orphaned container %s (run %s, job %s)" % (c, rid or "-", jtag or "-"))
                  sh("docker", "kill", c)
          PY

      - name: Install qsm-ci CLI + scorer deps
        run: |
          pip install -r eval/requirements.txt huggingface_hub
          pip install --upgrade setuptools setuptools_scm wheel
          pip install --no-build-isolation .

      # Resolve the task's phantom against the dataset registry (scripts/datasets.json): the
      # per-phantom OSF zip cache key (osf-<phantom>-<file-id>), the local dataset path, and the
      # scoring mode. Workflows can't index `secrets` dynamically, so each per-phantom OSF_FILE_*
      # secret is passed into env here and the registry entry's `osf_env` picks the right one by
      # name — adding a phantom = a scripts/datasets.json entry + one OSF_FILE_* env line here
      # and on the fetch step below (named OSF_FILE_<PHANTOM-ID, uppercased, dashes→underscores>).
      - name: Resolve dataset (scripts/datasets.json)
        id: ds
        env:
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}   # invivo_qsm2016.zip OSF file id (pre-flattened)
          OSF_FILE_RIDANI_3T_ISO: ${{ secrets.OSF_FILE_RIDANI_3T_ISO }}      # Ridani 3T isotropic (pre-flattened)
          OSF_FILE_RIDANI_3T_ANISO: ${{ secrets.OSF_FILE_RIDANI_3T_ANISO }}  # Ridani 3T anisotropic (pre-flattened)
          OSF_FILE_RIDANI_7T_ANISO: ${{ secrets.OSF_FILE_RIDANI_7T_ANISO }}  # Ridani 7T anisotropic (pre-flattened)
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}              # χ-sep multicompartment (pre-flattened)
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ph = os.environ['PHANTOM']
          d = json.load(open('scripts/datasets.json'))[ph]
          osf = (os.environ.get(d['osf_env']) if d.get('osf_env') else None) or d.get('osf_file') or ''
          print(f"zipkey=osf-{ph}-{osf}")
          print(f"path={d['path']}")
          # sim runs the QSM composed matrix; chisep runs the GRE-only composed matrix (R2′
          # generators × χ-sep methods); in-vivo is isolated-only (no composable GT boundary).
          print("mode=" + ("both" if d['track'] in ('sim', 'chisep') else "isolated"))
          PY
      - name: Cache OSF dataset zip
        uses: actions/cache@v6
        with:
          path: .osfcache/${{ matrix.task.phantom || 'sim' }}.zip
          key: ${{ steps.ds.outputs.zipkey }}
      - name: Fetch dataset (public inputs + held-out ground truth)
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}   # invivo_qsm2016.zip OSF file id (pre-flattened)
          OSF_FILE_RIDANI_3T_ISO: ${{ secrets.OSF_FILE_RIDANI_3T_ISO }}      # Ridani 3T isotropic (pre-flattened)
          OSF_FILE_RIDANI_3T_ANISO: ${{ secrets.OSF_FILE_RIDANI_3T_ANISO }}  # Ridani 3T anisotropic (pre-flattened)
          OSF_FILE_RIDANI_7T_ANISO: ${{ secrets.OSF_FILE_RIDANI_7T_ANISO }}  # Ridani 7T anisotropic (pre-flattened)
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}              # χ-sep multicompartment (pre-flattened)
          OSF_ZIP: .osfcache/${{ matrix.task.phantom || 'sim' }}.zip
          DS_PATH: ${{ steps.ds.outputs.path }}
        run: scripts/fetch_dataset.sh "$PHANTOM" "$DS_PATH"

      - name: Score task ${{ matrix.task.id }}
        env:
          DS_PATH: ${{ steps.ds.outputs.path }}
          DS_MODE: ${{ steps.ds.outputs.mode }}
          TASK_MODE: ${{ matrix.task.mode }}
          TASK_TRACK: ${{ matrix.task.track }}
          SHARD: ${{ matrix.task.shard }}
          FOCUS: ${{ matrix.task.focus }}
          EXCLUDE: ${{ matrix.task.exclude }}
          INCLUDE: ${{ matrix.task.include }}
        run: |
          MODE="$DS_MODE"
          [ -n "$TASK_MODE" ] && MODE="$TASK_MODE"   # manual-include task pins 'composed'
          # Track defaults to $TRACK (sim); an invivo task overrides it so pipeline.py scores against
          # COSMOS + STI and namespaces its run ids with `-invivo`. --phantom namespaces the run ids
          # of a NON-default phantom with -<phantom-id> (the default phantoms keep the legacy ids).
          TRK="$TASK_TRACK"; [ -z "$TRK" ] && TRK="$TRACK"
          ARGS="--dataset $DS_PATH --phantom $PHANTOM --mode $MODE --runner docker --track $TRK --emit-volumes --runs-out runs-$TASK_ID.json"
          [ -n "$SHARD" ] && ARGS="$ARGS --shard $SHARD"
          [ -n "$FOCUS" ] && ARGS="$ARGS --focus $FOCUS"
          [ -n "$EXCLUDE" ] && ARGS="$ARGS --exclude $EXCLUDE"
          [ -n "$INCLUDE" ] && ARGS="$ARGS --include $INCLUDE"
          echo "== task $TASK_ID: pipeline.py $ARGS =="
          t0=$(date +%s)
          python scripts/pipeline.py $ARGS
          echo "== task $TASK_ID wall-clock: $(( $(date +%s) - t0 ))s =="


      # Belt to the reaper's braces: whatever way this job ends (incl. a failed score step — exit 137
      # still runs `always()` steps), kill the containers IT started, so a long run's later
      # self-hosted jobs never inherit them. Only a whole-runner death skips this; the next job's
      # reaper covers that via the same-run job-tag check.
      - name: Kill this job's containers
        if: always()
        continue-on-error: true
        run: |
          command -v docker >/dev/null 2>&1 || exit 0
          [ -n "$QSMCI_JOB_TAG" ] && docker ps -q --filter "label=qsmci.job=$QSMCI_JOB_TAG" | xargs -r docker kill || true

      # ALWAYS upload: pipeline.py flushes runs-<id>.json after every scored row and writes
      # runs-<id>.done only when the task completed, so a job killed at its cap / cancelled by a newer
      # commit / failed still hands merge everything it finished — and merge can tell it did not finish.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-${{ matrix.task.id }}
          retention-days: 1
          if-no-files-found: ignore   # killed before pipeline.py wrote anything
          path: |
            runs-${{ matrix.task.id }}.json
            runs-${{ matrix.task.id }}.done
            results
            !results/index.json
            !results/scoring-state.json

  merge:
    needs: [plan, score]
    # Publish whatever finished scoring — even if a leg failed, timed out, or was cancelled by a newer
    # run's copy of the same task. merge downloads the shard artifacts that exist and merges their rows
    # into results/index.json by run-id; a task that uploaded no rows keeps its previous score, and
    # every task that did not complete (no runs-<id>.done) is recorded as pending in
    # results/scoring-state.json so the next run plans it again. We need always() here: without it,
    # one cancelled leg would skip merge and block the ENTIRE publish, including every finished task.
    if: ${{ always() && needs.plan.result == 'success' && needs.score.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that commits (results/index.json + results/scoring-state.json)
      actions: read     # the merge lock and the squash step look at other runs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          merge-multiple: true
          path: .

      - name: Merge deps
        run: pip install -r eval/requirements.txt huggingface_hub

      # Runs overlap now (no workflow-level concurrency group), so two merges could otherwise publish
      # volumes and commit at the same time. Wait while an OLDER run's merge job is still in progress
      # (lowest run id goes first — a total order, so no two merges ever wait on each other). A
      # concurrency group would do this too, but GitHub cancels the second PENDING run in a group,
      # which is exactly the silent loss this workflow was rewritten to avoid.
      - name: Wait for older merges
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 120); do
            busy=$(gh api "repos/$REPO/actions/workflows/score.yml/runs?status=in_progress&per_page=50" \
                     --jq "[.workflow_runs[] | select(.id < ($RUN_ID | tonumber)) | .id] | .[]" \
                   | while read -r rid; do
                       gh api "repos/$REPO/actions/runs/$rid/jobs?per_page=100&filter=latest" \
                         --jq '.jobs[] | select(.name == "merge" and .status == "in_progress") | .run_id'
                     done | head -1)
            [ -z "$busy" ] && exit 0
            echo "merge of run $busy is in progress — waiting (${i}/120)"; sleep 30
          done
          echo "::warning::gave up waiting for an older merge after 60 min; proceeding"

      - name: Merge shard runs into results/index.json
        run: |
          # Preserve the index this rescore STARTED from (its checkout base) — the commit step needs
          # it to re-apply only the runs THIS rescore changed onto the latest main at push time.
          cp results/index.json /tmp/base-index.json
          python3 - <<'PY'
          import json, glob
          from collections import Counter
          runs = []
          for f in sorted(glob.glob("runs-*.json")):
              runs += json.load(open(f))
          dup = [i for i, c in Counter(r["id"] for r in runs).items() if c > 1]
          # Dedupe by id (last wins) so two focus jobs that legitimately share a combo (e.g. two
          # dedicated methods composing with each other) can never write the same id twice.
          runs = list({r["id"]: r for r in runs}.values())
          idx = json.load(open("results/index.json"))
          ids = {r["id"] for r in runs}
          merged = [r for r in idx["runs"] if r.get("id") not in ids] + runs
          json.dump({"generated": None, "runs": merged}, open("results/index.json", "w"), indent=2)
          dnf = sorted(r["id"] for r in runs if r.get("status") == "DNF")
          partial = sorted(f[5:-5] for f in glob.glob("runs-*.json") if not glob.glob(f[:-5] + ".done"))
          print(f"merged {len(runs)} shard runs; index now {len(merged)} total")
          print(f"duplicate ids across shards: {dup or 'none (partition OK)'}")
          print(f"DNF ({len(dnf)}): {', '.join(dnf) if dnf else 'none'}")
          print(f"tasks that did NOT complete (rows kept, task re-planned next run): {', '.join(partial) or 'none'}")
          PY

      # --prune: delete what this publish demonstrably replaced (always), and, after a publish whose
      # every upload landed, run artifacts in the touched buckets that no index row references any
      # more (retired methods). A file that is the only copy a row points at is never deleted — a
      # run whose upload failed keeps its earlier copy (volumes_stale). See publish_volumes.py.
      - name: Publish volumes to Hugging Face
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
        run: python scripts/publish_volumes.py results --prune

      # Deleting or overwriting a volume leaves its old LFS object in the Hub repo's history; only a
      # squash frees the storage. A full rescore rewrites every volume, so squash after one (a
      # focused rescore churns too little to matter). Best-effort, like the publish. The repro
      # workflow and other score runs' merges are the other writers; if one is mid-publish, leave the
      # squash to the next full rescore rather than overlap.
      - name: Squash HF volume history (full rescore)
        if: ${{ github.event.inputs.dry_run != 'true' && needs.plan.outputs.full == 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          busy=$(gh run list --workflow repro.yml --status in_progress --json databaseId --jq length)
          others=$(gh run list --workflow score.yml --status in_progress --json databaseId --jq "[.[] | select(.databaseId != ($RUN_ID | tonumber))] | length")
          if [ "$busy" != "0" ] || [ "$others" != "0" ]; then
            echo "::notice::squash skipped: $busy repro.yml + $others other score.yml run(s) in progress may be publishing volumes; the next full rescore will squash."
            exit 0
          fi
          python scripts/squash_hf_history.py

      - name: Commit results index + scoring state (triggers the Pages deploy)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TASKS: ${{ needs.plan.outputs.tasks }}   # via env: derived from free-text dispatch inputs
          SHA: ${{ github.sha }}
          SKIPPED_MANUAL: ${{ needs.plan.outputs.skipped_manual }}
        run: |
          git config user.name  "qsm-ci-bot"
          git config user.email "qsm-ci@users.noreply.github.com"
          printf '%s' "$TASKS" > /tmp/tasks.json
          printf '%s' "${SKIPPED_MANUAL:-[]}" > /tmp/skipped-manual.json
          # This rescore's scored output (base + freshly scored runs).
          cp results/index.json /tmp/scored-index.json
          # Never `git pull --rebase` results/index.json: a rescore based on a commit before another
          # rescore's results landed conflicts on the same file, leaving the loop stuck on "unmerged
          # files" (the #72 / observed BFRnet-publish failure). Instead, each attempt takes the LATEST
          # index from main and re-applies ONLY the runs THIS rescore changed (by id, via
          # merge_index.py), so concurrent rescores of different slugs never clobber each other. The
          # scoring state is likewise recomputed on top of the latest main each attempt.
          for attempt in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q          # HEAD + results/* = latest main
            python3 scripts/merge_index.py /tmp/base-index.json /tmp/scored-index.json \
                    results/index.json results/index.json
            python3 scripts/score_state.py --state results/scoring-state.json --sha "$SHA" \
                    --tasks /tmp/tasks.json --done-dir . --skipped-manual /tmp/skipped-manual.json
            git add results/index.json results/scoring-state.json
            git diff --cached --quiet && { echo "no changes to publish"; exit 0; }
            git commit -q -m "Update results"
            git push && exit 0
            echo "push attempt $attempt rejected — re-applying onto latest main"; sleep $((attempt * 3))
          done
          echo "::error::could not push results after 5 attempts"; exit 1

      - name: (dry-run) upload candidate index instead of committing
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          TASKS: ${{ needs.plan.outputs.tasks }}
          SKIPPED_MANUAL: ${{ needs.plan.outputs.skipped_manual }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s' "$TASKS" > /tmp/tasks.json
          printf '%s' "${SKIPPED_MANUAL:-[]}" > /tmp/skipped-manual.json
          python3 scripts/score_state.py --state results/scoring-state.json --sha "$SHA" \
                  --tasks /tmp/tasks.json --done-dir . --skipped-manual /tmp/skipped-manual.json
      - if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: index-candidate
          path: |
            results/index.json
            results/scoring-state.json
