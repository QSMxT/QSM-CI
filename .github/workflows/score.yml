name: score

# Recompute leaderboard results and publish viewer volumes — only when something actually changed
# (not on a weekly timer). Scoring is PARALLELISED across GitHub-hosted runners: a full re-run is
# split into N disjoint shards (pipeline.py --shard i/N, column-sharded so each bfr localfield is
# computed once), a focused re-run fans out one job per changed slug. Each job writes its own runs +
# volumes; a single merge job combines them, publishes volumes to Hugging Face, and commits the
# small results/index.json (which triggers the Pages deploy).
#
# Scope:
#   - a changed algorithm  -> that algorithm's isolated run + every composed combo that includes it
#   - changed scorer / orchestration (eval, pipeline, stages) -> a full re-run of everything

on:
  push:
    branches: [main]
    paths:
      - "algorithms/**"
      - "eval/**"
      - "scripts/pipeline.py"
      - "scripts/publish_volumes.py"
      - "stages.yml"
      # NB: score.yml itself is intentionally NOT here — editing the workflow shouldn't rescore the
      # world. For a real scoring-logic change, dispatch with scope=all.
  workflow_dispatch:
    inputs:
      scope:
        description: "all | <comma-separated slugs> (default: auto-detect from the diff)"
        default: "auto"
      shards:
        description: "number of parallel shards for a full re-run"
        default: "12"
      dry_run:
        description: "true = score + merge but DON'T publish volumes or commit (upload a candidate index artifact instead)"
        default: "false"

# One rescore at a time — a new run queues behind the in-progress one instead of racing it (the merge
# job commits results/index.json, so overlapping runs could clobber each other / fail to push).
concurrency:
  group: score
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # the orphan-container reaper checks whether a labelled run is still active

env:
  TRACK: sim
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"   # shallow checkout has no tags for setuptools-scm
  # GitHub-hosted runners have ~16 GB RAM; pipeline.py's default of 4 concurrent containers (tuned for
  # the ~31 GB self-hosted box) OOM-kills the runner when MATLAB/DL containers coincide ("hosted runner
  # lost communication"). Cap at 2 — parallelism comes from the shard matrix, not intra-shard threads.
  QSM_CI_JOBS: "2"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
      slugs: ${{ steps.decide.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: decide
        run: |
          scope="${{ github.event.inputs.scope }}"
          if [ "$scope" = "all" ]; then
            echo "full=true"  >>"$GITHUB_OUTPUT"; echo "slugs=[]" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$scope" ] && [ "$scope" != "auto" ]; then
            echo "full=false" >>"$GITHUB_OUTPUT"
            echo "slugs=$(echo "$scope" | tr ', ' '\n' | grep . | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null \
                    || git diff --name-only HEAD~1 HEAD)
          if echo "$changed" | grep -qE '^(eval/|scripts/pipeline\.py|scripts/publish_volumes\.py|stages\.yml)'; then
            echo "full=true"  >>"$GITHUB_OUTPUT"; echo "slugs=[]" >>"$GITHUB_OUTPUT"
          else
            slugs=$(echo "$changed" | grep '^algorithms/' | cut -d/ -f2 | grep -v '^_' | sort -u | jq -R . | jq -sc .)
            echo "full=false" >>"$GITHUB_OUTPUT"; echo "slugs=$slugs" >>"$GITHUB_OUTPUT"
          fi

  # Turn the scope into a matrix of parallel tasks: full -> N shards; focused -> one job per slug.
  plan:
    needs: scope
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.gen.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7   # need algorithm.yml to read each method's `runner:` routing
      - id: gen
        env:
          FULL: ${{ needs.scope.outputs.full }}
          SLUGS: ${{ needs.scope.outputs.slugs }}
          N: ${{ github.event.inputs.shards || '12' }}
        run: |
          TASKS=$(python3 - <<'PY'
          import json, os, re, glob
          full = os.environ['FULL'] == 'true'
          # Dataset/phantom registry — single source of truth for the scoring datasets. A method
          # family (track) can have several ACTIVE phantoms (e.g. chisep + the ridani variants), and
          # each gets its own task; the track's default phantom keeps the legacy task/run ids while
          # the others are namespaced with the phantom id.
          REG = json.load(open('scripts/datasets.json'))
          def track_phantoms(track):
              ph = [k for k, v in REG.items() if v.get('track') == track and v.get('active')]
              return sorted(ph, key=lambda k: (not REG[k].get('default'), k))  # default first
          def task_id(prefix, slug, ph):
              return prefix + slug + ('' if REG[ph].get('default') else '-' + ph)
          # Per-task runner routing, chosen by each method's `runner:` field in its algorithm.yml:
          #   (unset)      -> HOSTED:      ubuntu-latest, 360-min cap (the GitHub 6-h job max), 2 concurrent
          #                   containers. Default; scored inside the parallel shard sweep.
          #   hosted-large  -> HOSTED_LARGE: ubuntu-latest, same 360-min cap but 1 container (full 16 GB) —
          #                   for methods that fit hosted memory but OOM when 2 run at once. Its own focused job.
          #   self-hosted  -> SELFHOSTED:  QSM-CI's 31 GB private runners (more RAM, and the only tier that can
          #                   exceed the 6-h cap via timeout_minutes), for methods that OOM the 16 GB hosted
          #                   box. Its own focused job; only 2 run in parallel.
          # hosted-large + self-hosted methods run as dedicated --focus jobs and are excluded from the shard
          # sweep. The default cap is the platform max on purpose: timeout-minutes is a KILL deadline, not a
          # reservation, so a longer cap is free for jobs that finish early — it only lets a genuine hang
          # squat a runner longer (rare), in exchange for no spurious timeouts and a more robust shard sweep.
          HOSTED      = {'runs_on': 'ubuntu-latest', 'timeout': 360, 'jobs': 2}
          HOSTED_LARGE = {'runs_on': 'ubuntu-latest', 'timeout': 360, 'jobs': 1}
          SELFHOSTED  = {'runs_on': ['self-hosted', 'Linux', 'X64'], 'timeout': 360, 'jobs': 4}
          def route(slug):
              try: t = open(f'algorithms/{slug}/algorithm.yml').read()
              except FileNotFoundError: return HOSTED
              m = re.search(r'^runner:[ \t]*(\S+)', t, re.M)
              tier = {'self-hosted': SELFHOSTED, 'hosted-large': HOSTED_LARGE}.get(m.group(1) if m else '', HOSTED)
              # Optional per-method `timeout_minutes:` override. Only honored on self-hosted, where GitHub
              # lets a job run past the 6-h hosted cap (up to ~5 days) — e.g. modip's full per-subject CPU
              # optimization normally finishes in a few hours but can drift past 6 h under shared-box
              # contention. Hosted tiers stay hard-capped at 6 h by GitHub, so an override there is ignored.
              tmo = re.search(r'^timeout_minutes:[ \t]*(\d+)', t, re.M)
              if tmo and tier is SELFHOSTED:
                  tier = {**tier, 'timeout': int(tmo.group(1))}
              return tier
          def stage_of(slug):
              try: t = open(f'algorithms/{slug}/algorithm.yml').read()
              except FileNotFoundError: return None
              m = re.search(r'^stage:[ \t]*(\S+)', t, re.M)
              return m.group(1) if m else None
          def is_skipped(slug):
              # ci_skip'd submissions (e.g. apart-qsm: core solver not distributed) are invisible to
              # pipeline.py discovery, so any task for them is a guaranteed no-op — don't burn a
              # runner slot (they were getting self-hosted focus jobs on every full re-run and every
              # generator fan-out).
              try: t = open(f'algorithms/{slug}/algorithm.yml').read()
              except FileNotFoundError: return True
              return bool(re.search(r'^ci_skip:[ \t]*true', t, re.M))
          def is_chisep(slug):
              # χ-separation methods AND R2′ generators both score on the chisep-track phantoms
              # (generators: isolated vs the true R2′; combos live in the χ-sep methods' focus jobs).
              return stage_of(slug) in ('chi-separation', 'r2prime-generation')
          def consumes_r2prime(slug):
              # Does this χ-sep method read r2prime? (An explicit `inputs:` without it = GRE-native,
              # e.g. R2*-QSM/DECOMPOSE — no GRE-only combos, so a generator change never re-runs it.
              # No `inputs:` line = the stage baseline, which includes r2prime.)
              try: t = open(f'algorithms/{slug}/algorithm.yml').read()
              except FileNotFoundError: return False
              m = re.search(r'^inputs:[ \t]*\[([^\]]*)\]', t, re.M)
              return 'r2prime' in m.group(1) if m else True
          def is_dipole(slug):
              # A dipole method (localfield -> chimap) — the only stage scorable on the in-vivo track.
              return stage_of(slug) == 'dipole'
          def invivo_tasks(slugs):
              # In-vivo (2016 challenge) leaderboard: each dipole method ALSO runs, isolated, on the
              # invivo dataset (localfield -> chimap, scored vs COSMOS + STI). This is an ADDITIONAL
              # run of the same dipole methods (not a reroute of a disjoint set like chisep), each as
              # its own --focus job with --track invivo on the 'invivo' phantom. Its runs get the
              # `-invivo` id namespace (pipeline.py id_suffix), so they never collide with sim runs.
              return [{'id': 'iv-' + s, 'focus': s, 'phantom': 'invivo', 'track': 'invivo', **route(s)}
                      for s in sorted(slugs) if is_dipole(s) and not s.startswith('_') and not is_skipped(s)]
          def phantoms(slug):
              # Which phantom(s) this method scores on: χ-separation methods run on EVERY active
              # chisep-track phantom (χ+/χ− GT + R2'/χ_total inputs) — one task per method × phantom;
              # everything else the QSM sim phantom.
              return track_phantoms('chisep') if is_chisep(slug) else ['sim']
          def focus_tasks(slugs):
              # One focused task per (method, phantom). The default phantom keeps the legacy
              # 'f-<slug>' task id; extra phantoms get 'f-<slug>-<phantom>'. ci_skip'd methods are
              # dropped — pipeline discovery skips them, so their jobs run nothing.
              #
              # A NON-dipole focus (e.g. a bfr/span like iqfm) pins its own stage while EVERY dipole
              # varies. Dipoles that carry their own `runner:` (self-hosted) already run as their own
              # dedicated focus jobs AND are the heavy ones (inr-qsm/modip are CPU-infeasible — can run
              # for hours); running them inside a bfr focus job just overruns its wall-clock cap
              # (observed: f-iqfm cancelled at the 360-min cap, saving nothing, so iqfm's combos with
              # the ~30 normal dipoles never landed). Exclude those heavy dipoles from a non-dipole
              # focus — their bfr combos are owned by their own focus jobs. Dipole focus jobs keep the
              # full bfr set (that's how a dipole's combo with a dedicated bfr like iqfm is produced).
              heavy_dipoles = ','.join(s for s in dedicated() if is_dipole(s) and not is_skipped(s))
              tasks = []
              for s in slugs:
                  if is_skipped(s):
                      continue
                  for ph in phantoms(s):
                      t = {'id': task_id('f-', s, ph), 'focus': s, 'phantom': ph, **route(s)}
                      if heavy_dipoles and not is_dipole(s) and not is_chisep(s):
                          t['exclude'] = heavy_dipoles
                      tasks.append(t)
              return tasks
          def dedicated():
              # Methods that run as their own focused job (not the shard sweep): a non-HOSTED runner OR a
              # χ-separation method (scored on a SEPARATE phantom, isolated-only — can't ride the QSM shard
              # sweep). Both are --exclude'd from the shards and get a --focus job on the right phantom.
              out = []
              for p in sorted(glob.glob('algorithms/*/algorithm.yml')):
                  slug = p.split('/')[1]
                  if not slug.startswith('_') and (route(slug) is not HOSTED or is_chisep(slug)):
                      out.append(slug)
              return out
          if full:
              # Full re-run: hosted shards score the whole QSM matrix MINUS the dedicated methods
              # (pipeline.py --exclude), and each dedicated method runs as its own focused job on its
              # chosen runner + phantom (--focus). Union = the full matrix, every method scored correctly.
              N = int(os.environ['N'])
              ded = dedicated()
              excl = ','.join(ded)
              tasks = [{'id': 's%02d' % i, 'shard': '%d/%d' % (i, N), 'exclude': excl, 'phantom': 'sim', **HOSTED} for i in range(N)]
              tasks += focus_tasks(ded)
              # In-vivo leaderboard: an extra isolated invivo run of EVERY dipole method.
              all_slugs = [p.split('/')[1] for p in sorted(glob.glob('algorithms/*/algorithm.yml'))]
              tasks += invivo_tasks(all_slugs)
          else:
              slugs = json.loads(os.environ['SLUGS'])
              # A changed R2′ generator invalidates every GRE-only combo (generator × χ-sep method).
              # Those combos are owned by the χ-SEP methods' focus jobs (pipeline.run_chisep_composed:
              # a generator's own focus job is isolated-only, so a full re-run never runs a combo
              # twice) — so fan a changed generator out into the R2′-consuming χ-sep focus jobs too.
              if any(stage_of(s) == 'r2prime-generation' for s in slugs):
                  all_slugs = [p.split('/')[1] for p in sorted(glob.glob('algorithms/*/algorithm.yml'))]
                  slugs = sorted(set(slugs) | {s for s in all_slugs if not s.startswith('_')
                                               and stage_of(s) == 'chi-separation' and consumes_r2prime(s)
                                               and not is_skipped(s)})
              tasks = focus_tasks(slugs)
              # A changed dipole method also re-scores on the in-vivo track.
              tasks += invivo_tasks(slugs)
          print(json.dumps(tasks))
          PY
          )
          echo "tasks=$TASKS" >>"$GITHUB_OUTPUT"
          echo "planned tasks: $TASKS"

  score:
    needs: [scope, plan]
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    # Runner, wall-clock budget and intra-job container parallelism are chosen per task by the plan
    # job (ubuntu-latest/180/2 by default; the 31 GB self-hosted runners/360/4 for `runner: self-hosted`
    # methods). QSM_CI_JOBS here overrides the workflow-level cap of 2 for self-hosted jobs.
    runs-on: ${{ matrix.task.runs_on }}
    timeout-minutes: ${{ matrix.task.timeout }}
    env:
      QSM_CI_JOBS: ${{ matrix.task.jobs }}
      # Per-job container tag — qsm_ci.containers labels every container it starts with this, so the
      # post-job kill step (and the next job's reaper) can identify exactly THIS job's containers.
      QSMCI_JOB_TAG: ${{ github.run_id }}-${{ matrix.task.id }}
    steps:
      - uses: actions/checkout@v7

      # Persistent self-hosted boxes: cancelling an Actions job kills the docker CLIENT process but
      # NOT its container (`--rm` only cleans up after exit), so cancelled score runs used to leave
      # MATLAB/DL containers silently consuming the shared 31 GB runner's memory for hours — until
      # the oom-killer started taking out OTHER runs' jobs (observed 2026-08-26: ~27 GB of orphans).
      # Reap running qsm-ci containers whose owning run (the qsmci.run label, stamped by
      # qsm_ci.containers) is no longer active; unlabeled qsm-ci-* strays are reaped past 12 h.
      # Anything unconfirmable is kept (fail-safe). No-op on hosted runners (fresh VM every job).
      - name: Reap orphaned qsm-ci containers (self-hosted)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QSMCI_JOB_TAG: ${{ github.run_id }}-${{ matrix.task.id }}
        run: |
          command -v docker >/dev/null 2>&1 || exit 0
          python3 - <<'PY'
          import datetime, json, os, subprocess, urllib.request, urllib.error
          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout.strip()
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)
          ids = sh("docker", "ps", "-q", "--filter", "label=qsmci").split()
          ids += [i for i in sh("docker", "ps", "-q", "--filter", "name=qsm-ci-").split() if i not in ids]
          now = datetime.datetime.now(datetime.timezone.utc)
          me, mytag = os.environ["RUN_ID"], os.environ.get("QSMCI_JOB_TAG", "")
          active_names = None   # in-progress job names of MY run, fetched once on first need
          for c in ids:
              info = json.loads(sh("docker", "inspect", c) or "[]")
              if not info:
                  continue
              labels = info[0]["Config"].get("Labels") or {}
              rid, jtag = labels.get("qsmci.run"), labels.get("qsmci.job")
              kill = False
              if rid == me:
                  # Same run: my own / untagged containers are sacrosanct; another job's container is
                  # kept ONLY while that job is still in progress (else it's a failed sibling's
                  # leftover — the very orphans that cascaded OOM through a long run's later jobs).
                  if not jtag or jtag == mytag:
                      continue
                  if active_names is None:
                      try:
                          active_names = [j["name"] for j in api(f"/repos/{os.environ['REPO']}/actions/runs/{me}/jobs?per_page=100&filter=latest").get("jobs", [])
                                          if j.get("status") == "in_progress"]
                      except Exception:
                          active_names = None
                  if active_names is None:
                      continue                          # can't confirm -> keep
                  sfx = jtag[len(me) + 1:]
                  kill = not any(("(" + sfx + ",") in n or ("(" + sfx + ")") in n for n in active_names)
              elif rid:
                  try:
                      kill = api(f"/repos/{os.environ['REPO']}/actions/runs/{rid}").get("status") == "completed"
                  except urllib.error.HTTPError as e:
                      kill = e.code == 404              # run gone entirely
                  except Exception:
                      kill = False                      # can't confirm -> keep
              else:
                  started = info[0]["State"]["StartedAt"][:19] + "+00:00"
                  kill = (now - datetime.datetime.fromisoformat(started)).total_seconds() > 12 * 3600
              if kill:
                  print("reaping orphaned container %s (run %s, job %s)" % (c, rid or "-", jtag or "-"))
                  sh("docker", "kill", c)
          PY

      - name: Install qsm-ci CLI + scorer deps
        run: |
          pip install -r eval/requirements.txt huggingface_hub
          pip install --upgrade setuptools setuptools_scm wheel
          pip install --no-build-isolation .

      # Resolve the task's phantom against the dataset registry (scripts/datasets.json): the
      # per-phantom OSF zip cache key (osf-<phantom>-<file-id>), the local dataset path, and the
      # scoring mode. Workflows can't index `secrets` dynamically, so each per-phantom OSF_FILE_*
      # secret is passed into env here and the registry entry's `osf_env` picks the right one by
      # name — adding a phantom = a scripts/datasets.json entry + one OSF_FILE_* env line here
      # and on the fetch step below (named OSF_FILE_<PHANTOM-ID, uppercased, dashes→underscores>).
      - name: Resolve dataset (scripts/datasets.json)
        id: ds
        env:
          PHANTOM: ${{ matrix.task.phantom || 'sim' }}
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}   # invivo_qsm2016.zip OSF file id (pre-flattened)
          OSF_FILE_RIDANI_3T_ISO: ${{ secrets.OSF_FILE_RIDANI_3T_ISO }}      # Ridani 3T isotropic (pre-flattened)
          OSF_FILE_RIDANI_3T_ANISO: ${{ secrets.OSF_FILE_RIDANI_3T_ANISO }}  # Ridani 3T anisotropic (pre-flattened)
          OSF_FILE_RIDANI_7T_ANISO: ${{ secrets.OSF_FILE_RIDANI_7T_ANISO }}  # Ridani 7T anisotropic (pre-flattened)
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}              # χ-sep multicompartment (pre-flattened)
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ph = os.environ['PHANTOM']
          d = json.load(open('scripts/datasets.json'))[ph]
          osf = (os.environ.get(d['osf_env']) if d.get('osf_env') else None) or d.get('osf_file') or ''
          print(f"zipkey=osf-{ph}-{osf}")
          print(f"path={d['path']}")
          # sim runs the QSM composed matrix; chisep runs the GRE-only composed matrix (R2′
          # generators × χ-sep methods); in-vivo is isolated-only (no composable GT boundary).
          print("mode=" + ("both" if d['track'] in ('sim', 'chisep') else "isolated"))
          PY
      - name: Cache OSF dataset zip
        uses: actions/cache@v6
        with:
          path: .osfcache/${{ matrix.task.phantom || 'sim' }}.zip
          key: ${{ steps.ds.outputs.zipkey }}
      - name: Fetch dataset (public inputs + held-out ground truth)
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}   # invivo_qsm2016.zip OSF file id (pre-flattened)
          OSF_FILE_RIDANI_3T_ISO: ${{ secrets.OSF_FILE_RIDANI_3T_ISO }}      # Ridani 3T isotropic (pre-flattened)
          OSF_FILE_RIDANI_3T_ANISO: ${{ secrets.OSF_FILE_RIDANI_3T_ANISO }}  # Ridani 3T anisotropic (pre-flattened)
          OSF_FILE_RIDANI_7T_ANISO: ${{ secrets.OSF_FILE_RIDANI_7T_ANISO }}  # Ridani 7T anisotropic (pre-flattened)
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}              # χ-sep multicompartment (pre-flattened)
          OSF_ZIP: .osfcache/${{ matrix.task.phantom || 'sim' }}.zip
        run: scripts/fetch_dataset.sh "${{ matrix.task.phantom || 'sim' }}" "${{ steps.ds.outputs.path }}"

      - name: Score task ${{ matrix.task.id }}
        run: |
          PH="${{ matrix.task.phantom || 'sim' }}"
          DS="${{ steps.ds.outputs.path }}"
          MODE="${{ steps.ds.outputs.mode }}"
          # Track defaults to $TRACK (sim); an invivo task overrides it so pipeline.py scores against
          # COSMOS + STI and namespaces its run ids with `-invivo`. --phantom namespaces the run ids
          # of a NON-default phantom with -<phantom-id> (the default phantoms keep the legacy ids).
          TRK="${{ matrix.task.track || '' }}"; [ -z "$TRK" ] && TRK="$TRACK"
          ARGS="--dataset $DS --phantom $PH --mode $MODE --runner docker --track $TRK --emit-volumes --runs-out runs-${{ matrix.task.id }}.json"
          [ -n "${{ matrix.task.shard }}" ] && ARGS="$ARGS --shard ${{ matrix.task.shard }}"
          [ -n "${{ matrix.task.focus }}" ] && ARGS="$ARGS --focus ${{ matrix.task.focus }}"
          [ -n "${{ matrix.task.exclude }}" ] && ARGS="$ARGS --exclude ${{ matrix.task.exclude }}"
          echo "== task ${{ matrix.task.id }}: pipeline.py $ARGS =="
          t0=$(date +%s)
          python scripts/pipeline.py $ARGS
          echo "== task ${{ matrix.task.id }} wall-clock: $(( $(date +%s) - t0 ))s =="


      # Belt to the reaper's braces: whatever way this job ends (incl. a failed score step — exit 137
      # still runs `always()` steps), kill the containers IT started, so a long run's later
      # self-hosted jobs never inherit them. Only a whole-runner death skips this; the next job's
      # reaper covers that via the same-run job-tag check.
      - name: Kill this job's containers
        if: always()
        continue-on-error: true
        run: |
          command -v docker >/dev/null 2>&1 || exit 0
          [ -n "$QSMCI_JOB_TAG" ] && docker ps -q --filter "label=qsmci.job=$QSMCI_JOB_TAG" | xargs -r docker kill || true

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.task.id }}
          retention-days: 1
          path: |
            runs-${{ matrix.task.id }}.json
            results
            !results/index.json

  merge:
    needs: [scope, score]
    # Publish whatever finished scoring — even if a leg failed or a flaky self-hosted DL job (e.g.
    # modip) was cancelled/timed out. `merge` downloads the shard artifacts that exist and merges
    # them into results/index.json by run-id, so a leg that uploaded nothing is simply absent and
    # keeps its previous score. We need always() here: without it, one cancelled leg skips merge and
    # blocks the ENTIRE leaderboard publish, including all the hosted results (this is what DNF'd the
    # BFRnet/resource-graph publish). Still skip when scope failed (nothing was planned) or scoring
    # was skipped (nothing changed).
    if: ${{ always() && needs.scope.result == 'success' && needs.score.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          merge-multiple: true
          path: .

      - name: Merge deps
        run: pip install -r eval/requirements.txt huggingface_hub

      - name: Merge shard runs into results/index.json
        run: |
          # Preserve the index this rescore STARTED from (its checkout base) — the commit step needs
          # it to re-apply only the runs THIS rescore changed onto the latest main at push time.
          cp results/index.json /tmp/base-index.json
          python3 - <<'PY'
          import json, glob
          from collections import Counter
          runs = []
          for f in sorted(glob.glob("runs-*.json")):
              runs += json.load(open(f))
          dup = [i for i, c in Counter(r["id"] for r in runs).items() if c > 1]
          # Dedupe by id (last wins) so two focus jobs that legitimately share a combo (e.g. two
          # dedicated methods composing with each other) can never write the same id twice.
          runs = list({r["id"]: r for r in runs}.values())
          idx = json.load(open("results/index.json"))
          ids = {r["id"] for r in runs}
          merged = [r for r in idx["runs"] if r.get("id") not in ids] + runs
          json.dump({"generated": None, "runs": merged}, open("results/index.json", "w"), indent=2)
          dnf = sorted(r["id"] for r in runs if r.get("status") == "DNF")
          print(f"merged {len(runs)} shard runs; index now {len(merged)} total")
          print(f"duplicate ids across shards: {dup or 'none (partition OK)'}")
          print(f"DNF ({len(dnf)}): {', '.join(dnf) if dnf else 'none'}")
          PY

      - name: Publish volumes to Hugging Face
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
        run: python scripts/publish_volumes.py results

      - name: Commit results index (triggers the Pages deploy)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "qsm-ci-bot"
          git config user.email "qsm-ci@users.noreply.github.com"
          # This rescore's scored output (base + freshly scored runs).
          cp results/index.json /tmp/scored-index.json
          # Never `git pull --rebase` results/index.json: a rescore based on a commit before another
          # rescore's results landed conflicts on the same file, leaving the loop stuck on "unmerged
          # files" (the #72 / observed BFRnet-publish failure). Instead, each attempt takes the LATEST
          # index from main and re-applies ONLY the runs THIS rescore changed (by id, via
          # merge_index.py), so concurrent rescores of different slugs never clobber each other.
          for attempt in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q          # HEAD + results/index.json = latest main
            python3 scripts/merge_index.py /tmp/base-index.json /tmp/scored-index.json \
                    results/index.json results/index.json
            git add results/index.json
            git diff --cached --quiet && { echo "no changes to publish"; exit 0; }
            git commit -q -m "Update results"
            git push && exit 0
            echo "push attempt $attempt rejected — re-applying onto latest main"; sleep $((attempt * 3))
          done
          echo "::error::could not push results after 5 attempts"; exit 1

      - name: (dry-run) upload candidate index instead of committing
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: index-candidate
          path: results/index.json
