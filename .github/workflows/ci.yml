name: ci

# Fast, secret-free smoke tests for the qsm-ci CLI, all container runners, scoring, and the
# --set parameter passthrough. Runs on GitHub-hosted runners with tiny public images + synthetic
# NIfTIs — no OSF data, no self-hosted runner. (Real algorithm scoring lives in evaluate.yml.)

on:
  push:
    branches: [main]
  pull_request:

# `shell: bash` here is load-bearing, not decoration: naming the shell explicitly makes every
# `run:` below execute as `bash --noprofile --norc -eo pipefail {0}`, whereas the IMPLICIT
# default is `bash -e {0}` — fail-fast but pipe-blind, so `a | b` would report only b's status.
defaults:
  run:
    shell: bash

# Read-only token: no job here writes to the repo.
permissions:
  contents: read

jobs:
  manifest:
    # Verify the two generated web files are in sync with their sources — web/algorithms.json (from
    # algorithms/*/algorithm.yml) and web/styles.css (the Tailwind build of the markup) — and fail
    # with the regeneration command when they are not. (A stale committed styles.css made local dev
    # render differently from Pages, and had already provoked inline-style workarounds blamed on
    # "the purge".)
    #
    # This job used to regenerate and push the refresh back to the branch. Do not reinstate that: a
    # GITHUB_TOKEN push creates a head SHA on which no workflows run, so every required check
    # (image-access.yml, the merge gate) sits at "Expected" for that SHA and blocks the merge until
    # somebody pushes again — which is what bit #190 as soon as the job also started syncing
    # styles.css. Checking instead of committing also lets the job run identically for fork PRs,
    # which GITHUB_TOKEN could never push to in the first place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install package
        run: pip install . pyyaml
      - name: Regenerate manifest
        run: python scripts/gen_manifest.py
      - name: Rebuild Tailwind CSS
        working-directory: web
        run: |
          npm ci
          npm run build:css
      - name: Check generated web files are in sync
        run: |
          set -euo pipefail
          if git diff --quiet web/algorithms.json web/styles.css; then
            echo "web/algorithms.json and web/styles.css already in sync"; exit 0
          fi
          git --no-pager diff --stat web/algorithms.json web/styles.css
          echo "::error::Generated web files are out of date. Run these, then commit web/algorithms.json and web/styles.css: python scripts/gen_manifest.py && (cd web && npm ci && npm run build:css)"
          exit 1

  interfaces:
    # Workflow-engine interfaces (qsm_ci.nipype / qsm_ci.pydra) + the `qsm-ci interface` generator,
    # exercised on a qsm-forward phantom with the container-free `local` runner. Fast, secret-free.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package + test extra (nipype, pydra, qsm-forward)
        run: pip install ".[test]"

      - name: Install apptainer  # docker + podman are preinstalled on ubuntu-latest
        run: |
          ver=1.3.6
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "apptainer_${ver}_amd64.deb" "https://github.com/apptainer/apptainer/releases/download/v${ver}/apptainer_${ver}_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "./apptainer_${ver}_amd64.deb"

      - name: Point podman at runc
        # ubuntu-latest's podman/crun combo errors "crun: unknown version specified"; the interface
        # tests run methods through podman, so select runc (also preinstalled) as podman's runtime.
        run: |
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
          podman info --format '{{.Host.OCIRuntime.Name}}' || true

      # No phantom step: the suite builds its own with qsm-forward (~1s), so CI exercises the very
      # path a contributor hits locally instead of a CI-only one that could rot unnoticed.
      - name: Interface tests (stubs × docker·podman·apptainer·local + a real tkd run + generator)
        run: pytest -q tests/test_interfaces.py

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: pip install . pytest

      - name: Environment
        run: |
          qsm-ci --version
          qsm-ci doctor

      - name: Scorer selfcheck + unit tests
        # The WHOLE tests/ tree, not a hand-maintained file list (that list silently omitted three
        # files — 53 tests, among them the shard/publish-once guards repro.yml relies on — for months).
        # Two files are deliberately not in this job: tests/test_interfaces.py needs the [test] extra
        # and every container runner, so it has its own `interfaces` job above; tests/test_pipeline.py
        # skips itself here (it needs the real OSF dataset, which pipeline.yml provides).
        run: |
          python eval/qsm_eval.py --selfcheck
          pytest -q eval/test_metrics.py tests --ignore=tests/test_interfaces.py

      - name: Scaffold check (qsm-ci new)
        run: |
          qsm-ci new --stage dipole --name "Smoke Test" --lang python --dir /tmp/scaf
          test -f /tmp/scaf/smoke-test/algorithm.yml
          test -f /tmp/scaf/smoke-test/recon.py

      - name: Synthetic fixtures
        run: python tests/make_fixtures.py /tmp/fix

      - name: Parameter passthrough (--set, local runner)
        run: |
          out=$(qsm-ci run tests/methods/scale-method --runner local \
            --localfield /tmp/fix/inputs/localfield.nii.gz \
            --mask /tmp/fix/inputs/mask.nii.gz \
            --params /tmp/fix/inputs/params.json \
            --set scale=2 -o /tmp/scaled.nii.gz)
          echo "$out"
          echo "$out" | grep -q "CONFIG: {'scale': 2}"

      - name: Install apptainer
        run: |
          ver=1.3.6
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "apptainer_${ver}_amd64.deb" "https://github.com/apptainer/apptainer/releases/download/v${ver}/apptainer_${ver}_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "./apptainer_${ver}_amd64.deb"

      - name: Point podman at runc
        # The ubuntu-latest image ships a podman/crun combo that errors "crun: unknown version
        # specified" on `podman run`. runc is also preinstalled and handles the OCI bundle fine, so
        # select it as podman's default runtime for the container-runner smoke below.
        run: |
          mkdir -p ~/.config/containers
          printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
          podman info --format '{{.Host.OCIRuntime.Name}}' || true

      - name: Container runners — docker · podman · apptainer
        run: |
          set -euo pipefail
          for r in docker podman apptainer; do
            echo "::group::runner=$r"
            out=$(qsm-ci run tests/methods/cp-method --runner "$r" \
              --localfield /tmp/fix/inputs/localfield.nii.gz \
              --mask /tmp/fix/inputs/mask.nii.gz \
              --params /tmp/fix/inputs/params.json \
              --truth /tmp/fix/groundtruth/chimap.nii.gz \
              -o "/tmp/chi_${r}.nii.gz")
            echo "$out"
            echo "$out" | grep -q "correlation" && echo "$out" | grep -q "1.0000"
            echo "::endgroup::"
          done
