name: parity

# Port parity: run the original implementation of an algorithm and its QSM.rs port on the same public
# dataset and check that they agree (QSMxT/QSM-CI#295, step 3). Pairs, which side is the reference,
# and the limits per dataset live in parity/thresholds.yml; the runs and the comparison are
# scripts/parity.py (unit-tested in tests/test_parity.py). docs/parity.md is the guide.
#
# Each job runs both containers through `qsm-ci run` — the same run path score.yml uses — then
# compares the final χ and every intermediate both sides wrote under the same name (CONTRACT.md,
# "Intermediates") inside the dataset mask. The report is the job summary and an artifact; the job
# fails when a limit is exceeded.
#
# The QSM.rs side, and the track a run records on (docs/parity.md, "Tracks"):
#   qsmxt_release  RELEASED track: a QSMxT release tag (or `latest`). Every QSM.rs step runs the
#                  qsmxt binary that release ships (its x86_64 musl asset, checked against its
#                  SHA256SUMS), with the QSM.rs it pins. A pair whose port the release lacks (no such
#                  subcommand, option or value) is recorded as "not in <tag>", not as a failure.
#   qsmrs_ref      DEV track: QSMxT (qsmxt_ref, default main) built with its qsm-core pin moved to
#                  this QSM.rs commit (main, or a release candidate: the QSM.rs release gate);
#   qsmxt_ref      DEV track: a QSMxT ref, built as it is (with the QSM.rs it pins);
#   qsmxt_image    DEV track: a prebuilt qsmxt image.
# With none of them, every QSM.rs step runs the qsmxt image its algorithm.yml pins, and nothing is
# recorded. A build is the release build (QSMxT's release.yml: cargo build --release, x86_64 musl,
# default features); a build or a release binary runs in a debian-slim image like
# algorithms/_qsmxt (parity/qsmxt.Dockerfile).
#
# Dispatched by hand, by parity-status (PARITY_AUTO_REFRESH: stale dev pairs) and by
# parity-release (a new QSMxT release, or a released pair whose reference or settings changed).
# Before a QSM.rs release (docs/parity.md, "Before a QSM.rs release"):
#     gh workflow run parity.yml -R QSMxT/QSM-CI -f algorithm=enabled -f dataset=configured \
#       -f qsmrs_ref=<release candidate SHA>
#
# After the jobs, `report` writes the run summary (dev: which pairs passed against exactly the
# QSM.rs commit under test, the release gate's answer; released: what the release passed, failed and
# lacks). A run from main, or one dispatched with record=true, then has `record` commit one record
# per pair × dataset to parity/results.json and regenerate parity/status.json and parity/STATUS.md
# (scripts/parity.py report / record / status). Baselines, runs from other branches and runs of the
# pinned images record nothing.

# parity-release.yml finds a released run already queued or running by this title.
run-name: "parity${{ inputs.qsmxt_release && format(' · released {0}', inputs.qsmxt_release) || '' }} · ${{ inputs.algorithm || 'enabled' }}"

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "pairs in parity/thresholds.yml, comma-separated (e.g. qsmart,ilsqr,tkd), and/or 'enabled' (every enabled pair) / 'all-configured' (every pair with a dataset, enabled or not)"
        default: "enabled"
      dataset:
        description: "scripts/datasets.json keys, comma-separated (e.g. sim, s002001-kki-achieva-bridge-run1), or 'configured' for every dataset each pair has an entry for"
        default: "configured"
      baseline:
        description: "true = measure and print suggested limits; never fail on them"
        default: "false"
      qsmxt_release:
        description: "RELEASED track: a QSMxT release tag (e.g. v10.0.0) or 'latest': run the qsmxt that release ships. Not with the three below"
        default: ""
      qsmrs_ref:
        description: "DEV track: QSM.rs ref (branch, tag or SHA) to test: builds qsmxt with qsm-core at this commit. Empty = the QSM.rs that qsmxt_ref pins"
        default: ""
      qsmxt_ref:
        description: "QSMxT ref to build qsmxt from (default main when qsmrs_ref is set). Empty with no qsmrs_ref = the images algorithm.yml pins"
        default: ""
      qsmxt_image:
        description: "prebuilt qsmxt image for every QSM.rs step instead (overrides the refs)"
        default: ""
      record:
        description: "true = commit this run's results to parity/results.json (runs from main always do; baselines never)"
        default: "false"
  workflow_call:
    inputs:
      algorithm: { type: string, default: "enabled" }
      dataset: { type: string, default: "configured" }
      baseline: { type: string, default: "false" }
      qsmxt_release: { type: string, default: "" }
      qsmrs_ref: { type: string, default: "" }
      qsmxt_ref: { type: string, default: "" }
      qsmxt_image: { type: string, default: "" }
      record: { type: string, default: "false" }

# `shell: bash` here is load-bearing, not decoration: naming the shell explicitly makes every
# `run:` below execute as `bash --noprofile --norc -eo pipefail {0}`, whereas the IMPLICIT
# default is `bash -e {0}` — fail-fast but pipe-blind, so `a | b` would report only b's status.
defaults:
  run:
    shell: bash

permissions:
  contents: read   # only the `record` job commits (job-level contents: write)

env:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"   # shallow checkout has no tags for setuptools-scm

jobs:
  plan:
    runs-on: ubuntu-latest
    # Every later job reads the run's settings from here, not from `inputs`.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
      baseline: ${{ steps.plan.outputs.baseline }}
      record: ${{ steps.plan.outputs.record }}
      qsmrs_ref: ${{ steps.plan.outputs.qsmrs_ref }}
      qsmxt_ref: ${{ steps.plan.outputs.qsmxt_ref }}
      qsmxt_image: ${{ steps.plan.outputs.qsmxt_image }}
      release: ${{ steps.plan.outputs.release }}
      track: ${{ steps.plan.outputs.track }}
      key: ${{ steps.plan.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          # Dispatch inputs: via env, never interpolated into a script (free-text fields).
          ALGORITHM: ${{ inputs.algorithm || 'enabled' }}
          DATASET: ${{ inputs.dataset || 'configured' }}
          BASELINE: ${{ inputs.baseline || 'false' }}
          QSMXT_RELEASE: ${{ inputs.qsmxt_release }}
          QSMRS_REF: ${{ inputs.qsmrs_ref }}
          QSMXT_REF: ${{ inputs.qsmxt_ref }}
          QSMXT_IMAGE: ${{ inputs.qsmxt_image }}
          RECORD: ${{ inputs.record || 'false' }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pyyaml
          # Validates every selected pair and dataset before any job starts.
          m=$(python3 scripts/parity.py pairs --matrix --algorithm "$ALGORITHM" --dataset "$DATASET")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m"
          # The track: released (a QSMxT release's own binary), dev (a build or a supplied image),
          # or none (the images algorithm.yml pins: not recorded).
          rel=""; track=none; b=false
          if [ -n "$QSMXT_RELEASE" ]; then
            [ -z "$QSMRS_REF$QSMXT_REF$QSMXT_IMAGE" ] || {
              echo "::error::qsmxt_release runs a release as it ships: no qsmrs_ref, qsmxt_ref or qsmxt_image with it"; exit 1; }
            if [ "$QSMXT_RELEASE" = latest ]; then
              rel=$(gh release view -R QSMxT/QSMxT --json tagName -q .tagName)
            else
              rel=$(gh release view "$QSMXT_RELEASE" -R QSMxT/QSMxT --json tagName -q .tagName) || {
                echo "::error::no QSMxT release '$QSMXT_RELEASE'"; exit 1; }
            fi
            track=released; b=true    # the qsmxt job fetches the release's binary
          elif [ -n "$QSMXT_IMAGE" ]; then
            track=dev
          elif [ -n "$QSMRS_REF$QSMXT_REF" ]; then
            track=dev; b=true         # the qsmxt job builds it
          fi
          # Record: a run from main, or record=true; never a baseline (it applies no limits), and
          # never a run of the pinned images (no track).
          r=false; { [ "$REF" = refs/heads/main ] || [ "$RECORD" = true ]; } && r=true
          [ "$track" = none ] && { [ "$r" = true ] && echo "::notice::pinned images: nothing is recorded (pass qsmxt_release or a ref)"; r=false; }
          # Names this run's artifacts by what it tests, so a workflow that calls this one several
          # times in one run (one call per QSM.rs ref) keeps each call's build and results apart.
          k="q$(printf '%s|%s|%s|%s|%s|%s' "$rel" "$QSMRS_REF" "$QSMXT_REF" "$QSMXT_IMAGE" "$ALGORITHM" "$DATASET" | sha1sum | cut -c1-8)"
          echo "key=$k" >> "$GITHUB_OUTPUT"
          [ "$BASELINE" = true ] && r=false
          { echo "build=$b"; echo "record=$r"; echo "baseline=$BASELINE"; echo "track=$track"; echo "release=$rel"
            echo "qsmrs_ref=$QSMRS_REF"; echo "qsmxt_ref=$QSMXT_REF"; echo "qsmxt_image=$QSMXT_IMAGE"
          } | tee -a "$GITHUB_OUTPUT"

  # qsmxt from source, as QSMxT's release.yml builds its x86_64-unknown-linux-musl asset (the one
  # algorithms/_qsmxt installs) — or, on the released track, that asset itself, downloaded from the
  # release. The binary and what it is are handed to the parity jobs as an artifact; each builds
  # its own small image from it (parity/qsmxt.Dockerfile).
  qsmxt:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QSMRS_REF: ${{ needs.plan.outputs.qsmrs_ref }}
      QSMXT_REF: ${{ needs.plan.outputs.qsmxt_ref || 'main' }}
      RELEASE: ${{ needs.plan.outputs.release }}
    steps:
      - name: The release's own binary (released track)
        if: needs.plan.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qsmxt-build && cd qsmxt-build
          a="qsmxt-$RELEASE-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$RELEASE" -R QSMxT/QSMxT -p "$a" -p SHA256SUMS
          grep " $a\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$a" qsmxt && chmod +x qsmxt && rm -f "$a" SHA256SUMS
          # The tag's commit (the peeled commit of an annotated tag).
          commit=$(git ls-remote https://github.com/QSMxT/QSMxT.git "refs/tags/$RELEASE" "refs/tags/$RELEASE^{}" \
                   | sort -k2 | tail -1 | cut -f1)
          ./qsmxt --version | tee VERSION
          printf '%s\n' "QSMxT release $RELEASE @ $commit ($(sed -n 2p VERSION))" | tee BUILT_FROM
          # The QSM.rs the release pins, as its binary reports it ("QSM.rs (qsm-core): v0.39.0 (42ab…)").
          COMMIT="$commit" python3 - <<'PY' > built.json
          import json, os, re
          v = open("VERSION").read()
          m = re.search(r"qsm-core\)?:\s*v?([0-9][^\s(]*)\s*\(([0-9a-f]{7,40})\)", v)
          print(json.dumps({"release": os.environ["RELEASE"], "qsmxt_ref": os.environ["RELEASE"],
                            "qsmxt_commit": os.environ["COMMIT"] or None, "qsmrs_ref": None,
                            "qsmrs_version": m.group(1) if m else None,
                            "qsmrs_commit": m.group(2) if m else None}))
          PY
          cat built.json
      - uses: actions/checkout@v7
        if: needs.plan.outputs.release == ''
        with:
          repository: QSMxT/QSMxT
          ref: ${{ needs.plan.outputs.qsmxt_ref || 'main' }}
          path: qsmxt
      - name: Move qsm-core to the QSM.rs under test
        if: needs.plan.outputs.release == '' && needs.plan.outputs.qsmrs_ref != ''
        working-directory: qsmxt
        run: |
          # QSMxT pins qsm-core by git rev in both manifests (they move in lockstep). A tag or branch
          # is resolved to its commit so the build records exactly what it tested.
          sha=$(git ls-remote https://github.com/astewartau/QSM.rs.git "$QSMRS_REF" "refs/tags/$QSMRS_REF^{}" | tail -1 | cut -f1)
          [[ "$QSMRS_REF" =~ ^[0-9a-f]{40}$ ]] && sha="$QSMRS_REF"
          [ -n "$sha" ] || { echo "::error::QSM.rs ref '$QSMRS_REF' not found"; exit 1; }
          for f in Cargo.toml crates/qsmxt-engine/Cargo.toml; do
            sed -i -E "/astewartau\/QSM\.rs/ s/(rev|tag|branch) = \"[^\"]*\"/rev = \"$sha\"/" "$f"
            grep -n 'QSM.rs.git' "$f"
          done
      - uses: dtolnay/rust-toolchain@stable
        if: needs.plan.outputs.release == ''
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        if: needs.plan.outputs.release == ''
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        if: needs.plan.outputs.release == ''
        with:
          workspaces: qsmxt -> target
          key: parity-musl
      - name: Build release binary
        if: needs.plan.outputs.release == ''
        working-directory: qsmxt
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Record what was built
        if: needs.plan.outputs.release == ''
        working-directory: qsmxt
        run: |
          mkdir -p ../qsmxt-build
          cp target/x86_64-unknown-linux-musl/release/qsmxt ../qsmxt-build/
          core=$(python3 - <<'PY'
          import re
          lock = open("Cargo.lock").read()
          m = re.search(r'name = "qsm-core"\nversion = "([^"]+)"\nsource = "git\+[^#]+#([0-9a-f]+)"', lock)
          print(f"{m.group(1)} @ {m.group(2)}" if m else "unknown")
          PY
          )
          printf '%s\n' "QSMxT $QSMXT_REF @ $(git rev-parse HEAD), qsm-core $core" | tee ../qsmxt-build/BUILT_FROM
          ../qsmxt-build/qsmxt --version | tee ../qsmxt-build/VERSION
          # The same, for parity.py report (results.json records the commits each check ran).
          QSMXT_COMMIT=$(git rev-parse HEAD) CORE="$core" python3 - <<'PY' > ../qsmxt-build/built.json
          import json, os
          v, _, c = os.environ["CORE"].partition(" @ ")
          print(json.dumps({"qsmxt_ref": os.environ["QSMXT_REF"], "qsmxt_commit": os.environ["QSMXT_COMMIT"],
                            "qsmrs_ref": os.environ.get("QSMRS_REF") or None,
                            "qsmrs_version": v if c else None, "qsmrs_commit": c or None}))
          PY
          cat ../qsmxt-build/built.json
      - uses: actions/upload-artifact@v7
        with:
          name: qsmxt-under-test-${{ needs.plan.outputs.key }}
          path: qsmxt-build/
          retention-days: 7

  parity:
    needs: [plan, qsmxt]
    # Runs after the build, or without it when none was asked for (skipped is not a failure).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.qsmxt.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    # Hosted, unless a side's algorithm.yml routes it to the self-hosted runners (`runner:`); the
    # cap is that tier's (parity.py _route: 360 min hosted, timeout_minutes self-hosted).
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      ALGORITHM: ${{ matrix.algorithm }}
      PHANTOM: ${{ matrix.phantom }}
      BASELINE: ${{ needs.plan.outputs.baseline }}
      RELEASE: ${{ needs.plan.outputs.release }}
      # Labels every container this job starts (qsm_ci.containers), as in score.yml.
      QSMCI_JOB_TAG: ${{ github.run_id }}-parity-${{ matrix.algorithm }}-${{ matrix.phantom }}
    steps:
      - uses: actions/checkout@v7

      # On a persistent self-hosted runner: clear orphaned qsm-ci containers first (score.yml).
      - name: Reap orphaned qsm-ci containers (self-hosted)
        if: ${{ matrix.runs_on != 'ubuntu-latest' }}
        continue-on-error: true
        uses: ./.github/actions/reap-containers
        with:
          job-tag: ${{ github.run_id }}-parity-${{ matrix.algorithm }}-${{ matrix.phantom }}

      # Same interpreter and pinned numpy/scipy as the scoring jobs (score.yml explains why, and
      # why a self-hosted runner without the tool cache may fall back to its own Python).
      - uses: actions/setup-python@v7
        continue-on-error: true
        with: { python-version: "3.12" }

      - name: Install qsm-ci CLI + deps
        uses: ./.github/actions/setup-qsmci

      # Dataset resolution, cache and fetch as score.yml does them. The sim zip is cached under
      # pipeline.yml's key and path (osf-bids-<file id>, .osfcache/bids.zip): that is the cache the
      # repo keeps warm, so this job reuses it rather than downloading 500 MB again.
      - name: Resolve dataset (scripts/datasets.json)
        id: ds
        env:
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}
          OSF_FILE_RIDANI_3T_ISO: ${{ secrets.OSF_FILE_RIDANI_3T_ISO }}
          OSF_FILE_RIDANI_3T_ANISO: ${{ secrets.OSF_FILE_RIDANI_3T_ANISO }}
          OSF_FILE_RIDANI_7T_ANISO: ${{ secrets.OSF_FILE_RIDANI_7T_ANISO }}
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ph = os.environ['PHANTOM']
          d = json.load(open('scripts/datasets.json'))[ph]
          osf = (os.environ.get(d['osf_env']) if d.get('osf_env') else None) or d.get('osf_file') or ''
          if ph == "sim":
              print(f"zipkey=osf-bids-{osf}")
              print("zip=.osfcache/bids.zip")
          else:
              print(f"zipkey=osf-{ph}-{osf}")
              print(f"zip=.osfcache/{ph}.zip")
          print(f"path={d['path']}")
          PY
      - name: Cache OSF dataset zip
        uses: actions/cache@v6
        with:
          path: ${{ steps.ds.outputs.zip }}
          key: ${{ steps.ds.outputs.zipkey }}
      - name: Fetch dataset
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}
          OSF_FILE_RIDANI_3T_ISO: ${{ secrets.OSF_FILE_RIDANI_3T_ISO }}
          OSF_FILE_RIDANI_3T_ANISO: ${{ secrets.OSF_FILE_RIDANI_3T_ANISO }}
          OSF_FILE_RIDANI_7T_ANISO: ${{ secrets.OSF_FILE_RIDANI_7T_ANISO }}
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}
          OSF_ZIP: ${{ steps.ds.outputs.zip }}
          DS_PATH: ${{ steps.ds.outputs.path }}
        run: scripts/fetch_dataset.sh "$PHANTOM" "$DS_PATH"

      # The QSM.rs under test: a build from the qsmxt job, or a supplied image; else none, and
      # each QSM.rs step runs the image its algorithm.yml pins.
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.build == 'true'
        with:
          name: qsmxt-under-test-${{ needs.plan.outputs.key }}
          path: qsmxt-build
      - name: QSM.rs under test
        id: qsmrs
        env:
          QSMXT_IMAGE: ${{ needs.plan.outputs.qsmxt_image }}
        run: |
          if [ -n "$QSMXT_IMAGE" ]; then
            docker pull "$QSMXT_IMAGE"
            echo "image=$QSMXT_IMAGE" >> "$GITHUB_OUTPUT"
            echo "note=QSM.rs under test: supplied image \`$QSMXT_IMAGE\`" >> "$GITHUB_OUTPUT"
          elif [ -f qsmxt-build/qsmxt ]; then
            chmod +x qsmxt-build/qsmxt
            docker build -q -t qsmxt-under-test:${{ github.run_id }} -f parity/qsmxt.Dockerfile qsmxt-build
            echo "image=qsmxt-under-test:${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "note=QSM.rs under test: $([ -n "$RELEASE" ] || echo 'built from ')$(cat qsmxt-build/BUILT_FROM)" >> "$GITHUB_OUTPUT"
          else
            echo "note=QSM.rs under test: the qsmxt image each algorithm.yml pins" >> "$GITHUB_OUTPUT"
          fi

      # Released track: a release that predates the port (no such qsmxt subcommand) is that
      # release's result, "not in <tag>", decided before the original runs (which can take hours).
      - name: Is the port in this release?
        id: pre
        if: needs.plan.outputs.release != ''
        env:
          QSMRS_IMAGE: ${{ steps.qsmrs.outputs.image }}
        run: |
          python scripts/parity.py unavailable --algorithm "$ALGORITHM" --phantom "$PHANTOM" \
            --release "$RELEASE" --qsmrs-image "$QSMRS_IMAGE" --json parity.json --report parity-report.md
          if [ -f parity.json ]; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"; cat parity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run both implementations
        id: run
        if: steps.pre.outputs.unavailable != 'true'
        env:
          DS_PATH: ${{ steps.ds.outputs.path }}
          QSMRS_IMAGE: ${{ steps.qsmrs.outputs.image }}
        run: |
          t0=$(date +%s)
          set +e
          python -u scripts/parity.py run --algorithm "$ALGORITHM" --phantom "$PHANTOM" \
            --dataset "$DS_PATH" --work .parity --runner docker --qsmrs-image "$QSMRS_IMAGE" 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "== wall-clock: $(( $(date +%s) - t0 ))s =="
          # Released track, qsmxt refusing the port's command line (clap's errors; the patterns
          # parity.py clap_rejection matches): rerun just the candidate (never the reference)
          # without what the release has no option for, so it still gets a number, recorded as run
          # without them: first the pair's optional feeds (e.g. qsmxt v10.0.0 and `qsmart
          # --reliability`), then each `candidate_set` setting a refusal names (parity.py
          # rejected-setting; e.g. offset_grid → --qsmart-offset-grid), one more per refusal.
          # Exit 3 = nothing to drop. If it is still refused, the release does not have the port
          # as checked: "not in <tag>". Any other failure stays a failure.
          log=run.log
          clap="error: (unrecognized subcommand|unexpected argument|invalid value) '"
          if [ "$rc" -ne 0 ] && [ -n "$RELEASE" ] && grep -qE "$clap" run.log; then
            drops=()
            for attempt in 1 2 3 4 5 6; do
              set +e
              python -u scripts/parity.py run --algorithm "$ALGORITHM" --phantom "$PHANTOM" \
                --dataset "$DS_PATH" --work .parity --runner docker --qsmrs-image "$QSMRS_IMAGE" \
                --candidate-only --drop-optional-feeds "${drops[@]}" 2>&1 | tee "run-retry$attempt.log"
              rc2=${PIPESTATUS[0]}
              set -e
              if [ "$rc2" -eq 0 ]; then
                echo "::notice::$ALGORITHM: QSMxT $RELEASE ran without what it has no option for (${drops[*]:-optional feeds})"
                exit 0
              fi
              [ "$rc2" -ne 3 ] && log="run-retry$attempt.log"
              # the next setting to drop, from the latest refusal (run.log while nothing could be dropped)
              key=$(python scripts/parity.py rejected-setting --algorithm "$ALGORITHM" --phantom "$PHANTOM" --log "$log")
              { [ -z "$key" ] || [[ " ${drops[*]} " == *" $key "* ]] || ! grep -qE "$clap" "$log"; } && break
              drops+=(--drop-setting "$key")
            done
          fi
          if [ "$rc" -ne 0 ] && [ -n "$RELEASE" ]; then
            python scripts/parity.py unavailable --algorithm "$ALGORITHM" --phantom "$PHANTOM" \
              --release "$RELEASE" --log "$log" --json parity.json --report parity-report.md
            if [ -f parity.json ]; then
              echo "unavailable=true" >> "$GITHUB_OUTPUT"; cat parity-report.md >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
          fi
          exit "$rc"

      - name: Compare
        id: compare
        if: steps.pre.outputs.unavailable != 'true' && steps.run.outputs.unavailable != 'true'
        env:
          DS_PATH: ${{ steps.ds.outputs.path }}
          NOTE: ${{ steps.qsmrs.outputs.note }}
        run: |
          B=""; [ "$BASELINE" = "true" ] && B="--baseline"
          rc=0
          python scripts/parity.py compare --algorithm "$ALGORITHM" --phantom "$PHANTOM" \
            --dataset "$DS_PATH" --work .parity $B --note "$NOTE" \
            --report parity-report.md --json parity.json || rc=$?
          cat parity-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Kill this job's containers
        if: always()
        continue-on-error: true
        uses: ./.github/actions/kill-containers
        with:
          job-tag: ${{ github.run_id }}-parity-${{ matrix.algorithm }}-${{ matrix.phantom }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-${{ needs.plan.outputs.key }}-${{ matrix.algorithm }}-${{ matrix.phantom }}
          retention-days: 30
          if-no-files-found: ignore
          include-hidden-files: true   # the outputs live under .parity/
          path: |
            parity-report.md
            parity.json
            .parity/*/provenance.json
            .parity/*/*.nii.gz
            .parity/*/intermediates/*.nii.gz

      # The verdict alone, small, for the report job (the artifact above holds the volumes too).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-result-${{ needs.plan.outputs.key }}-${{ matrix.algorithm }}-${{ matrix.phantom }}
          retention-days: 90
          if-no-files-found: ignore
          path: parity.json

  # One record per pair × dataset (a job that ended before `compare` is recorded as an error) and
  # the run summary: which pairs passed against exactly the QSM.rs commit under test.
  report:
    needs: [plan, qsmxt, parity]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install -q pyyaml
      - uses: actions/download-artifact@v8
        continue-on-error: true   # none at all when every job failed early
        with:
          pattern: parity-result-${{ needs.plan.outputs.key }}-*
          path: results
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.build == 'true'
        continue-on-error: true
        with:
          name: qsmxt-under-test-${{ needs.plan.outputs.key }}
          path: qsmxt-build
      - name: Records and run summary
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
          QSMRS_REF: ${{ needs.plan.outputs.qsmrs_ref }}
          QSMXT_REF: ${{ needs.plan.outputs.qsmxt_ref }}
          TRACK: ${{ needs.plan.outputs.track }}
          RELEASE: ${{ needs.plan.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p results
          B=""; [ "$BASELINE" = true ] && B="--baseline"
          BUILD=""; [ -f qsmxt-build/built.json ] && BUILD="--build qsmxt-build/built.json"
          T="--track dev"; [ "$TRACK" = released ] && T="--track released --release $RELEASE"
          python3 scripts/parity.py report --artifacts results --matrix "$MATRIX" $B $BUILD $T \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" \
            --qsmci-commit "$GITHUB_SHA" --qsmrs-ref "$QSMRS_REF" --qsmxt-ref "$QSMXT_REF" \
            --out parity-records.json --summary summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: parity-records-${{ needs.plan.outputs.key }}
          path: parity-records.json
          retention-days: 90

  # Commits the run's records to parity/results.json and regenerates parity/status.json and
  # parity/STATUS.md, on main. Only for a run from main or with record=true (plan), never a
  # baseline. The push follows score.yml's merge job: bot identity, contents: write on this job
  # only, and a retry that re-applies this run's records onto the latest main instead of rebasing.
  record:
    needs: [plan, report]
    if: ${{ always() && needs.plan.outputs.record == 'true' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that commits
    # No concurrency group: GitHub cancels a second pending job in a group, which would drop a
    # run's records. Concurrent writers are handled by the retry below instead.
    env:
      RECORD_BRANCH: main
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ env.RECORD_BRANCH }}" }
      - run: pip install -q pyyaml
      - uses: actions/download-artifact@v8
        with:
          name: parity-records-${{ needs.plan.outputs.key }}
          path: /tmp/parity
      - name: Commit results and status
        env:
          GH_TOKEN: ${{ github.token }}   # status asks GitHub what changed in QSM.rs (rule b)
        run: |
          git config user.name  "qsm-ci-bot"
          git config user.email "qsm-ci@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$RECORD_BRANCH" -q
            git reset --hard "origin/$RECORD_BRANCH" -q
            python3 scripts/parity.py record --records /tmp/parity/parity-records.json
            python3 scripts/parity.py status --json parity/status.json --markdown parity/STATUS.md
            git add parity/results.json parity/status.json parity/STATUS.md
            git diff --cached --quiet && { echo "nothing to record"; exit 0; }
            git commit -q -m "Record parity run $GITHUB_RUN_ID"
            git push origin "HEAD:$RECORD_BRANCH" && exit 0
            echo "push attempt $attempt rejected — re-applying onto latest $RECORD_BRANCH"; sleep $((attempt * 3))
          done
          echo "::error::could not push parity results after 5 attempts"; exit 1
