name: pipeline

# End-to-end workflow-engine verification: build the same phase → χ pipeline
# (romeo-fieldmap → vsharp → rts) through nipype, pydra, CWL, Snakemake, and Nextflow, and check that
# all five produce the identical χ map and that it matches the ground truth. Uses the real challenge
# dataset (OSF, gated by OSF_TOKEN), so unlike ci.yml this job needs a secret — it runs on internal
# pushes/PRs, not forks. See tests/test_pipeline.py.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "qsm_ci/**"
      - "tests/test_pipeline.py"
      # Only the three methods this engine-parity test actually runs — not every submission. A change
      # to an unrelated method (e.g. a χ-separation one) can't affect the romeo→vsharp→rts engine check.
      # These MUST match the slugs tests/test_pipeline.py uses (they were the pre-rename names
      # romeo-fieldmap/vsharp/rts for a while, so a PR touching any of the three never triggered this).
      - "algorithms/romeo-qsmrs/**"
      - "algorithms/vsharp-qsmrs/**"
      - "algorithms/rts-qsmrs/**"
      - ".github/workflows/pipeline.yml"

defaults:
  run:
    shell: bash

permissions:
  contents: read   # runs the engines and reads the OSF dataset; commits nothing

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4       # Nextflow needs a JVM
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package (with the Python interfaces) + test deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[nipype,pydra]" pytest pyyaml

      - name: Install CWL / Snakemake / Nextflow engines
        # cwltool + snakemake are CLI tools the test only invokes via PATH, so install them isolated
        # (pipx) — co-resolving them with nipype/pydra makes pip backtrack to an ancient, unbuildable
        # cwltool. Nextflow is a standalone launcher (needs the JVM above): a PINNED release asset,
        # checksum-verified, instead of `curl get.nextflow.io | bash` (an unpinned installer with no
        # integrity check, which also fetched whatever version was current that day). The `-dist`
        # asset bundles every dependency, so nothing further is downloaded at first run. To bump:
        # pick a stable tag at https://github.com/nextflow-io/nextflow/releases and take the
        # `nextflow-<ver>-dist` asset's sha256 from the release page's digest (or `sha256sum` a fresh
        # download). NB 26.04+ enables the strict syntax parser by default — `nextflow lint
        # examples/workflow-engines/pipeline.nf` must stay clean.
        env:
          NEXTFLOW_VERSION: "26.04.6"
          NEXTFLOW_SHA256: "182a63c74074e2dc7956ffa3c8cd59de952ed2c44394e21faf5e1736b945444c"
        run: |
          pipx install cwltool
          pipx install snakemake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o nextflow \
            "https://github.com/nextflow-io/nextflow/releases/download/v${NEXTFLOW_VERSION}/nextflow-${NEXTFLOW_VERSION}-dist"
          echo "${NEXTFLOW_SHA256}  nextflow" | sha256sum -c -
          chmod +x nextflow
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Cache OSF dataset zip
        uses: actions/cache@v6
        with:
          path: .osfcache/bids.zip
          key: osf-bids-698ac9aecae88916d1e24f69

      - name: Fetch the real challenge dataset (public inputs + held-out ground truth)
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          OSF_ZIP: .osfcache/bids.zip
        run: scripts/fetch_dataset.sh sim /tmp/phantom

      - name: End-to-end pipeline across all 5 engines (phase → χ, scored vs ground truth)
        env:
          QSMCI_PHANTOM: /tmp/phantom
          QSMCI_ALGORITHMS: ${{ github.workspace }}/algorithms
        run: pytest -q -s tests/test_pipeline.py
