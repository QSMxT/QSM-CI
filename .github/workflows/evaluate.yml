name: evaluate

# Per-PR SMOKE check of a changed submission: run its stage in its container (no network) on a small
# central crop of the phantom and verify it emits a valid (present/finite/non-empty) output — a fast
# gate that the submission actually RUNS. It does NOT score; score.yml does the real scoring + the full
# composition matrix + leaderboard on merge to main. Runs on Neurodesk's self-hosted ARC runners.

on:
  pull_request:
    paths:
      - "algorithms/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Algorithm slug under algorithms/ to evaluate"
        required: true

# Nothing here commits or comments — the gate only runs containers and reads the reaper's run
# state — so the token is read-only. score.yml is the workflow that writes results.
permissions:
  contents: read
  actions: read   # the orphan-container reaper checks whether a labelled run is still active

env:
  TRACK: sim

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.changed.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slugs=[\"${{ inputs.slug }}\"]" >> "$GITHUB_OUTPUT"
          else
            # Only smoke methods whose EXECUTION could have changed vs the base — a metadata-only
            # algorithm.yml edit (taxonomy/description/citation) must NOT re-run the whole method zoo
            # for hours. ci_eval_targets.py includes a slug iff a non-yml file (run.sh/Dockerfile/…)
            # changed, or algorithm.yml changed outside a cosmetic allowlist, or it's a new method.
            slugs=$(python scripts/ci_eval_targets.py --base "origin/${{ github.base_ref }}")
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          fi

  # Fork PRs get an explicit, visible skip instead of a silent one (the evaluate job below is gated
  # off for them). Hosted, no checkout, no secrets — it only prints.
  fork-notice:
    needs: discover
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          SLUGS: ${{ needs.discover.outputs.slugs }}   # via env, never interpolated into the script: PR-named dirs
          REPO: ${{ github.repository }}
        run: |
          echo "::notice title=Smoke gate skipped for fork PR::The container smoke test (evaluate) only runs for branches in $REPO because it executes the PR's own scripts on shared self-hosted runners. A maintainer can push this branch into the repository to run it. Changed methods: $SLUGS"

  # Fork PRs never reach the self-hosted runners. This job checks out the PR's merge ref and runs
  # its scripts/pipeline.py + `pip install .` ON THE HOST (only the method itself is containerised),
  # with the Docker socket, on a persistent shared box — so a fork PR that edits one file under
  # algorithms/ could also rewrite pipeline.py and run arbitrary code there. Same-repo branches are
  # written by collaborators and are fine; `workflow_dispatch` is a maintainer action. A fork
  # contribution is smoke-tested by a maintainer pushing the branch into this repo (the
  # `fork-notice` job above says so on the PR's checks). Mirrors the guard ci.yml's manifest job uses.
  evaluate:
    needs: discover
    if: >-
      needs.discover.outputs.slugs != '[]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.discover.outputs.slugs) }}
    env:
      # Per-job container tag — see score.yml; lets the post-job kill step and the reaper identify
      # exactly this job's containers on the persistent self-hosted box.
      QSMCI_JOB_TAG: ${{ github.run_id }}-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v7

      # Persistent self-hosted boxes: cancelling an Actions job kills the docker CLIENT process but
      # NOT its container (`--rm` only cleans up after exit), so cancelled score runs used to leave
      # MATLAB/DL containers silently consuming the shared 31 GB runner's memory for hours — until
      # the oom-killer started taking out OTHER runs' jobs (observed 2026-08-26: ~27 GB of orphans).
      # Reap running qsm-ci containers whose owning run (the qsmci.run label, stamped by
      # qsm_ci.containers) is no longer active; unlabeled qsm-ci-* strays are reaped past 12 h.
      # Anything unconfirmable is kept (fail-safe). No-op on hosted runners (fresh VM every job).
      - name: Reap orphaned qsm-ci containers (self-hosted)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          QSMCI_JOB_TAG: ${{ github.run_id }}-${{ matrix.slug }}
        run: |
          command -v docker >/dev/null 2>&1 || exit 0
          python3 - <<'PY'
          import datetime, json, os, subprocess, urllib.request, urllib.error
          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout.strip()
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.load(r)
          ids = sh("docker", "ps", "-q", "--filter", "label=qsmci").split()
          ids += [i for i in sh("docker", "ps", "-q", "--filter", "name=qsm-ci-").split() if i not in ids]
          now = datetime.datetime.now(datetime.timezone.utc)
          me, mytag = os.environ["RUN_ID"], os.environ.get("QSMCI_JOB_TAG", "")
          active_names = None   # in-progress job names of MY run, fetched once on first need
          for c in ids:
              info = json.loads(sh("docker", "inspect", c) or "[]")
              if not info:
                  continue
              labels = info[0]["Config"].get("Labels") or {}
              rid, jtag = labels.get("qsmci.run"), labels.get("qsmci.job")
              kill = False
              if rid == me:
                  # Same run: my own / untagged containers are sacrosanct; another job's container is
                  # kept ONLY while that job is still in progress (else it's a failed sibling's
                  # leftover — the very orphans that cascaded OOM through a long run's later jobs).
                  if not jtag or jtag == mytag:
                      continue
                  if active_names is None:
                      try:
                          active_names = [j["name"] for j in api(f"/repos/{os.environ['REPO']}/actions/runs/{me}/jobs?per_page=100&filter=latest").get("jobs", [])
                                          if j.get("status") == "in_progress"]
                      except Exception:
                          active_names = None
                  if active_names is None:
                      continue                          # can't confirm -> keep
                  sfx = jtag[len(me) + 1:]
                  kill = not any(("(" + sfx + ",") in n or ("(" + sfx + ")") in n for n in active_names)
              elif rid:
                  try:
                      kill = api(f"/repos/{os.environ['REPO']}/actions/runs/{rid}").get("status") == "completed"
                  except urllib.error.HTTPError as e:
                      kill = e.code == 404              # run gone entirely
                  except Exception:
                      kill = False                      # can't confirm -> keep
              else:
                  started = info[0]["State"]["StartedAt"][:19] + "+00:00"
                  kill = (now - datetime.datetime.fromisoformat(started)).total_seconds() > 12 * 3600
              if kill:
                  print("reaping orphaned container %s (run %s, job %s)" % (c, rid or "-", jtag or "-"))
                  sh("docker", "kill", c)
          PY

      - name: Install scorer deps
        # `.` installs the qsm-ci CLI onto PATH — pipeline.py --runner docker delegates each run to
        # `qsm-ci run …` (one run path, no CI-side container builds).
        run: |
          pip install -r eval/requirements.txt
          pip install --upgrade setuptools setuptools_scm wheel   # runner's build tools are too old for setuptools-scm
          pip install --no-build-isolation .                       # build the CLI with the upgraded tools

      # Route each method to the right phantom by its stage: χ-separation methods need a chisep-track
      # dataset (χ+/χ− ground truth + R2'/χ_total inputs), everything else the QSM scoring phantom.
      # The PR smoke only ever runs on the track's DEFAULT phantom (scripts/datasets.json `default`) —
      # score.yml fans the real scoring out across every active phantom on merge.
      - name: Route dataset by stage
        id: route
        # The dangling empty `env:` this block once carried made the whole workflow file unparseable
        # to GitHub (schema error) — since 2026-08-11 evaluate.yml produced NO pull_request runs (the
        # PR smoke gate was silently dead) and a phantom zero-job "failure" run on every main push.
        # The zipkey below reads the secret named by the routed phantom's `osf_env` — only the chisep
        # default phantom needs one (sim carries a literal `osf_file` id); add its sibling here if the
        # chisep default ever changes in scripts/datasets.json.
        env:
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}   # χ-sep multicompartment (pre-flattened)
        run: |
          stage=$(sed -nE 's/^stage:[[:space:]]*//p' "algorithms/${{ matrix.slug }}/algorithm.yml" | head -1)
          track=sim
          case "$stage" in chi-separation|r2prime-generation) track=chisep ;; esac
          STAGE_TRACK="$track" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          reg = json.load(open('scripts/datasets.json'))
          track = os.environ['STAGE_TRACK']
          ph = next(k for k, v in reg.items() if v.get('track') == track and v.get('default'))
          d = reg[ph]
          osf = (os.environ.get(d['osf_env']) if d.get('osf_env') else None) or d.get('osf_file') or ''
          print(f"fetch_track={ph}")
          print(f"dataset={d['path']}")
          print(f"zipkey=osf-{ph}-{osf}")
          PY
          # Dipole methods are the only stage scored on the in-vivo track, so only they get the extra
          # invivo smoke leg below.
          echo "is_dipole=$([ "$stage" = dipole ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Cache OSF dataset zip
        uses: actions/cache@v6
        with:
          path: .osfcache/${{ steps.route.outputs.fetch_track }}.zip
          key: ${{ steps.route.outputs.zipkey }}
      - name: Fetch dataset (public inputs + held-out ground truth)
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          # fetch_dataset.sh resolves the zip via the routed phantom's `osf_env` secret — without this
          # a chi-separation / r2prime-generation smoke fails at fetch ("set OSF_FILE_CHISEP_MC").
          OSF_FILE_CHISEP_MC: ${{ secrets.OSF_FILE_CHISEP_MC }}   # χ-sep multicompartment (pre-flattened)
          OSF_ZIP: .osfcache/${{ steps.route.outputs.fetch_track }}.zip
        run: scripts/fetch_dataset.sh "${{ steps.route.outputs.fetch_track }}" "${{ steps.route.outputs.dataset }}"

      - name: Smoke check (run the method, verify a valid output — no full scoring)
        # --smoke: crop inputs to a central box, run the submission in its container, and assert it
        # emits a present/finite/non-empty output. This is the PR GATE — it catches a broken run.sh,
        # crash, permissions issue, or bad output artifact cheaply, without the full-resolution
        # reconstruction or the scoring that score.yml re-does on merge. --fail-on-dnf turns any such
        # failure RED instead of merging green and silently DNF'ing on main.
        run: |
          python scripts/pipeline.py \
            --dataset "${{ steps.route.outputs.dataset }}" \
            --mode isolated --runner docker --only "${{ matrix.slug }}" --track "$TRACK" \
            --smoke --fail-on-dnf

      # ---- In-vivo (2016 challenge) smoke leg — dipole methods only --------------------------------
      # The in-vivo track scores each dipole method (localfield -> chimap) against COSMOS + STI. It is
      # an ADDITIONAL run of the same dipole methods (not a reroute of a disjoint set like chisep), so
      # a changed dipole method also gets a cheap smoke on the invivo dataset here — proving it runs on
      # that grid too — while score.yml does the real invivo scoring + leaderboard on merge. The invivo
      # zip is pre-flattened (fetch_dataset.sh invivo just unzips it) and gated behind its own
      # OSF_FILE_INVIVO secret + .osfcache/invivo.zip cache key.
      - name: Cache invivo OSF zip
        if: steps.route.outputs.is_dipole == 'true'
        uses: actions/cache@v6
        with:
          path: .osfcache/invivo.zip
          key: osf-invivo-${{ secrets.OSF_FILE_INVIVO }}
      - name: Fetch invivo dataset
        if: steps.route.outputs.is_dipole == 'true'
        env:
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          OSF_FILE_INVIVO: ${{ secrets.OSF_FILE_INVIVO }}
          OSF_ZIP: .osfcache/invivo.zip
        run: scripts/fetch_dataset.sh invivo data/invivo/scoring
      - name: Smoke check (in-vivo dipole)
        if: steps.route.outputs.is_dipole == 'true'
        run: |
          python scripts/pipeline.py \
            --dataset data/invivo/scoring \
            --mode isolated --runner docker --only "${{ matrix.slug }}" --track invivo \
            --smoke --fail-on-dnf

      # Belt to the reaper's braces: whatever way this job ends (incl. a failed score step — exit 137
      # still runs `always()` steps), kill the containers IT started, so a long run's later
      # self-hosted jobs never inherit them. Only a whole-runner death skips this; the next job's
      # reaper covers that via the same-run job-tag check.
      - name: Kill this job's containers
        if: always()
        continue-on-error: true
        run: |
          command -v docker >/dev/null 2>&1 || exit 0
          [ -n "$QSMCI_JOB_TAG" ] && docker ps -q --filter "label=qsmci.job=$QSMCI_JOB_TAG" | xargs -r docker kill || true
