name: pages

# Deploy the static leaderboard (web/ + results/) to GitHub Pages.
# No build step — the site is vanilla HTML/JS and reads results/index.json at runtime.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "results/**"
      - ".github/workflows/pages.yml"
  # The `score` job commits results/index.json with the default GITHUB_TOKEN, whose pushes do
  # NOT trigger the `push` event above — so deploy explicitly once scoring finishes.
  workflow_run:
    workflows: ["score"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Compile Tailwind to web/styles.css before assembling the site (replaces the old CDN JIT build).
      # The committed styles.css is regenerated here so a push always deploys CSS matching current markup.
      - name: Build Tailwind CSS
        working-directory: web
        run: |
          npm ci
          npm run build:css

      - name: Assemble site (web/ + results/ served alongside)
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp -r results _site/results
          cp -r docs _site/docs           # the Submit page renders docs/submitting.md
          rm -rf _site/examples; cp -r examples _site/examples   # Run page showcases the engine examples
          rm -f _site/registry.json; cp qsm_ci/registry.json _site/registry.json  # method DOIs (drop the web/ symlink first)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
