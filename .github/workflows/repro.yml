name: repro

# Harmonization (repro track) — the GitHub Actions counterpart to the Bunya campaign
# (scripts/repro_slurm/). Mirrors the in-silico score.yml: incremental re-scoring when an ALGORITHM
# changes (only the pipelines that use it, across all acquisitions), a full re-run when the
# SCORER/pipeline changes, automatic HuggingFace volume publishing, and an index.json + repro.json
# commit (pages.yml redeploys the site when this workflow completes — its workflow_run trigger —
# because a GITHUB_TOKEN push raises no `push` event).
#
# SCALE-READY DATA FLOW — no volume ever gathers centrally:
#   Each `score` job reconstructs its shard, publishes its OWN recon volumes straight to HuggingFace
#   (publish_volumes.py --runs), and computes its OWN per-ROI stats (repro_eval.py stats --runs).
#   Only a tiny runs-JSON (metrics + volume URLs + ROI means) travels onward. `evaluate` merges those
#   and does the lightweight pairwise fits — so 90 GB of χ maps never touches a runner's disk or the
#   artifact store. This is what makes it scale to self-hosted GPU runners.
#
# ┌─ WHY AUTO-TRIGGER IS OFF ─────────────────────────────────────────────────────────────────────┐
# │ The full matrix is ~15k container runs (23 acquisitions × ~660 pipelines). GitHub-HOSTED runners │
# │ (2-core, 6 h cap) can't do that in sane time — the compute needs self-hosted hardware. The       │
# │ workflow is written and TESTED-READY: uncomment the `push:` trigger and set include_gpu=true      │
# │ once self-hosted GPU runners exist, and it behaves exactly like the in-silico track. Until then,  │
# │ run it by hand (workflow_dispatch); do heavy full runs on Bunya.                                  │
# └────────────────────────────────────────────────────────────────────────────────────────────────┘
#
#   scope    -> full (scorer/pipeline changed, or scope=all) vs affected slugs (changed algorithms);
#               `[skip score]` in the commit message skips the run entirely (see score.yml)
#   prep     -> build the reference frame once: target grid + SynthSeg dseg (artifact for the rest)
#   plan     -> full: acquisition × shard matrix; affected: acquisition × --focus-per-slug
#   score    -> reconstruct; publish own volumes to HF; compute own ROI stats; emit small runs-JSON
#   evaluate -> merge runs-JSON -> index.json; pairwise fits -> repro.json; prune the volumes of
#               pipelines repro.json no longer names; squash HF history after a full run; commit
#               (pages.yml then redeploys the site via its workflow_run trigger)
#
# VIEWER INTERMEDIATES (the submission page's Field map / Local field layers) ride along for free.
# They are per COLUMN, not per pipeline — one total field per field-mapping method, one local field
# per (field-mapping, bfr) pair — so an acquisition's several hundred pipelines collapse to
# F + F*B files (a couple of dozen), and no job runs a single extra container to produce them: the
# score jobs already compute those columns on the way to the dipole stage, and `--emit-intermediates`
# just keeps the two upstream artifacts instead of discarding them. Publication is
# deduplicated the same way: a localfield's column belongs to exactly one shard, and a field map
# (which every shard consuming it re-runs) is published only by the shard owning its first consuming
# column — see pipeline.py's tf_emit_owner. Incremental runs only emit when the changed slug is
# upstream (field-mapping / bfr), since a dipole change leaves both maps byte-identical.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all | auto (diff since last commit) | comma-separated slugs"
        default: "all"
      shards:
        description: "shards per acquisition for a FULL run (hosted jobs = 23 × shards)"
        default: "6"
      acquisitions:
        description: "all | comma-separated acquisition ids (scripts/datasets.json repro keys)"
        default: "all"
      include_gpu:
        description: "true = also run inr-qsm/modip + any runner:self-hosted method (needs self-hosted GPU runners)"
        default: "false"
      publish_hf:
        description: "true = each score job publishes its recon volumes (+ its share of the viewer's field-map/local-field intermediates) to HuggingFace"
        default: "true"
      dry_run:
        description: "true = run + evaluate but DON'T commit (upload candidate artifacts)"
        default: "false"
  # ── ENABLE WHEN THE COMPUTE INFRA IS READY (same incremental behaviour as the in-silico track) ──
  # push:
  #   branches: [main]
  #   paths:
  #     - "algorithms/**"
  #     - "eval/**"
  #     - "scripts/pipeline.py"
  #     - "scripts/repro_eval.py"
  #     - "stages.yml"

defaults:
  run:
    shell: bash

concurrency:
  group: repro
  cancel-in-progress: false

# Read-only token by default: the scope/prep/plan/score jobs only run containers and pass small
# artifacts around. Only `evaluate` commits (job-level `contents: write` there).
permissions:
  contents: read

env:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
  QSM_CI_JOBS: "2"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
      slugs: ${{ steps.decide.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: decide
        env:
          SCOPE: ${{ github.event.inputs.scope || 'auto' }}
          BEFORE: ${{ github.event.before }}   # the push's previous head; empty on workflow_dispatch
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$SCOPE" = "all" ]; then
            echo "full=true"  >>"$GITHUB_OUTPUT"; echo "slugs=[]" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCOPE" != "auto" ]; then
            echo "full=false" >>"$GITHUB_OUTPUT"
            echo "slugs=$(echo "$SCOPE" | tr ', ' '\n' | { grep . || true; } | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # `[skip score]` in the pushed commit message: this push touched a scored path but cannot
          # move any number — an added opt-in flag, a docstring, a comment, a refactor behind a
          # default-off branch. GitHub's own skip token would also stop the rescore, but it suppresses
          # EVERY workflow on the push, so the tests wouldn't run and the site wouldn't redeploy.
          # This stops the rescore and nothing else. Read via `git log` rather than the event payload
          # so a crafted commit message can't be interpolated into this shell. Push only — a manual
          # dispatch ignores it, so `scope=all` is always the escape hatch.
          if [ "$EVENT" = "push" ] \
             && git log -1 --format=%B "$SHA" | grep -qF '[skip score]'; then
            echo "::notice::[skip score] in the commit message — skipping the rescore. Dispatch with scope=all to force one."
            echo "full=false" >>"$GITHUB_OUTPUT"; echo "slugs=[]" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # Diff base: the push's previous head. On a manual dispatch it is EMPTY, and a force-push
          # can leave it unknown — and `git diff "" <sha>` does not fail, it diffs the worktree against
          # <sha> (nothing), so scope=auto used to schedule zero methods and go green. Fall back to
          # HEAD~1: for a merge commit that is main-before-the-merge, i.e. "what the last merge changed".
          before="$BEFORE"
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then before="HEAD~1"; fi
          changed=$(git diff --name-only "$before" HEAD)
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$changed" ]; then
            echo "::warning::scope=auto: nothing changed in $before..HEAD — nothing to score. Dispatch with scope=all or a slug list."
          fi
          if echo "$changed" | grep -qE '^(eval/|scripts/pipeline\.py|scripts/repro_eval\.py|stages\.yml)'; then
            echo "full=true"  >>"$GITHUB_OUTPUT"; echo "slugs=[]" >>"$GITHUB_OUTPUT"
          else
            # no algorithms/ path in this push is normal, not a failure — see `|| true`
            slugs=$(echo "$changed" | { grep '^algorithms/' || true; } | cut -d/ -f2 | { grep -v '^_' || true; } | sort -u | jq -R . | jq -sc .)
            echo "full=false" >>"$GITHUB_OUTPUT"; echo "slugs=$slugs" >>"$GITHUB_OUTPUT"
          fi

  # Build the shared reference frame ONCE — target grid + SynthSeg segmentation — and hand it to
  # every score job as an artifact, so ROI extraction is identical across acquisitions and no job
  # re-runs SynthSeg. (data/**/_align is .nii.gz, gitignored — the site keeps volumes off git.)
  prep:
    needs: scope
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deps
        run: |
          pip install -r eval/requirements.txt SimpleITK
          pip install --upgrade setuptools setuptools_scm wheel
          pip install --no-build-isolation .
      - name: Fetch the target acquisition
        run: |
          python3 - <<'PY' | while read -r ph path; do scripts/fetch_dataset.sh "$ph" "$path"; done
          import json
          reg = json.load(open('scripts/datasets.json'))
          # the repro track's registration target (repro_eval.DEFAULT_TARGET)
          print('cima-bridge-run1', reg['cima-bridge-run1']['path'])
          PY
      - name: Build reference frame (target grid + SynthSeg dseg)
        run: |
          python scripts/repro_eval.py register --target-only
          python scripts/repro_eval.py seg          # SynthSeg via docker freesurfer/freesurfer
      - uses: actions/upload-artifact@v7
        with:
          name: repro-align
          retention-days: 2
          path: data/harmonization/_align/*

  plan:
    needs: scope
    if: needs.scope.outputs.full == 'true' || needs.scope.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.gen.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        env:
          FULL: ${{ needs.scope.outputs.full }}
          SLUGS: ${{ needs.scope.outputs.slugs }}
          N: ${{ github.event.inputs.shards || '6' }}
          ACQS: ${{ github.event.inputs.acquisitions || 'all' }}
          INCLUDE_GPU: ${{ github.event.inputs.include_gpu || 'false' }}
        run: |
          TASKS=$(python3 - <<'PY'
          import json, os, re, glob
          full = os.environ['FULL'] == 'true'
          include_gpu = os.environ['INCLUDE_GPU'] == 'true'
          REG = json.load(open('scripts/datasets.json'))
          want = os.environ['ACQS']
          acqs = sorted(k for k, v in REG.items() if v.get('track') == 'repro' and v.get('active'))
          if want != 'all':
              pick = {s.strip() for s in want.split(',')}
              acqs = [a for a in acqs if a in pick]
          HOSTED     = {'runs_on': 'ubuntu-latest', 'timeout': 300, 'gpu': '0'}
          SELFHOSTED = {'runs_on': ['self-hosted', 'Linux', 'X64'], 'timeout': 720, 'gpu': '1'}
          def self_hosted(slug):
              try: t = open(f'algorithms/{slug}/algorithm.yml').read()
              except FileNotFoundError: return False
              return bool(re.search(r'^runner:[ \t]*(self-hosted|hosted-large)', t, re.M)) or slug in ('inr-qsm', 'modip')
          # The viewer's Field map / Local field layers come from the two UPSTREAM stages. A full
          # shard computes them anyway, so it always emits; a --focus job only does when the changed
          # slug is one of those stages — re-emitting after a dipole change would re-upload bytes
          # identical to what is already on the Hub, once per acquisition.
          UPSTREAM = ('field-mapping', 'bfr', 'unwrap+bfr')
          def upstream(slug):
              try: t = open(f'algorithms/{slug}/algorithm.yml').read()
              except FileNotFoundError: return False
              m = re.search(r'^stage:[ \t]*(\S+)', t, re.M)
              return bool(m) and m.group(1).strip('"\'') in UPSTREAM
          heavy = sorted(s for p in glob.glob('algorithms/*/algorithm.yml')
                         for s in [p.split('/')[1]] if not s.startswith('_') and self_hosted(s))
          N = int(os.environ['N'])
          tasks = []
          if full:
              excl = ','.join(heavy)
              tasks += [{'id': f'{a}-s{i}', 'phantom': a, 'shard': f'{i}/{N}', 'exclude': excl,
                         'intermediates': 'true', **HOSTED}
                        for a in acqs for i in range(N)]
              if include_gpu:
                  # every heavy method is a dipole/end-to-end one, so it publishes no intermediates
                  tasks += [{'id': f'{a}-{s}', 'phantom': a, 'focus': s, 'intermediates': 'false', **SELFHOSTED}
                            for a in acqs for s in heavy]
          else:
              slugs = json.loads(os.environ['SLUGS'])
              for a in acqs:
                  for s in slugs:
                      inter = 'true' if upstream(s) else 'false'
                      if self_hosted(s):
                          if include_gpu:
                              tasks.append({'id': f'{a}-{s}', 'phantom': a, 'focus': s,
                                            'intermediates': inter, **SELFHOSTED})
                      else:
                          tasks.append({'id': f'{a}-{s}', 'phantom': a, 'focus': s,
                                        'intermediates': inter, **HOSTED})
          print(json.dumps(tasks))
          PY
          )
          echo "tasks=$TASKS" >>"$GITHUB_OUTPUT"
          echo "planned $(echo "$TASKS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') tasks"

  score:
    needs: [scope, prep, plan]
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    runs-on: ${{ matrix.task.runs_on }}
    timeout-minutes: ${{ matrix.task.timeout }}
    env:
      QSMCI_GPU: ${{ matrix.task.gpu }}   # self-hosted GPU jobs -> 1 -> docker/apptainer --gpus
      # Matrix values derive from the dispatch inputs (acquisitions / scope slugs): they reach the
      # shell through env, never interpolated into a `run:` script.
      TASK_ID: ${{ matrix.task.id }}
      PHANTOM: ${{ matrix.task.phantom }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: repro-align, path: data/harmonization/_align }

      - name: Install qsm-ci CLI + eval deps
        run: |
          pip install -r eval/requirements.txt huggingface_hub SimpleITK
          pip install --upgrade setuptools setuptools_scm wheel
          pip install --no-build-isolation .

      - name: Resolve dataset zip (scripts/datasets.json)
        id: ds
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ph = os.environ['PHANTOM']
          d = json.load(open('scripts/datasets.json'))[ph]
          print(f"zipkey=osf-{ph}-{d.get('osf_file', '')}")
          print(f"path={d['path']}")
          PY
      - name: Cache OSF dataset zip
        uses: actions/cache@v6
        with:
          path: .osfcache/${{ matrix.task.phantom }}.zip
          key: ${{ steps.ds.outputs.zipkey }}
      - name: Fetch acquisition (public OSF project — tokenless)
        env:
          OSF_ZIP: .osfcache/${{ matrix.task.phantom }}.zip
          DS_PATH: ${{ steps.ds.outputs.path }}
        run: scripts/fetch_dataset.sh "$PHANTOM" "$DS_PATH"

      - name: Reconstruct ${{ matrix.task.id }}
        env:
          SHARD: ${{ matrix.task.shard }}
          FOCUS: ${{ matrix.task.focus }}
          EXCLUDE: ${{ matrix.task.exclude }}
          INTERMEDIATES: ${{ matrix.task.intermediates }}
        run: |
          ARGS="--phantom $PHANTOM --track repro --mode composed --runner docker"
          ARGS="$ARGS --runs-out runs-$TASK_ID.json"
          [ -n "$SHARD" ]   && ARGS="$ARGS --shard $SHARD"
          [ -n "$FOCUS" ]   && ARGS="$ARGS --focus $FOCUS"
          [ -n "$EXCLUDE" ] && ARGS="$ARGS --exclude $EXCLUDE"
          # Keep this job's share of the viewer's field-map / local-field maps (no extra containers:
          # these are the upstream stages it already runs), deduplicated across shards by pipeline.py.
          [ "$INTERMEDIATES" = "true" ] && ARGS="$ARGS --emit-intermediates"
          echo "== pipeline.py $ARGS"
          python scripts/pipeline.py $ARGS

      # Publish THIS job's recon volumes straight to HuggingFace and stamp the URLs into its runs-JSON
      # — no volume artifact, nothing gathered centrally. (Same repo + mechanism as the in-silico track.)
      - name: Publish this shard's volumes to Hugging Face
        if: ${{ github.event.inputs.publish_hf != 'false' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
        run: python scripts/publish_volumes.py results --runs "runs-$TASK_ID.json"

      # The submission viewer's Field map / Local field layers: this job's share of the per-column
      # intermediates, into the same repro/<acq>/ directory as the recons. The URLs are derived from
      # the pipeline id client-side, so nothing has to be threaded through the runs-JSON.
      - name: Publish this shard's intermediates to Hugging Face
        if: ${{ matrix.task.intermediates == 'true' && github.event.inputs.publish_hf != 'false' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
        run: python scripts/publish_repro_intermediates.py results --acq "$PHANTOM"

      # Compute THIS shard's per-ROI stats (registers its acquisition to the shared target) and write
      # them into the runs-JSON, so evaluate never needs the recon volumes.
      - name: Per-ROI stats for this shard
        run: python scripts/repro_eval.py stats --runs "runs-$TASK_ID.json"

      - uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.task.id }}
          retention-days: 2
          path: runs-${{ matrix.task.id }}.json   # tiny — metrics + volume URLs + ROI means

  evaluate:
    needs: [scope, prep, score]
    if: ${{ always() && needs.scope.result == 'success' && needs.score.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the only job that commits (results/index.json + results/repro.json)
      actions: read     # the squash step checks whether score.yml is mid-publish
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { pattern: repro-*, merge-multiple: true, path: . }

      - name: Deps
        run: pip install -r eval/requirements.txt

      - name: Merge shard runs into results/index.json (carrying volume URLs + ROI means)
        run: |
          cp results/index.json /tmp/base-index.json
          python3 - <<'PY'
          import json, glob
          runs = []
          for f in sorted(glob.glob("runs-*.json")):
              runs += json.load(open(f))
          idx = json.load(open("results/index.json"))
          ids = {r["id"] for r in runs}
          merged = [r for r in idx["runs"] if r.get("id") not in ids] + runs
          json.dump({"generated": None, "runs": merged}, open("results/index.json", "w"), indent=2)
          dnf = [r["id"] for r in runs if r.get("status") == "DNF"]
          print(f"merged {len(runs)} repro runs ({len(dnf)} DNF); index now {len(merged)}")
          PY

      # No recons on disk — fits reads the ROI means straight from the merged index.json run rows.
      - name: Pairwise fits -> results/repro.json
        run: python scripts/repro_eval.py fits

      # repro.json names every live pipeline (fits drops methods retired from the manifest) and the
      # viewer derives every harmonization URL from pipeline × acquisition. A file under repro/<acq>/
      # that no live pipeline can name AND that names a method the manifest no longer defines is
      # retired — its recon, sidecars, and the per-column intermediates only it used go. One built
      # only from live methods but absent from repro.json (a GPU method published without a stats
      # pass, a parked submission) is kept: it is the only copy. Never an acquisition
      # scripts/datasets.json does not list. See publish_volumes.py --prune-repro.
      - name: Prune retired harmonization volumes on Hugging Face
        if: ${{ github.event.inputs.publish_hf != 'false' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
        run: python scripts/publish_volumes.py --prune-repro

      # Overwritten and deleted volumes keep their LFS objects in the Hub repo's history; only a
      # squash frees the storage. A full run rewrites ~30k files, so squash after one. The score
      # workflow is the only other writer (this run's own shards are finished — evaluate needs them);
      # if it is mid-publish, leave the squash to the next full run rather than overlap.
      - name: Squash HF volume history (full run)
        if: ${{ github.event.inputs.publish_hf != 'false' && github.event.inputs.dry_run != 'true' && needs.scope.outputs.full == 'true' }}
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_VOLUMES_REPO: ${{ vars.HF_VOLUMES_REPO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --workflow score.yml --status in_progress --json databaseId --jq length)
          if [ "$busy" != "0" ]; then
            echo "::notice::squash skipped: $busy score.yml run(s) in progress may be publishing volumes; the next full run will squash."
            exit 0
          fi
          python scripts/squash_hf_history.py

      - name: Commit results (index + repro fits + volume URLs)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "qsm-ci-bot"
          git config user.email "qsm-ci@users.noreply.github.com"
          cp results/index.json /tmp/scored-index.json
          # repro.json is tracked, so the `git reset --hard` below would silently revert the fits
          # just computed (it did, for every run before this: the file never made it to main).
          # Park it with the index and put it back after the reset.
          cp results/repro.json /tmp/scored-repro.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q
            python3 scripts/merge_index.py /tmp/base-index.json /tmp/scored-index.json \
                    results/index.json results/index.json
            cp /tmp/scored-repro.json results/repro.json
            git add results/index.json results/repro.json
            git diff --cached --quiet && { echo "no changes to publish"; exit 0; }
            git commit -q -m "Update harmonization (repro) results"
            git push && exit 0
            echo "push attempt $attempt rejected — retrying onto latest main"; sleep $((attempt * 3))
          done
          echo "::error::could not push results after 5 attempts"; exit 1

      - name: (dry-run) upload candidate results
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: repro-candidate
          path: |
            results/index.json
            results/repro.json
