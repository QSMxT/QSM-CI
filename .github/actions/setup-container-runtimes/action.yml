name: Set up container runtimes
description: >-
  Install apptainer and point podman at runc on a GitHub-hosted ubuntu runner, so the
  docker · podman · apptainer runner matrix works. No inputs: both ci.yml call sites — the
  interface tests and the container-runner smoke — exercise all three runners, so both need both
  of these. (docker and podman themselves are preinstalled on ubuntu-latest.)

runs:
  using: composite
  steps:
    - name: Install apptainer  # docker + podman are preinstalled on ubuntu-latest
      # Composite steps do not inherit the caller's `defaults.run`, so every `run:` here names its
      # shell; `bash` means `bash --noprofile --norc -eo pipefail`, same as ci.yml's default.
      shell: bash
      run: |
        ver=1.3.6
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "apptainer_${ver}_amd64.deb" "https://github.com/apptainer/apptainer/releases/download/v${ver}/apptainer_${ver}_amd64.deb"
        sudo apt-get update -qq
        sudo apt-get install -y "./apptainer_${ver}_amd64.deb"

    - name: Point podman at runc
      # The ubuntu-latest image ships a podman/crun combo that errors "crun: unknown version
      # specified" on `podman run`. runc is also preinstalled and handles the OCI bundle fine, so
      # select it as podman's default runtime for the container-runner smoke and for the interface
      # tests, both of which run methods through podman.
      shell: bash
      run: |
        mkdir -p ~/.config/containers
        printf '[engine]\nruntime = "runc"\n' > ~/.config/containers/containers.conf
        podman info --format '{{.Host.OCIRuntime.Name}}' || true
