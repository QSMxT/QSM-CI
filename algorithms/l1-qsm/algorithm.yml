name: L1-QSM
slug: l1-qsm
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  L1-norm data-fidelity QSM (PI-QSM): an L1 fidelity term with TV regularization, robust to phase inconsistencies.
citation: Milovic et al., Magn Reson Med 2022
doi: 10.1002/mrm.28957
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.9.0
run: bash run.sh
parameters:
  - name: alpha1
    default: 2e-4
    tuned:
      sim: 8e-4
      invivo: 0.02
    description: gradient L1 (TV) penalty
  - name: mu1
    default: 2e-2
    description: gradient-consistency ADMM weight
  - name: lambda
    default: 1.0
    description: L1 fidelity strength (<1 rejects more inconsistent voxels)
  - name: max_iter
    default: 50
    description: iterations
  - name: tol_update
    default: 1.0
    description: convergence threshold on the solution update (percent)
