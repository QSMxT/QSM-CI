name: MoDL-QSM (QSM.rs)
slug: modl-qsm-qsmrs
algorithm: modl-qsm
source: qsmrs
stage: dipole
language: Rust
family: deep-learning
learning: pretrained
inputs: [localfield, mask, params]
engine: QSMxT / QSM.rs
description: >
  MoDL-QSM as QSM.rs runs it: the authors' trained weights exported to ONNX and run by `qsmxt invert
  modl-qsm` (QSM.rs's ONNX engine, CPU). The QSM.rs port of the `modl-qsm` entry, which runs the
  authors' own code and weights.
