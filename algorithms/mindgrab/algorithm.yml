name: MindGrab (brainchop)
slug: mindgrab
algorithm: mindgrab
source: brainchop
stage: brain-extraction
language: Python
family: deep-learning
learning: pretrained
engine: brainchop-cli (tinygrad)
inputs: [magnitude]  # the artifacts this method actually reads (a subset of the stage's inputs)
description: >
  MindGrab, brainchop's any-contrast skull-stripping MeshNet, run by the authors' own pipeline:
  `brainchop --skull-strip` (brainchop-cli, tinygrad, CPU), which conforms the image to 256³ at 1 mm
  (niimath), normalises it by quantiles, runs the network, keeps the largest 26-connected component
  and reslices the mask back to the input grid. The echoes are combined by root-sum-of-squares
  first, as for the other brain-extraction entries.
authors:
- name: Fani et al.
  note: MindGrab (brainchop)
doi: 10.48550/arXiv.2506.11860
citation: Fani et al., arXiv:2506.11860 (2025)
