run: bash run.sh
# The original, checked (QSMxT/QSM-CI#301): pinned code, dependencies and weights; the same output
# twice. brainchop-cli 31150c3 is the first commit that applies the trained head bias
# (neuroneural/brainchop-cli#59/#60); every release to 0.2.5 drops it.
