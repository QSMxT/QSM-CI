name: QSMART (QSM.rs)
slug: qsmart-qsmrs
algorithm: qsmart
source: qsmrs
stage: bfr+dipole
language: Rust
family: iterative
learning: none
# run.sh guards both files. magnitude: runs without the SNR weight when absent. reliability (R_0):
# only port parity supplies it (the original's own R_0, parity/thresholds.yml `feed:`); without it
# both stages run over the whole mask.
optional_inputs: [magnitude, reliability]
engine: QSMxT / QSM.rs
description: >
  QSMART: vessel-aware two-stage reconstruction. Consumes the total field and produces
  susceptibility, doing its own spatially-dependent background field removal and vasculature-aware
  regularization (Frangi vessel detection + SDF).
citation: Yaghmaie et al., NeuroImage 2021
authors:
- name: Negin Yaghmaie
- name: Warda T. Syeda
- name: Chengchuan Wu
- name: Yicheng Zhang
- name: Tracy D. Zhang
- name: Emma L. Burrows
- name: Amy Brodtmann
- name: Bradford A. Moffat
- name: David K. Wright
- name: Rebecca Glarin
- name: Scott Kolbe
- name: Leigh A. Johnston
doi: 10.1016/j.neuroimage.2020.117701
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
  - name: offset_grid
    default: fft
    description: "k-space grid of the stage combination: fft (QSM.rs's) or qsmart-reference (the authors' adjust_offset.m grid; differs only on odd matrix dims); a parity switch, not a tuning parameter"
