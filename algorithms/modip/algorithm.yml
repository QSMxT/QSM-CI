name: MoDIP
slug: modip
algorithm: modip
source: sunhongfu
stage: dipole
language: Python
family: deep-learning
learning: untrained
engine: Independent
description: >
  MoDIP — model-based deep image prior for QSM dipole inversion. UNSUPERVISED / untrained: no
  pretrained weights are loaded — a small 3D U-Net (deep image prior) is optimized per-subject at
  inference time to fit the input local field through the QSM dipole forward model, with a
  gradient-domain regularizer. Consumes the local (tissue) field in ppm and produces susceptibility
  (ppm). The dipole kernel is built internally from the B0 direction and voxel size. Runs CPU-only by
  default (the reference is GPU-oriented; see RUNTIME/GPU CAVEAT in README). Because it optimizes per
  input volume, runtime is long (hundreds of iterations).
authors:
- name: Xiong Z.
- name: Gao Y.
- name: Liu Y.
- name: Fazlollahi A.
- name: Nestor P.
- name: Liu F.
- name: Sun H.
# DOI verified via PubMed/ScienceDirect: NeuroImage vol. 291, article 120583 (2024). The DOI given in
# the submission brief (…120540) did not resolve to this paper; using the verified 120583.
doi: 10.1016/j.neuroimage.2024.120583
code_url: https://github.com/sunhongfu/MoDIP
# The MoDIP repo ships NO LICENSE file. Treat as academic use; cite the paper.
license: none declared (no LICENSE in repo); academic use, cite the paper
image: ghcr.io/astewartau/qsm-ci/modip:v2
run: bash run.sh
smoke_box: 32   # PR --smoke gate fits a 32^3 central box (fast); full score.yml run is unaffected
# --smoke gate (evaluate.yml) only needs to prove the method RUNS + emits a valid χ map, not that it
# converged — so cap the per-subject optimization to a handful of epochs there. At 32^3 that turns a
# ~3.3 h CPU run into a couple of minutes, keeping the PR check well under the evaluate time limit.
# score.yml runs WITHOUT --smoke, so it ignores this and uses the full epoch_num default (500).
smoke_params:
  epoch_num: 10
# Full scoring runs on QSM-CI's self-hosted runners: the full 500-epoch per-subject CPU optimization
# on the uncropped grids does not fit the hosted 6-h cap, so route score.yml's real run to the
# private box (more RAM / no hosted wall-clock pressure) rather than hosted-large.
runner: self-hosted
# The full CPU run normally finishes in a few hours (a recorded in-vivo score took ~2.4 h) but the
# self-hosted box is shared, so give it generous headroom past the 6-h default rather than let
# contention DNF it. Only honored on self-hosted (GitHub allows long jobs there); hosted stays 6 h.
timeout_minutes: 720
# Notes on how QSM-CI runs this method vs. its reference (shown on the submission page).
ci_notes:
- >
  Executed CPU-only. The reference optimizes per subject on a GPU, so runtime here is substantially
  longer and not comparable to GPU timings.
parameters:
- name: epoch_num
  default: 500
  description: >
    Number of per-subject optimization iterations (reference default 500). Fewer iterations run
    faster but under-fit; this is the main knob for trading runtime against quality on CPU.
- name: lr
  default: 0.0005
  description: Adam learning rate for the deep-image-prior optimization (reference default 5e-4).
- name: base
  default: 32
  description: >
    Base channel count of the DIP U-Net (reference default 32). Lower reduces memory/compute
    (the reference README suggests decreasing base and increasing iterations under memory pressure).

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: not-tunable
  note: "Swept lr on sim+invivo (GPU, 2026-08). NOT tuned: stochastic deep image prior - run-to-run xSIM variance (0.01-0.15) exceeds the lr effect and the best lr flips between identical reruns, so any tuned lr would encode noise. Left at default."
