name: Laplacian unwrapping (STI Suite)
slug: laplacian-sti
algorithm: laplacian   # pairs with laplacian-qsmrs (QSM.rs's Laplacian unwrapping; its Fft solver reproduces MRPhaseUnwrap)
source: sti
stage: field-mapping
language: MATLAB
family: direct
learning: none
engine: STI Suite 3.0 (MRPhaseUnwrap)
inputs: [phase, params]   # MRPhaseUnwrap takes the raw phase; the mask and magnitude are not used
description: >
  Laplacian phase unwrapping from STI Suite 3.0 (MRPhaseUnwrap, Schofield & Zhu's sin/cos identity
  with an FFT Poisson solve) on the raw multi-echo phase, with the echo combination STI Suite's
  QSM_GUI applies (the unwrapped echoes summed over the summed echo times), compiled from MATLAB and
  run on the license-free MATLAB Runtime.
authors:
- name: Wei Li
- name: Bing Wu
- name: Chunlei Liu
doi: 10.1016/j.neuroimage.2010.11.088
citation: Li et al., NeuroImage 2011
code_url: https://people.eecs.berkeley.edu/~chunlei.liu/software.html
license: See STI Suite license
image: ghcr.io/astewartau/qsm-ci/matlab-sti-laplacian@sha256:f27a6ddcaa60b9c59519784928da0f1be01e1756cc6623ac8fad3e8e9237fc91   # v1
run: bash run.sh
smoke_box: 32
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-30
  image: sha256:f27a6ddcaa60b9c59519784928da0f1be01e1756cc6623ac8fad3e8e9237fc91   # v1
  matlab: R2023b Update 5 (23.2.0.2459199), Image Processing Toolbox 23.2
  sources: STI Suite 3.0 Core_Functions_P
  tolerance: identical   # total field, unwrapped echoes and Laplacian, in silico and in vivo, 8 threads
  result: pass
  report: algorithms/laplacian-sti/fidelity/REPORT.md
# MRPhaseUnwrap's own default (STI Suite 3.0, probed; STI_Templates.m). See BUILD.md.
parameters:
- name: padsize
  default: 12
  description: zero padding (voxels per side) for the FFT Poisson solve
