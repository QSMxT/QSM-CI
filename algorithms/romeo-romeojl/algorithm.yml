name: ROMEO field mapping (ROMEO.jl)
slug: romeo-romeojl
algorithm: romeo
variant: romeojl  # the original Julia package; the QSM.rs port of the same method is romeo-qsmrs
source: korbinian90
stage: field-mapping
language: Julia
family: direct
learning: none
inputs: [phase, magnitude, mask, params]
engine: ROMEO.jl 1.6.0 (08776d4) + MriResearchTools.jl 3.8.0 (771eadf)
description: >
  Combined multi-echo B0 field mapping with the authors' `romeo` command line (ROMEO.jl 08776d4,
  `ROMEO.unwrapping_main`, with MriResearchTools.jl 771eadf): MCPC-3D-S phase-offset correction,
  ROMEO unwrapping inside the contract mask, and the phase-SNR weighted B0 (`--compute-B0`),
  converted from Hz to ppm.
citation: Dymerska et al., Magn Reson Med 2021
authors:
- name: Barbara Dymerska
- name: Korbinian Eckstein
- name: Beata Bachrata
- name: Bernard Siow
- name: Siegfried Trattnig
- name: Karin Shmueli
- name: Simon Daniel Robinson
doi: 10.1002/mrm.28563
code_url: https://github.com/korbinian90/ROMEO.jl
license: MIT
image: ghcr.io/astewartau/qsm-ci/julia-qsm@sha256:b3c048acd8a88f23b7a04378f2b85dbac433bcc78b3d9cdf8ce58eb8a7478185   # v1
run: bash run.sh
# The original, kept as the reference of the QSM.rs port's parity pair (parity/thresholds.yml,
# docs/parity.md): never scored, never on the site; the PR smoke gate still runs it.
parity_only: true
# The original in its own pinned environment (QSMxT/QSM-CI#299): versions pinned (Manifest),
# output deterministic at the fixed thread count, and the same outside the container with the
# same Manifest. algorithms/_julia/fidelity/README.md; rerun whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:b3c048acd8a88f23b7a04378f2b85dbac433bcc78b3d9cdf8ce58eb8a7478185
  julia: 1.10.11 (Manifest algorithms/_julia/env/Manifest.toml)
  packages: ROMEO.jl 08776d4 (1.6.0), MriResearchTools.jl 771eadf (3.8.0)
  threads: 4 Julia, 4 FFTW, 1 BLAS   # run.sh / qsmci_io.jl
  host: Intel Core i5-11500 (rocketlake, AVX-512), podman; host Julia 1.10.11 without the sysimage
  tolerance: identical   # image twice, and image vs host Julia with the same Manifest, in vivo
  result: pass
  report: algorithms/_julia/fidelity/REPORT.md
parameters:
- name: weights
  default: romeo
  description: "ROMEO weights (`-w`): romeo | romeo2 | romeo3 | romeo4 | romeo6 | bestpath. The command line turns `romeo` into romeo3 (no phase-linearity weight) when a magnitude is given"
- name: individual_unwrapping
  default: false
  description: unwrap each echo on its own (`-i`) instead of temporally from the template echo
- name: correct_global
  default: false
  description: remove each echo's global n·2π offset (`-g`)
- name: template
  default: 1
  description: template echo for temporal unwrapping (`--template`)
- name: temporal_uncertain_unwrapping
  default: 0
  description: quality threshold for spatially unwrapping uncertain voxels in temporal mode (EXPERIMENTAL in the CLI)
- name: phase_offset_correction
  default: on
  description: "MCPC-3D-S: on (monopolar; the CLI's default with -B) | bipolar | off"
- name: phase_offset_sigma_mm
  default: 7
  description: MCPC-3D-S smoothing sigma, mm (one value or three)
- name: b0_weighting
  default: phase_snr
  description: "B0 echo weighting (`--B0-phase-weighting`): phase_snr | phase_var | average | TEs | mag | simulated_mag"
- name: max_seeds
  default: 1
  description: maximum seeds (`-s`, EXPERIMENTAL in the CLI)
