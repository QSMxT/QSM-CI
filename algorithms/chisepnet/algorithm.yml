name: χ-sepnet (χ-separation toolbox)
slug: chisepnet
algorithm: chisepnet
source: snu
stage: chi-separation
language: Python
family: deep-learning
learning: pretrained
inputs: [localfield, r2prime, mask, params]  # the artifacts this method actually reads (a subset of the stage's inputs)
engine: χ-separation toolbox
description: >
  χ-sepnet — a deep-learning χ-separation method (SNU-LIST), run by the authors' route
  (`chi_sepnet_general` of the χ-separation toolbox v1.1.3): the local field, R2′ and mask rotated
  into the training frame (B0 along z, 1 mm), the QSM channel made there by the toolbox's own
  QSMnetME, the 3D network on [QSM, local field, R2′/Dr] over the whole frame, and χ+ / χ− mapped
  back onto the acquired grid. ONNX Runtime, Dr = 114 Hz/ppm.
authors:
- name: Minjun Kim
- name: Hyeong-Geol Shin
- name: Jongho Lee
doi: 10.1016/j.neuroimage.2021.118371
citation: Shin et al., NeuroImage 2021 (χ-separation); χ-sepnet, SNU-LIST
code_url: https://github.com/SNU-LIST/chi-separation
license: academic use; toolbox obtained via the SNU-LIST Google Form
# v2 (QSM.rs#377): the toolbox's three networks + normalisation file (BUILD.md).
image: ghcr.io/astewartau/qsm-ci/chisep-toolbox@sha256:dcac7d9f05fe02ee44522feaabc839473db61257feed60648bea698911a6521d   # v1 (config d127ddf2)
run: bash run.sh
runner: highmem   # OOM (exit 137) on ubuntu-latest\'s 16 GB with ridani-3t-aniso-fitted (native finer grid), score run 41625488721
# The original, checked (QSMxT/QSM-CI#301) as v1 (the network alone, sliding window). v2 runs the
# toolbox's route, recovered from its P-code by black-box probing in licensed MATLAB R2023b and
# reproduced by chisep_route.py to 1.4e-5–2.1e-5 % NRMSE (astewartau/QSM.rs#377); the v1 record
# below needs rerunning on the v2 image.
fidelity:
  date: 2026-10-28
  image: sha256:9588a43b6f99e310ef4c16bc26a8dc59751d7527bf62a1d914dfba82c788bc88
  source: SNU-LIST chi-separation toolbox χ-sepnet (240904_xsepnet.onnx)
  weights: [240904_xsepnet.onnx 4f234364, xsepnet_train_patch_norm_factor_inplane_largedegree_romeo_arlo.mat 0a4ea04b]   # sha256 prefixes; full hashes in fidelity/dl/results/weights.sha256
  python: Python 3.10.20, ONNX Runtime 1.23.2, NumPy 2.2.6
  threads: 4   # OMP/MKL/OPENBLAS/TF_NUM_*_THREADS set by fidelity/dl/harness.py
  host: Intel Core i5-11500, podman
  tolerance: identical   # image twice, 128x160x96 box of prisma-bridge-run1
  result: pass
  report: fidelity/dl/README.md
parameters:
  - name: Dr
    default: 114.0
    description: >
      Relaxivity (Hz/ppm) used to scale R2' into the network's R2'/Dr input channel. The network was
      trained at Dr=114 (its COSMOS-referenced value), so moving it feeds off-distribution inputs — this
      is a research knob, not an accuracy-tuning target. (No patch knob: the toolbox runs the whole
      1 mm frame in one pass.)
# Produces two source maps: chi-para (χ+) and chi-dia (|χ−|). Weights (ONNX) not committed; the image
# bundles them. chisep_route.py is shared with the qsmnetme entry.
