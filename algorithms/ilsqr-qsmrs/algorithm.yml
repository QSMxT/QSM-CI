name: iLSQR (QSM.rs)
slug: ilsqr-qsmrs
algorithm: ilsqr
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Iterative LSQR inversion with streaking-artifact reduction.
citation: Li et al., NeuroImage 2015
authors:
- name: Wei Li
- name: Nian Wang
- name: Fang Yu
- name: Hui Han
- name: Wei Cao
- name: Rebecca Romero
- name: Bundhit Tantiwongkosi
- name: Timothy Q. Duong
- name: Chunlei Liu
doi: 10.1016/j.neuroimage.2014.12.043
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: tol
    default: 1e-3
    description: tolerance
  - name: max_iter
    default: 100
    description: iterations
  - name: pad_mm
    default: 12
    description: zero-padding per side (mm) before the k-space solve (STI Suite QSM_GUI's padsize; 16 in qsmxt v10)
  - name: precision
    default: double
    description: arithmetic of the two LSQR solves, double or single (the original's); needs a qsmxt with --precision

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: default-optimal
  note: "Swept max_iter (truncated-LSQR early stop) on sim+invivo (2026-08); default already optimal. Left at default."
