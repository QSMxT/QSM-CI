name: iLSQR (QSM.rs)
algorithm: ilsqr
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Iterative LSQR inversion with streaking-artifact reduction.
citation: Li et al., NeuroImage 2015
authors:
- name: Wei Li
- name: Nian Wang
- name: Fang Yu
- name: Hui Han
- name: Wei Cao
- name: Rebecca Romero
- name: Bundhit Tantiwongkosi
- name: Timothy Q. Duong
- name: Chunlei Liu
doi: 10.1016/j.neuroimage.2014.12.043
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.8.0
run: bash run.sh
parameters:
  - name: tol
    default: 1e-4
    description: tolerance
  - name: max_iter
    default: 1000
    description: iterations

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: default-optimal
  note: "Swept max_iter (truncated-LSQR early stop) on sim+invivo (2026-08); default already optimal. Left at default."
