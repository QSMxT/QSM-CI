name: TFI (QSM.rs)
slug: tfi-qsmrs
algorithm: tfi
source: qsmrs
stage: bfr+dipole
language: Rust
family: iterative
learning: none
optional_inputs: [magnitude]  # run.sh guards `-f magnitude.nii.gz`; runs without the SNR weight when absent
engine: QSMxT / QSM.rs
description: >
  Preconditioned Total Field Inversion: a single-step method that inverts the total field directly
  to susceptibility over the whole field-of-view, jointly performing background-field removal and
  dipole inversion. Uses a preconditioner (χ = P·y, larger outside the brain) so the large
  out-of-brain background susceptibility is well-conditioned, with MEDI-style L1 morphology
  regularization.
authors:
- name: Zhe Liu
- name: Youngwook Kee
- name: Dong Zhou
- name: Yi Wang
- name: Pascal Spincemaille
doi: 10.1002/mrm.26946
citation: Liu et al., Magn Reson Med 2017;78(1):303-315
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
- name: lambda
  default: 7.5e-5
  tuned:
    sim: 1e-5
  description: data-fidelity weight (matches MEDI's default; larger = closer data fit, less regularization)
- name: precond
  default: 30
  description: preconditioner — susceptibility scaling outside the brain mask (Liu 2017 uses ~30 for in-vivo air)
- name: merit
  default: true
  description: model-error reduction (MERIT), qsmxt after v10.0.0
- name: linear
  default: true
  description: the paper's linear data term (false, MEDI_L1's exponential one), qsmxt after v10.0.0
- name: data_weighting
  default: 1
  description: 1 weights the data by the field noise from the echo magnitudes, 0 uniform
- name: percentage
  default: 0.9
  description: fraction of voxels kept as edges in the gradient mask
- name: cg_tol
  default: 0.01
  description: conjugate-gradient relative residual tolerance
- name: cg_max_iter
  default: 100
  description: maximum conjugate-gradient iterations per Gauss-Newton step
- name: max_iter
  default: 10
  description: maximum Gauss-Newton iterations
- name: tol
  default: 0.1
  description: Gauss-Newton stop on the relative update

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: tuned
  note: "Swept lambda on sim (span; sim-only). Tuned sim: 1e-5."
