name: R2PRIMEnet (χ-separation toolbox)
slug: r2primenet
algorithm: r2primenet
source: snu
stage: r2prime-generation
language: Python
family: deep-learning
learning: pretrained
engine: χ-separation toolbox
inputs: [magnitude, mask, params]
description: >
  R2PRIMEnet — the R2*→R2′ conversion network from the χ-sepnet pipeline (SNU-LIST). When no
  spin-echo acquisition provides a measured R2 (the GRE-only condition), it synthesizes R2′ from
  the GRE-derived R2* map: R2* is fit from the multi-echo magnitude with ARLO, as the toolbox's
  r2star_arlo does (MEDI's arlo.m), and a 3D U-Net (trained on
  paired R2*/R2′ data at 3T, 1 mm) predicts the reversible component. Run here via ONNX
  (onnxruntime), 192×192×128 sliding-window patches, Dr = 114 Hz/ppm. Composed with the χ-sepnet
  submission this reproduces the paper's χ-sepnet-R2* variant; composed with the other
  R2′-consuming methods it measures how far a learned R2′ substitute carries each of them.
authors:
- name: Minjun Kim
- name: Sooyeon Ji
- name: Jongho Lee
doi: 10.1002/hbm.70136
citation: >
  Kim M. et al., "χ-sepnet: Deep neural network for magnetic susceptibility source separation",
  Human Brain Mapping 2025 (doi:10.1002/hbm.70136) — R2PRIMEnet is its R2*→R2′ conversion network.
code_url: https://github.com/SNU-LIST/chi_sepnet
license: academic use; toolbox obtained via the SNU-LIST Google Form
image: ghcr.io/astewartau/qsm-ci/r2primenet@sha256:21a051bec5387524e262a1015b84f0d74de2404eec747bae2460617a6f7b2bea   # v1
run: bash run.sh
# The original, checked (QSMxT/QSM-CI#301): pinned versions and weights, and the same output
# twice at fixed threads. fidelity/dl/README.md; rerun whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:21a051bec5387524e262a1015b84f0d74de2404eec747bae2460617a6f7b2bea
  source: SNU-LIST R2PRIMEnet (240531_R2PRIMEnet.onnx)
  weights: [240531_R2PRIMEnet.onnx 0c5b4825, xsepnet_train_patch_norm_factor_inplane_largedegree_romeo_arlo.mat 0a4ea04b]   # sha256 prefixes; full hashes in fidelity/dl/results/weights.sha256
  python: Python 3.12.14, ONNX Runtime 1.29.0, NumPy 2.5.2
  threads: 4   # OMP/MKL/OPENBLAS/TF_NUM_*_THREADS set by fidelity/dl/harness.py
  host: Intel Core i5-11500, podman
  tolerance: identical   # image twice, 128x160x96 box of prisma-bridge-run1
  result: pass
  report: fidelity/dl/README.md
  # R2*: recon.py's fit_r2star replaced a log-linear "ARLO stand-in" (60 % NRMSE from ARLO in vivo)
  # on 2026-11-02. The toolbox's r2star_arlo.p (v1.1.3), run as a black box in licensed MATLAB
  # R2023b, is MEDI's arlo.m with TE in ms, 0 outside the mask, negatives kept; fit_r2star equals
  # it bit for bit (max |Δ| 0) on cases invivo-chisep (184x256x128, 5 echoes) and chisep-mc
  # (164x205x205, 8 echoes). The image is unchanged: recon.py runs from the mounted folder.
  r2star: { date: 2026-11-02, reference: "toolbox v1.1.3 r2star_arlo.p, MATLAB R2023b", tolerance: identical, result: pass }
parameters:
  - name: Dr
    default: 114.0
    description: >
      Relaxivity (Hz/ppm) used to scale R2* into the network's input channel and R2′ back out. The
      network family was trained at Dr=114 (its COSMOS-referenced value), so moving it feeds
      off-distribution inputs — a research knob, not an accuracy-tuning target. (No patch/overlap
      knob: the ONNX graph fixes the 192×192×128 input, and the weights fix everything else.)
# Produces r2prime.nii.gz. Weights (ONNX + norm .mat) not committed; the image bundles them — see
# BUILD.md. Shares the SNU toolbox model dir with the chisepnet submission ($XSEPNET_MODELS).
