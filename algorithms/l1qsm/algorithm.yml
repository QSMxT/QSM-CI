name: L1-QSM (FANSI toolbox)
slug: l1qsm
algorithm: l1qsm
source: fansi   # the authors' FANSI toolbox; pairs with l1qsm-qsmrs (QSM.rs's port) in the parity workflow
stage: dipole
language: MATLAB
family: iterative
learning: none
engine: FANSI toolbox 93044a3 (nlL1TV.m)
inputs: [localfield, mask, params, magnitude]
description: >
  L1-QSM: nonlinear L1-norm data fidelity with TV regularization, robust to phase inconsistencies,
  the authors' nlL1TV.m from the FANSI toolbox (commit 93044a3), compiled from MATLAB and run on
  the license-free MATLAB Runtime.
citation: Milovic et al., Magn Reson Med 2022
authors:
- name: Carlos Milovic
- name: Mathias Lambert
- name: Christian Langkammer
- name: Kristian Bredies
- name: Pablo Irarrazaval
- name: Cristian Tejos
doi: 10.1002/mrm.28957
code_url: https://gitlab.com/cmilovic/FANSI-toolbox
license: "No license file; author toolbox distribution"
image: ghcr.io/astewartau/qsm-ci/l1-qsm@sha256:edb8c46ae324f34ce337eea4f7179f8d73267f5c21f1517a9041e28c449b2177   # v2
run: bash run.sh
smoke_box: 32
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-30
  image: sha256:edb8c46ae324f34ce337eea4f7179f8d73267f5c21f1517a9041e28c449b2177   # v2
  matlab: R2023b Update 5 (23.2.0.2459199)
  sources: FANSI-toolbox 93044a3
  tolerance: identical   # chi and every intermediate, in silico and in vivo, 8 threads
  result: pass
  report: algorithms/l1qsm/fidelity/REPORT.md
# nlL1TV.m's own defaults where it has them; the field is scaled to radians at the first echo time, as QSM.rs's
# port does by default. See BUILD.md and recon.m.
parameters:
- name: alpha1
  default: 0.005
  # Our tuning, not the authors': FANSI 93044a3 ships no L1-QSM value (its only nlL1TV call,
  # script_DICOM_Philips.m:450, reuses a data-driven wTV alpha) and says L1-QSM needs its own
  # tuning (L442-443). 5e-3 is QSM.rs's L1QsmParams default, from an alpha1 sweep on the EMTP
  # travelling heads (Ashley, 2026-10-30).
  description: gradient L1 (TV) penalty; QSM-CI's tuning (EMTP sweep), since FANSI gives none for L1-QSM
- name: mu1
  default: 100*alpha1
  description: gradient-consistency ADMM weight
- name: mu2
  default: 1
  description: ADMM weight
- name: mu3
  default: 1
  description: L1 fidelity ADMM weight
- name: lambda
  default: 0.8
  description: scale of the data weight (<1 rejects more inconsistent voxels)
- name: max_iter
  default: 50
  description: maximum ADMM iterations
- name: tol_update
  default: 1
  description: stop when the relative update (%) falls below this
- name: tol_delta
  default: 1e-06
  description: Newton tolerance of the nonlinear data step
