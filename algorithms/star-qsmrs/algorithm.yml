name: STAR-QSM (QSM.rs)
slug: star-qsmrs
algorithm: star
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  STAR-QSM (streaking artifact reduction) dipole inversion, the QSM.rs port of STI Suite's
  QSM_star. Its pair is star-sti, the original.
citation: Wei et al., NMR Biomed 2015
authors:
- name: Hongjiang Wei and Chunlei Liu
  affiliation: UC Berkeley
doi: 10.1002/nbm.3383
code_url: https://github.com/astewartau/QSM.rs
license: MIT
# `qsmxt invert star` is in QSMxT from v11.0.0 (QSMxT/QSMxT#429).
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: te
    default: sum
    description: >
      echo time the field is converted to phase at (STAR-QSM's result depends on the phase scale):
      first, last, spacing (TE2 - TE1), sum (of the echo times), or a time in ms
  - name: pad
    default: 8 8 20
    description: >
      zero padding per side in voxels, x y z, or one number for every axis (STI Suite's
      'padsize'; the default is what STI Suite's GUI passes, star-sti's recon.m passes 12 12 12)
