name: PDF (QSM.rs)
slug: pdf-qsmrs
algorithm: pdf
source: qsmrs
stage: bfr
inputs: [totalfield, mask, params, magnitude]  # run.sh passes --magnitude (PDF's noise weight) to a qsmxt that has it
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Projection onto Dipole Fields: models the background field as external dipoles.
citation: Liu et al., NMR Biomed 2011
authors:
- name: Tian Liu
- name: Ildar Khalidov
- name: Ludovic de Rochefort
- name: Pascal Spincemaille
- name: Jing Liu
- name: A. John Tsiouris
- name: Yi Wang
doi: 10.1002/nbm.1670
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
parameters:
  - name: tol
    default: 1e-5
    description: convergence tolerance
  - name: n_cg
    default: 30
    description: maximum conjugate-gradient iterations (PDF.m's n_CG; qsmxt after v10.0.0)
  - name: space
    default: image
    description: dipole kernel for an oblique B0, image or kspace (PDF.m's 'imagespace'/'kspace'; qsmxt after v10.0.0)
  - name: n_pad
    default: 40
    description: zero padding around the mask's bounding box, voxels (PDF.m's n_pad; qsmxt after v10.0.0)
  - name: erode_voxels
    default: 0
    description: "erode the brain mask by this many voxels (6-connected) before background removal, as qsmxt run --bf-erode-voxels; the field is left whole (uses qsmxt mask erode, also in v11.0.0)"
