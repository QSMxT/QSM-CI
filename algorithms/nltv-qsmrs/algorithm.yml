name: NLTV (QSM.rs)
slug: nltv-qsmrs
algorithm: nltv
source: qsmrs
stage: dipole
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude (the data weight) to a qsmxt that has it
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Nonlocal Total Variation regularized inversion.
citation: Kames et al., NeuroImage 2018
authors:
- name: Christian Kames
- name: Vanessa Wiggermann
- name: Alexander Rauscher
doi: 10.1016/j.neuroimage.2017.11.018
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
parameters:
  - name: lambda
    default: 1e-3
    description: regularization
  - name: max_iter
    default: 250
    description: iterations

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: NLTV: QSM.jl's nonlinear data term in radians (QSM.rs#230), QSM.jl's FFT padding and half-spectrum kernel (#334/#335). Tuned values removed 2026-11-10; re-sweep. Was: Swept lambda on sim+invivo (2026-08). Tuned both: 3e-3 (in-vivo xSIM low in absolute terms)."
