name: FANSI-nlTV (QSM.rs)
slug: fansi-nltv-qsmrs
algorithm: fansi
variant: nltv
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Fast Nonlinear Susceptibility Inversion with nonlinear total-variation regularization, solved with ADMM.
citation: Milovic et al., Magn Reson Med 2018
doi: 10.1002/mrm.27073
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.9.0
run: bash run.sh
parameters:
  - name: alpha1
    default: 2e-4
    tuned:
      sim: 3e-5
      invivo: 4e-4
    description: gradient L1 (TV) penalty
  - name: mu1
    default: 2e-2
    description: gradient-consistency ADMM weight
  - name: max_iter
    default: 150
    description: iterations
  - name: tol_update
    default: 0.1
    description: convergence threshold on the solution update (percent)

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: tuned
  note: "Swept alpha1 on sim+invivo (2026-08). Tuned both: sim 3e-5, invivo 4e-4."
