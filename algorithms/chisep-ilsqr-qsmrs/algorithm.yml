name: χ-separation (iLSQR, QSM.rs)
slug: chisep-ilsqr-qsmrs
algorithm: chisep
variant: ilsqr
source: qsmrs
stage: chi-separation
language: Rust
family: iterative
learning: none
inputs: [localfield, r2prime, chimap, mask, params]  # chimap only with qsm=chimap
engine: QSMxT / QSM.rs
description: >
  χ-separation (iLSQR variant) as the Rust port in QSM.rs of the SNU χ-separation toolbox's
  chi_sep_iLSQR, run by `qsmxt separate chi-sep-ilsqr`: an iLSQR-style solve for χ+ and |χ−|
  (LSQR, streaking removal, NNLS) from the local field and R2′, started from a QSM. As the
  `chisep-ilsqr` entry and the toolbox's script, the QSM is made with iLSQR from the local field
  (`qsmxt invert ilsqr`, QSM.rs's port of STI Suite's QSM_iLSQR).
authors:
- name: Hyeong-Geol Shin
  note: original χ-separation method and toolbox
- name: Jingu Lee
- name: Jongho Lee
- name: Ashley Stewart
  note: QSM.rs / QSMxT Rust port
doi: 10.1016/j.neuroimage.2021.118371
citation: Shin et al., NeuroImage 2021
code_url: https://github.com/astewartau/QSM.rs
license: MIT
# v10.0.0 runs the earlier paper-based port; the toolbox port (astewartau/QSM.rs#337) is in QSMxT
# main but in no release yet. Repin to the first release that has it, then drop ci_skip.
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
ci_skip: true   # until the image has the toolbox port (see image:)
parameters:
- name: qsm
  default: ilsqr
  description: >
    the QSM chi_sep_iLSQR starts from: ilsqr, made from the local field with iLSQR, as chisep-ilsqr;
    chimap, the given χ_total (the parity pair feeds chisep-ilsqr's own QSM this way)
- name: pad_mm
  default: 12
  description: zero padding of that iLSQR, mm (chisep-ilsqr pads 12 voxels; the same on 1 mm data)
- name: gamma
  default: 42.576
  description: >
    γ in MHz/T, so the central frequency is γ·B0 (R2′'s ppm scale and the default
    D_r = 137·B0/2.9). 42.576 is qsmxt's; the chisep-ilsqr wrapper uses 42.5774, which the parity
    pair sets.
ci_notes:
- >
  Same algorithm and inputs as the compiled-MATLAB entry chisep-ilsqr, in Rust, on the shared
  QSMxT engine image.
