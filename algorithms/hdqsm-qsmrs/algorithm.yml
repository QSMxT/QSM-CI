name: HD-QSM
slug: hdqsm-qsmrs
algorithm: hdqsm
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Hybrid data-fidelity QSM: a two-stage linear inversion where an L1 stage produces a discrepancy map that reweights a second L2 stage.
citation: Lambert et al., Magn Reson Med 2022
doi: 10.1002/mrm.29218
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.9.0
run: bash run.sh
parameters:
  - name: alpha_l2
    default: 1e-4
    tuned:
      sim: 1e-5
      invivo: 3e-4
    description: L2-stage TV weight
  - name: mu1_l2
    default: 1e-2
    description: L2-stage gradient-consistency weight
  - name: max_iter_l1
    default: 20
    description: stage-1 (L1) iterations
  - name: max_iter_l2
    default: 80
    description: stage-2 (L2) iterations

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: tuned
  note: "Swept alpha_l2 on sim+invivo (2026-08). Tuned both: sim 1e-5, invivo 3e-4."
