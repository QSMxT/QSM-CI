name: iQSM+ (QSM.rs)
slug: iqsm-plus-qsmrs
algorithm: iqsm-plus
source: qsmrs
stage: end-to-end
language: Rust
family: deep-learning
learning: pretrained
inputs: [phase, magnitude, mask, params]
engine: QSMxT / QSM.rs
description: >
  iQSM+ as QSM.rs runs it: the authors' trained weights exported to ONNX and run by `qsmxt invert
  iqsm-plus` (QSM.rs's ONNX engine, CPU), from every echo's wrapped phase and the B0 direction, each
  echo through the network, combined with (magnitude × TE)² weights as both of the authors' versions
  do. The QSM.rs port of the `iqsm-plus` entry, which runs the authors' own code and weights.
authors:
- name: Gao Y.
- name: Xiong Z.
- name: Shan S.
- name: Liu Y.
- name: Rong P.
- name: Li M.
- name: Wilman A.H.
- name: Pike G.B.
- name: Liu F.
- name: Sun H.
- name: Ashley Stewart
  note: QSM.rs / QSMxT ONNX port
doi: 10.1016/j.media.2024.103160
citation: Gao et al., Med Image Anal 2024
code_url: https://github.com/astewartau/QSM.rs
license: 'MIT (QSM.rs); the weights keep the original''s terms: Used with author permission (no license file in the upstream repository)'
# The weights are QSM.rs's ONNX exports (qsmxt/qsm-onnx-weights), baked into the image with
# algorithms/_qsmxt/models.Dockerfile, since a submission runs with no network.
# `qsmxt invert iqsm-plus` is in QSMxT main (QSMxT/QSMxT#460) but in no release yet: v10.0.0 lacks it.
# Repin to the first release that has it, then drop ci_skip. The parity workflow runs it with qsmxt
# built from source.
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:3fd27500c18778edc21fd771828573e01c353e4c6147124977293e51256a9053   # v10.0.0-models-2
run: bash run.sh
ci_skip: true   # until the image has `qsmxt invert iqsm-plus` (see image:)
