name: V-SHARP (STI Suite)
slug: vsharp-sti
algorithm: vsharp
source: sti
stage: bfr
language: MATLAB
family: iterative
learning: none
engine: STI Suite
description: V-SHARP background field removal from STI Suite v3 (spatially-varying SMV deconvolution),
  compiled from MATLAB and run on the license-free MATLAB Runtime. Takes the total field and removes
  the background field to yield the local tissue field.
authors:
- name: Bing Wu
- name: Wei Li
- name: Arnaud Guidon
- name: Chunlei Liu
doi: 10.1002/mrm.23000
citation: Wu et al., Magn Reson Med 2012
code_url: https://people.eecs.berkeley.edu/~chunlei.liu/software.html
license: See STI Suite license
image: ghcr.io/astewartau/qsm-ci/matlab-sti-vsharp@sha256:715c565758a5a64c6df8e73d34a0a62bf7afeb5d6d7feae5f748322cba2504d6   # v2
run: bash run.sh
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:715c565758a5a64c6df8e73d34a0a62bf7afeb5d6d7feae5f748322cba2504d6
  matlab: R2023b Update 5 (23.2.0.2459199), Image Processing Toolbox 23.2
  tolerance: identical   # local field, V-SHARP mask and unmasked output, in silico and in vivo, 8 threads
  result: pass
  report: algorithms/vsharp-sti/fidelity/REPORT.md
params:
- name: smvsize
  default: 12
  description: maximum spherical-mean-value kernel size (voxels) for the SMV deconvolution
