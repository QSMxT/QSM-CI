name: iSMV (QSM.rs)
slug: ismv-qsmrs
algorithm: ismv
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Iterative Spherical Mean Value background field removal.
citation: Wen et al., Magn Reson Med 2014
authors:
- name: Yan Wen
- name: Dong Zhou
- name: Tian Liu
- name: Pascal Spincemaille
- name: Yi Wang
doi: 10.1002/mrm.24998
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:d9e80a9b39c8e5a5d68fcb94fc7a894534ee16e9ec5180013e6420462bfa4f72   # interim-625b9f3: PRE-RELEASE build of QSMxT main 625b9f3 (v11 re-runs only)
run: bash run.sh
parameters:
  - name: variant
    default: wen2014
    description: "implementation: wen2014 (the authors' iSMV.m) or qsmjl (QSM.jl's ismv); a qsmxt after v10.0.0 (v10.0.0 has only QSM.jl-style iSMV and no --variant)"
  - name: tol
    default: 1e-6
    description: tolerance
  - name: max_iter
    default: 50
    description: iterations
  - name: radius
    default: 5.0
    description: SMV kernel radius (mm)

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: pending
  note: "Not tuned. The 2026-08 radius sweep never ran a non-default point: run.sh passed --radius-factor, which qsmxt bgremove ismv never accepted, so every override DNF'd and the default was kept by elimination. Needs a radius sweep."
