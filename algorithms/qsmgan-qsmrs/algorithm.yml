name: QSMGAN (QSM.rs)
slug: qsmgan-qsmrs
algorithm: qsmgan
source: qsmrs
stage: dipole
language: Rust
family: deep-learning
learning: pretrained
inputs: [localfield, mask, params]
engine: QSMxT / QSM.rs
description: >
  QSMGAN as QSM.rs runs it: the authors' trained weights exported to ONNX and run by `qsmxt invert
  qsmgan` (QSM.rs's ONNX engine, CPU). The QSM.rs port of the `qsmgan` entry, which runs the
  authors' own code and weights.
authors:
- name: Chen Y.
- name: Jakary A.
- name: Avadiappan S.
- name: Hess C.P.
- name: Lupo J.M.
- name: Ashley Stewart
  note: QSM.rs / QSMxT ONNX port
doi: 10.1016/j.neuroimage.2019.116389
citation: Chen et al., NeuroImage 2020
code_url: https://github.com/astewartau/QSM.rs
license: 'MIT (QSM.rs); the weights keep the original''s terms: MIT'
# The weights are QSM.rs's ONNX exports (qsmxt/qsm-onnx-weights), baked into the image with
# algorithms/_qsmxt/models.Dockerfile, since a submission runs with no network.
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:4327e61dec101830cd9620049ea216939ea9bbb235e26688d198d90481c6f7df   # v10.0.0-models
run: bash run.sh
