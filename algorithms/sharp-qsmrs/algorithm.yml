name: SHARP
slug: sharp-qsmrs
algorithm: sharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Sophisticated Harmonic Artifact Reduction for Phase data: SMV deconvolution.
citation: Schweser et al., NeuroImage 2011
authors:
- name: Ferdinand Schweser
- name: Andreas Deistung
- name: Berengar Wendel Lehr
- name: Jürgen Rainer Reichenbach
doi: 10.1016/j.neuroimage.2010.10.070
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.4.0
run: bash run.sh
parameters:
  - name: threshold
    default: 0.02
    description: deconvolution threshold
  - name: radius_factor
    default: 0.5
    description: × min voxel size

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: default-optimal
  note: "Swept threshold on sim (sim-only); sweep best equals the documented default (0.02). Left at default."
