name: QSMGAN (PyTorch)
slug: qsmgan
algorithm: qsmgan
source: lupolab
stage: dipole
language: Python
family: deep-learning
learning: pretrained
engine: Independent
inputs: [localfield, mask]  # the artifacts this method actually reads (a subset of the stage's inputs)
description: >
  QSMGAN — dipole inversion by a 3D U-Net generator refined with a WGAN-GP and an
  increased receptive field. Consumes the background-removed local field (ppm) and
  produces susceptibility. Patch-based inference: 64^3 input patches are mapped to
  48^3 receptive-field-cropped output patches (i64o48) and stitched. Runs CPU-only on
  legacy PyTorch with the published WGAN-refined generator weights.
authors:
- name: Chen Y.
- name: Jakary A.
- name: Avadiappan S.
- name: Hess C.P.
- name: Lupo J.M.
doi: 10.1016/j.neuroimage.2019.116389
citation: Chen et al., NeuroImage 2020
code_url: https://github.com/mmorri10/QSMGAN-LupoLab
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmgan@sha256:c7c83e392af271ed21e9a63062fbdc2a4ed2e46547798d81cc1e7e527700d380   # v1
run: bash run.sh
