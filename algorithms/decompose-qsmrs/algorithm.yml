name: DECOMPOSE-QSM (QSM.rs)
slug: decompose-qsmrs
algorithm: decompose
source: qsmrs
stage: chi-separation
language: Rust
family: iterative
learning: none
inputs: [chimap, magnitude, mask, params]  # signal-domain: QSM + multi-echo magnitude
# The per-echo QSM DECOMPOSE is defined on. run.sh uses it when the phantom ships it (and the image's
# qsmxt takes a 4D --qsm); otherwise χ_total (chimap) for every echo, with a note in the log.
optional_inputs: [chimap-echoes]
engine: QSMxT / QSM.rs
description: >
  DECOMPOSE-QSM (Chen et al. 2021) — signal-domain susceptibility source separation, as the Rust
  implementation in QSM.rs exposed by `qsmxt separate decompose`. It fits the multi-echo complex
  GRE signal per voxel: the data are built from the magnitude and a QSM of each echo,
  y(t) = M(t)·exp(−i·(2/3)·χ(t)·γ·B0·t) (the paper's Eq. 4), and fitted with a three-stage
  alternating bounded least-squares of {C+, C−, C0, R2*_0, χ+, χ−}, repeated n_inner times; each
  source is then reconstructed from the fitted parameters as a per-compartment phase accumulation
  (χ+ from the paramagnetic sub-model, PCS, Eq. 6; χ− from the diamagnetic one, DCS, Eq. 7). Reads
  the per-echo QSM (chimap-echoes) when the phantom provides it; without it, χ_total (chimap)
  stands in for every echo, which runs but removes the echo dependence the method separates on.
  Needs no R2' and no local field (GRE-only).
authors:
- name: Jingjia Chen
  note: original DECOMPOSE method
- name: Nan-Jie Gong
- name: Khallil Taverna Chaim
- name: Maria Concepción García Otaduy
- name: Chunlei Liu
- name: Tim Ho
  note: open MATLAB implementation the port follows
- name: Ashley Stewart
  note: QSM.rs / QSMxT Rust port
doi: 10.1016/j.neuroimage.2021.118477
citation: >
  Chen J., Gong N.-J., Chaim K.T., Otaduy M.C.G., Liu C., "Decompose quantitative susceptibility
  mapping (QSM) to sub-voxel diamagnetic and paramagnetic components based on gradient-echo MRI
  data", NeuroImage 2021;242:118477.
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
- name: n_inner
  default: 10
  description: alternating three-stage fit passes per voxel (the reference's inner-iteration count)
- name: chi_bound
  default: 0.5
  description: upper bound on |χ| in the per-voxel fit, ppm (the reference's bound)
- name: max_lm_iter
  default: 30
  description: >
    max Levenberg-Marquardt iterations per fit stage (the MATLAB reference uses lsqcurvefit's
    trust-region solve; 30 is ample for these 1-3 parameter fits)
# Notes on how QSM-CI runs this method vs. its reference (shown on the submission page).
ci_notes:
- >
  Input: the paper requires a TE-dependent QSM (one χ map per echo). The phantom's
  chimap-echoes.nii.gz is used when present and the image's qsmxt accepts a 4D --qsm; the pinned
  v10.0.0 image predates that, so until the image is bumped to a QSMxT release with per-echo
  input, run.sh falls back to χ_total for every echo and says so in the log.
- >
  Output mapping: χ+ = |PCS| (paramagnetic sub-model, Eq. 6) and χ− = −|DCS| (Eq. 7), as the
  paper defines them. The MATLAB reference demo writes DSC to the file 'XPSC' and PSC to 'XDSC';
  that filename swap is not followed here, nor (since this change) in decompose-qsm/recon.m.
- >
  Same algorithm as the compiled-MATLAB entry decompose-qsm, in Rust, on the shared QSMxT engine
  image — no new container image. Measured here at ~1.5e3 fitted voxels/s on a single core
  (12568-voxel synthetic fit, 6 echoes, n_inner=10, 14-core desktop), i.e. ~15-20 min for the
  1.31 M-voxel chisep-mc phantom and ~1 h for the 5.0 M-voxel Ridani phantoms, against the MATLAB
  entry's measured 4.1 h (chisep-mc) / 10.3 h (ridani-3t-aniso) on a 16-core box and a never-finished
  ridani-3t-iso. run.sh pins the fit to one thread: qsm-core's decompose parallel path measured
  SLOWER with more threads (1 → 8 threads: 10.9 s → 37.6 s at 12568 voxels, 37.1 s → 205.9 s at
  42168 voxels, uniform cores at a constant 3.35 GHz), with bit-identical outputs at every thread
  count, while another rayon method in the same image scales normally. That is an upstream
  performance bug, not a numerical one; when it is fixed the pin can be dropped and this gets
  faster again.
smoke_box: 32   # per-voxel fit: the PR --smoke gate fits a 32³ central box (≈30 s serial); the full score.yml run is unaffected
# Tier: the default hosted one (no `runner:` / `timeout_minutes:`), unlike the MATLAB entry's
# self-hosted/720-min/manual_phantoms routing. Serial throughput alone puts the largest scored
# phantom (ridani-3t-iso, 5.0 M mask voxels, 6 echoes) at ~1 h, ≥5x inside the 360-min hosted cap,
# and each phantom is its own focus task — so no tier override, and no manual phantom, is warranted.
