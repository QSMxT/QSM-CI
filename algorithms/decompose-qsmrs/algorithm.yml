name: DECOMPOSE-QSM (QSM.rs)
slug: decompose-qsmrs
algorithm: decompose
source: qsmrs
stage: chi-separation
language: Rust
family: iterative
learning: none
inputs: [chimap, magnitude, mask, params]  # signal-domain: provided χ_total (chimap) + multi-echo magnitude
# The QSM per echo, χ(TE), DECOMPOSE's phase input (Chen 2021 Eq. 4): mounted when the dataset ships
# it; run.sh falls back to chimap at every echo without it.
optional_inputs: [chimap-echoes]
engine: QSMxT / QSM.rs
description: >
  DECOMPOSE-QSM (Chen et al. 2021) — signal-domain susceptibility source separation, as the Rust
  implementation in QSM.rs exposed by `qsmxt separate decompose`. Unlike the R2'-based methods it
  fits the multi-echo COMPLEX GRE signal per voxel: a three-stage alternating bounded least-squares
  fit of {C+, C−, C0, R2*_0, χ+, χ−}, repeated n_inner times, then reconstructs each source from
  the fitted parameters as a per-compartment phase accumulation. Each echo's phase term comes from
  the provided per-echo χ(TE) (chimap-echoes) where the dataset ships it, else from χ_total (chimap)
  at every echo, rather than being re-derived from raw phase: this isolates DECOMPOSE's separation
  step from any upstream QSM error and drops the STI-Suite dependency. Needs no R2' and no local
  field: χ plus the multi-echo magnitude only (GRE-only).
authors:
- name: Jingjia Chen
  note: original DECOMPOSE method
- name: Nan-Jie Gong
- name: Khallil Taverna Chaim
- name: Maria Concepción García Otaduy
- name: Chunlei Liu
- name: Tim Ho
  note: open MATLAB implementation the port follows
- name: Ashley Stewart
  note: QSM.rs / QSMxT Rust port
doi: 10.1016/j.neuroimage.2021.118477
citation: >
  Chen J., Gong N.-J., Chaim K.T., Otaduy M.C.G., Liu C., "Decompose quantitative susceptibility
  mapping (QSM) to sub-voxel diamagnetic and paramagnetic components based on gradient-echo MRI
  data", NeuroImage 2021;242:118477.
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
- name: n_inner
  default: 10
  description: alternating three-stage fit passes per voxel (the reference's inner-iteration count)
- name: chi_bound
  default: 0.5
  description: upper bound on |χ| in the per-voxel fit, ppm (the reference's bound)
- name: unwrap_phase
  default: false
  description: >
    unwrap the phase along the echoes (the authors' code does not; true at B0 >= 6.5 T, as QSMxT
    suggests there). Needs a qsmxt with --unwrap-phase (not v10.0.0)
- name: max_iterations
  default: 400
  description: >
    maximum solver iterations of each fit stage (lsqcurvefit's MaxIterations, which the MATLAB
    reference leaves at 400; `--max-iterations`, QSM.rs#338). The pinned qsmxt v10.0.0 solves each
    stage by Levenberg-Marquardt instead, with at most 30 iterations by default; there the value is
    passed as its `--max-lm-iter`
# Notes on how QSM-CI runs this method vs. its reference (shown on the submission page).
ci_notes:
- >
  Both DECOMPOSE entries give the same χ+ and χ− maps. The MATLAB reference fits the conjugate of
  the signal (MATLAB's conjugate transpose on ydata), which mirrors the fit exactly, and then
  writes DSC as χ+; the Rust port fits the signal itself and writes PSC as χ+. The two swaps
  cancel (astewartau/QSM.rs#333). The authors compute a STAR-QSM per echo for each echo's phase.
  Where the dataset ships the per-echo χ(TE) (`chimap-echoes`), a qsmxt with
  `separate decompose --qsm-per-echo` gets it; otherwise the one provided χ_total is given at every
  echo, which carries no echo dependence for the fit.
- >
  Same algorithm as the compiled-MATLAB entry decompose-qsm, in Rust, on the shared QSMxT engine
  image — no new container image. Measured here at ~1.5e3 fitted voxels/s on a single core
  (12568-voxel synthetic fit, 6 echoes, n_inner=10, 14-core desktop), i.e. ~15-20 min for the
  1.31 M-voxel chisep-mc phantom and ~1 h for the 5.0 M-voxel Ridani phantoms, against the MATLAB
  entry's measured 4.1 h (chisep-mc) / 10.3 h (ridani-3t-aniso) on a 16-core box and a never-finished
  ridani-3t-iso. The fit uses every core: an old pin to one thread (qsm-core's loop once got
  slower with threads, fixed by QSM.rs#93) has been dropped.
smoke_box: 32   # per-voxel fit: the PR --smoke gate fits a 32³ central box (≈30 s on one core); the full score.yml run is unaffected
# Tier: the default hosted one (no `runner:` / `timeout_minutes:`), unlike the MATLAB entry's
# self-hosted/720-min/manual_phantoms routing. Serial throughput alone puts the largest scored
# phantom (ridani-3t-iso, 5.0 M mask voxels, 6 echoes) at ~1 h, ≥5x inside the 360-min hosted cap,
# and each phantom is its own focus task — so no tier override, and no manual phantom, is warranted.
