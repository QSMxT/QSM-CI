name: LBV (QSM.rs)
slug: lbv-qsmrs
algorithm: lbv
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Laplacian Boundary Value: solves the Laplacian of the field with boundary conditions.
citation: Zhou et al., NMR Biomed 2014
authors:
- name: Dong Zhou
- name: Tian Liu
- name: Pascal Spincemaille
- name: Yi Wang
doi: 10.1002/nbm.3064
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
  - name: tol
    default: 0.01
    description: stopping tolerance of the coarsest-grid relaxation, absolute, in radians over the echo spacing (LBV.m's tol; qsmxt v10.0.0's SOR took a relative 1e-6)
  - name: depth
    default: -1
    description: coarsest multigrid level; -1 picks log2 of the smallest dimension minus 3 (LBV.m's depth; qsmxt after v10.0.0)
  - name: peel
    default: 0
    description: boundary layers removed beyond the one boundary layer (LBV.m's peel; qsmxt after v10.0.0)
  - name: n1
    default: 30
    description: relaxations per level before the recursive call (qsmxt after v10.0.0)
  - name: n2
    default: 100
    description: relaxations per level after the recursive call (qsmxt after v10.0.0)
  - name: n3
    default: 100
    description: relaxations on the finest grid after the full multigrid cycle (qsmxt after v10.0.0)
  - name: precision
    default: double
    description: double, or single as mexMGv6 computes (qsmxt after v10.0.0)
