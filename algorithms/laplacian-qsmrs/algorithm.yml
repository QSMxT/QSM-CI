name: Laplacian (QSM.rs)
slug: laplacian-qsmrs
algorithm: laplacian
source: qsmrs
stage: field-mapping
language: Rust
family: direct
learning: none
inputs: [phase, magnitude, mask, params]  # magnitude drives the phase-SNR weights of the B0 average
engine: QSMxT / QSM.rs
description: Multi-echo B0 field mapping by Laplacian phase unwrapping (via the QSMxT/QSM.rs engine,
  `qsmxt fieldmap laplacian`) — each echo unwrapped with a DCT Poisson solve, then combined into a
  phase-SNR-weighted B0 estimate. Alternative to ROMEO field mapping.
authors:
- name: Marvin A. Schofield
- name: Yimei Zhu
doi: 10.1364/OL.28.001194
citation: Schofield & Zhu, Optics Letters 2003
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
parameters:
  - name: solver
    default: dct
    description: Poisson solver, dct, fft (STI Suite's MRPhaseUnwrap) or mirror (QSMART)
  - name: fft_pad
    default: 64
    description: zero padding per side for the fft solver, voxels (STI Suite pads 12)
  - name: unmasked
    default: false
    description: unwrap the raw phase over the whole volume rather than masked (STI Suite, QSMART)
  - name: weighting
    default: phase-snr
    description: echo weights of the B0 average, e.g. phase-snr or tes (STI Suite weights by echo time)
  - name: b0_estimation
    default: weighted-avg
    description: how the echoes become one field, weighted-avg or qsmart-echofit (QSMART's fit, which also writes its reliability map)
