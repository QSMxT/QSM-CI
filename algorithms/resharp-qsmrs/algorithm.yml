name: RESHARP (QSM.rs)
slug: resharp-qsmrs
algorithm: resharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Regularized SHARP with Tikhonov regularization of the deconvolution.
citation: Sun & Wilman, Magn Reson Med 2014
authors:
- name: Hongfu Sun
- name: Alan H. Wilman
doi: 10.1002/mrm.24765
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: radius
    default: 3.0
    description: SMV kernel radius (mm)
  - name: tik_reg
    default: 1e-4
    description: Tikhonov regularization
  - name: tol
    default: 1e-6
    description: relative residual tolerance of the solve
  - name: max_iter
    default: 200
    description: maximum solver iterations

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: RESHARP: resharp.m's cgs solve, kernel and padding (QSM.rs#412); radius default 6 -> 3 mm (#293). Tuned values removed 2026-11-10; re-sweep. Was: Swept radius/tik_reg on sim (bfr; sim-only). Tuned sim: radius 12, tik_reg 1e-4."
