name: RESHARP (QSM.rs)
slug: resharp-qsmrs
algorithm: resharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Regularized SHARP with Tikhonov regularization of the deconvolution.
citation: Sun & Wilman, Magn Reson Med 2014
authors:
- name: Hongfu Sun
- name: Alan H. Wilman
doi: 10.1002/mrm.24765
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
  - name: radius
    default: 6.0
    tuned:
      sim: 12.0
    description: SMV kernel radius (mm)
  - name: tik_reg
    default: 1e-4
    tuned:
      sim: 1e-4
    description: Tikhonov regularization
  - name: tol
    default: 1e-6
    description: relative residual tolerance of the solve
  - name: max_iter
    default: 200
    description: maximum solver iterations

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: tuned
  note: "Swept radius/tik_reg on sim (bfr; sim-only). Tuned sim: radius 12, tik_reg 1e-4."
