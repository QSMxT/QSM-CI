name: L1-QSM (QSM.rs)
slug: l1qsm-qsmrs
algorithm: l1qsm
source: qsmrs
stage: dipole
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude (the data weight) to a qsmxt that has it
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  L1-norm data-fidelity QSM (PI-QSM): an L1 fidelity term with TV regularization, robust to phase inconsistencies.
citation: Milovic et al., Magn Reson Med 2022
authors:
- name: Carlos Milovic
- name: Mathias Lambert
- name: Christian Langkammer
- name: Kristian Bredies
- name: Pablo Irarrazaval
- name: Cristian Tejos
doi: 10.1002/mrm.28957
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
parameters:
  - name: alpha1
    default: 5e-3
    description: gradient L1 (TV) penalty
  - name: mu1
    default: 2e-2
    description: gradient-consistency ADMM weight
  - name: lambda
    default: 0.8
    description: L1 fidelity strength (<1 rejects more inconsistent voxels)
  - name: max_iter
    default: 50
    description: iterations
  - name: tol_update
    default: 1.0
    description: convergence threshold on the solution update (percent)

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: L1-QSM: radians inside, magnitude weight (QSM.rs#237), nlL1TV.m's defaults (#293), FANSI's discrete kernel (#414); alpha1 default 2e-4 -> 5e-3, lambda 1.0 -> 0.8. Tuned values removed 2026-11-10; re-sweep. Was: Swept alpha1 on sim+invivo (2026-08, 3 rounds). Tuned both: sim 8e-4, invivo 0.02 (+0.31)."
