name: DECOMPOSE-QSM (MATLAB)
slug: decompose-qsm
algorithm: decompose-qsm
source: wahoo
stage: chi-separation
language: MATLAB
family: iterative
learning: none
inputs: [magnitude, chimap, mask, params]  # signal-domain: multi-echo magnitude + provided χ_total (chimap)
engine: Independent
description: >
  DECOMPOSE-QSM — a signal-domain susceptibility source separation. Unlike the R2'-based methods it
  fits the multi-echo COMPLEX GRE signal per voxel with a 3-stage alternating non-linear least-squares
  fit (lsqcurvefit) to split χ into paramagnetic (χ+, iron) and diamagnetic (χ−, myelin/calcium)
  sources. Uses the provided χ_total (chimap) for the signal's phase term (χ is echo-independent), which
  isolates DECOMPOSE's separation step from any upstream QSM error. Tim Ho's open MATLAB
  re-implementation of DECOMPOSE.
authors:
- name: Jingjia Chen
  note: original DECOMPOSE method
- name: Nan-Jie Gong
- name: Khallil Taverna Chaim
- name: Maria Concepción García Otaduy
- name: Chunlei Liu
- name: Tim Ho
  note: open MATLAB implementation
doi: 10.1016/j.neuroimage.2021.118477
citation: >
  Chen J., Gong N.-J., Chaim K.T., Otaduy M.C.G., Liu C., "Decompose quantitative susceptibility
  mapping (QSM) to sub-voxel diamagnetic and paramagnetic components based on gradient-echo MRI
  data", NeuroImage 2021;242:118477.
code_url: https://github.com/timwahoo/DECOMPOSE-QSM
license: GPL-3.0
image: ghcr.io/astewartau/qsm-ci/decompose-qsm:v2
run: bash run.sh
# SUPERSEDED by `decompose-qsmrs`, the QSM.rs/QSMxT Rust port of this same method. Scored head to
# head on chisep-mc the two agree closely — χ+ corr 0.444 vs 0.453, χ+ xSIM 0.254 vs 0.265, χ− corr
# 0.708 vs 0.714, χ− xSIM 0.367 vs 0.376 — with the port marginally ahead on every metric and 11x
# faster (18 min vs 200 min). The port also SCORES the phantoms this entry cannot: it finished all
# three Ridani sets (55-89 min each), including the isotropic one this entry has never completed
# (0 of 10 attempts inside its 12 h cap), while this entry DNF'd both anisotropic sets in run
# 34835679530. Running it costs hours of a shared self-hosted runner to reproduce a result the port
# already gives. Two flags retire it without losing its history (same pattern as the MATLAB amp-pe):
#   ci_skip: true  — the scorer never RUNS it again.
#   hidden:  true  — the web DROPS its stored rows from the leaderboard/viewer (they stay in
#                    index.json, so clearing this flag revives them). See web/js/app.js loadRuns.
# The comparison above is one phantom: chisep-mc is the only set on which BOTH have ever scored.
ci_skip: true
hidden: true
runner: self-hosted   # per-voxel non-linear fit (parfor); ~31 min on 48 cores — needs a many-core runner + long cap
timeout_minutes: 720  # full runs have taken 114–342 min on the shared self-hosted box and hit the 360 default; give ample headroom (cf. modip)
# The 5M-voxel isotropic Ridani phantom never finished inside 12 h on the shared 16-core box (0 of 10
# automatic attempts to 2026-09-10) and each attempt held a runner for the whole cap, so that phantom
# is scored only on an explicit dispatch (scope=decompose-qsm or include_manual=true). The two
# anisotropic Ridani phantoms (482 / 621 min under contention) and chisep-mc stay automatic.
manual_phantoms: [ridani-3t-iso]
smoke_box: 24         # per-voxel fit is slow: the PR --smoke gate fits only a 24³ central box (full score.yml run is unaffected)
matlab:
  entry: recon.m
  runtime: r2023b
# Feasibility CONFIRMED on Bunya: full-brain fit ~31 min on 48 cores (job 26707883). Uses the provided
# χ_total (chimap) for the signal phase — no STI Suite / phase input needed (chi-separation stage already
# consumes magnitude + chimap + mask + params). GPL-3.0 (redistribution OK with attribution);
# decompose_utils/ vendored. Build the mcc binary + GHCR image on Bunya (Optimization Toolbox required at
# compile) (see BUILD.md), then this scores on the canonical chisep phantom via score.yml routing.
