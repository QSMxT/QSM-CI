name: iHARPERELLA (QSM.rs)
slug: iharperella-qsmrs
algorithm: iharperella
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
inputs: [totalfield, mask]  # the artifacts this method actually reads
engine: QSMxT / QSM.rs
description: >
  Improved HARPERELLA: background field removal by directly minimising the weighted resulting
  field, on the multi-echo total field. The published method also unwraps, from one wrapped echo.
citation: Li, Wu & Liu, Proc. ISMRM 23 (2015) p. 3313 (iHARPERELLA); Li et al., NMR Biomed 2014 (HARPERELLA)
authors:
- name: Wei Li
- name: Alexandru V. Avram
- name: Bing Wu
- name: Xue Xiao
- name: Chunlei Liu
doi: 10.1002/nbm.3056
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:d9e80a9b39c8e5a5d68fcb94fc7a894534ee16e9ec5180013e6420462bfa4f72   # interim-625b9f3: PRE-RELEASE build of QSMxT main 625b9f3 (v11 re-runs only)
run: bash run.sh
parameters:
  - name: max_iter
    default: 40
    description: iterations
  - name: tol
    default: 1e-6
    description: tolerance
  - name: rim
    default: sti
    description: "boundary-rim Laplacian values set to zero: sti (STI Suite's 20 % largest, the original's) or whole (the whole rim); a qsmxt after v11.0.0"

  - name: erode_voxels
    default: 0
    description: "erode the brain mask by this many voxels (6-connected) before background removal, as qsmxt run --bf-erode-voxels; the field is left whole (uses qsmxt mask erode, also in v11.0.0)"
# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: pending
  note: "Not tuned. The 2026-08 sweep varied radius, which never reached iHARPERELLA (qsm-core ignores it; qsmxt v10 removed the flag), so every grid point was the default. No other parameter has been swept."
