name: BFRnet (QSM.rs)
slug: bfrnet-qsmrs
algorithm: bfrnet
source: qsmrs
stage: bfr
language: Rust
family: deep-learning
learning: pretrained
inputs: [totalfield, mask, params]
engine: QSMxT / QSM.rs
description: >
  BFRnet as QSM.rs runs it: the authors' trained weights exported to ONNX and run by `qsmxt bgremove
  bfrnet` (QSM.rs's ONNX engine, CPU). The QSM.rs port of the `bfrnet` entry, which runs the
  authors' own code and weights.
authors:
- name: Xuanyu Zhu, Yang Gao, Feng Liu, Stuart Crozier, Hongfu Sun
  affiliation: University of Queensland
- name: Ashley Stewart
  note: QSM.rs / QSMxT ONNX port
doi: 10.1016/j.zemedi.2022.08.001
citation: Zhu et al., Z Med Phys 2022
code_url: https://github.com/astewartau/QSM.rs
license: 'MIT (QSM.rs); the weights keep the original''s terms: Used with author permission'
# The weights are QSM.rs's ONNX exports (qsmxt/qsm-onnx-weights), baked into the image with
# algorithms/_qsmxt/models.Dockerfile, since a submission runs with no network.
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:3fd27500c18778edc21fd771828573e01c353e4c6147124977293e51256a9053   # v10.0.0-models-2
run: bash run.sh
