name: R2′ = 0.52·R2* (scaled)
slug: r2prime-scaled-qsmci
algorithm: r2prime-scaled
source: qsmci
stage: r2prime-generation
language: Python
family: direct
learning: none
engine: Independent
inputs: [magnitude, mask, params]
description: >
  The fixed-fraction R2′ generation heuristic for the GRE-only condition: R2* is fit from the
  multi-echo GRE magnitude (weighted log-linear least squares) and linearly scaled, R2′ = f·R2*
  with the literature f = 0.52 (attributed to Dimov et al.; evaluated in Ji et al., NMR Biomed 2024
  and Oliveira Assunção et al., MRM 2026, where naive fixed scaling propagates large χ-separation
  errors). This is the cheapest possible R2′ substitute when no spin-echo R2 is measured — its
  composed combos put a number on exactly how much that shortcut costs each R2′-consuming
  χ-separation method, against the same methods fed the true R2′.
authors:
- name: QSM-CI (heuristic per Dimov et al.)
doi: null
citation: >
  Ji S. et al., "Comparison between R2′-based and R2*-based χ-separation methods: A clinical
  evaluation in patients with multiple sclerosis", NMR Biomed 2024;37(9):e5167
  (doi:10.1002/nbm.5167), which evaluates the R2′ = 0.52·R2* scaling this submission implements.
code_url: https://github.com/QSMxT/QSM-CI
license: MIT
image: ghcr.io/astewartau/qsm-ci/r2prime-scaled-qsmci:v1
run: bash run.sh
parameters:
  - name: fraction
    default: 0.52
    tuned:
      chisep: 0.6
      ridani-3t-iso: 0.8
      ridani-3t-aniso: 0.9
      ridani-7t-aniso: 0.9
    description: >
      The R2′/R2* scaling fraction. 0.52 is the literature default (an in-vivo 3T brain average,
      where irreversible R2 dominates R2*); the true ratio varies by region, field strength and
      protocol, which is precisely this heuristic's failure mode. The tuned values are each
      phantom's best FIXED fraction (minimum plain NRMSE vs the true R2′ over a dense sweep) — the
      ceiling of what any global scaling can achieve there. They sit far above 0.52 on the noiseless
      Ridani phantoms (R2* = R2 + R2′ exactly, with a large R2′ share), quantifying how
      protocol-dependent the "0.52 rule" really is.
