name: NLTV (QSM.jl)
slug: nltv-qsmjl
algorithm: nltv
variant: qsmjl  # the original Julia package; the QSM.rs port of the same method is nltv-qsmrs
source: kamesy
stage: dipole
language: Julia
family: iterative
learning: none
inputs: [localfield, mask, params]
engine: QSM.jl v0.5.4 (fde4b92)
description: >
  Nonlinear-data-term total-variation dipole inversion by ADMM (Milovic et al. 2018), run as the
  original QSM.jl code (`QSM.nltv`, fde4b92), unweighted (`W` = nothing, QSM.jl's default) on the
  local field in ppm, as QSM.jl's README pipeline passes it.
citation: Milovic et al., Magn Reson Med 2018
authors:
- name: Carlos Milovic
- name: Berkin Bilgic
- name: Bo Zhao
- name: Julio Acosta-Cabronero
- name: Cristian Tejos
doi: 10.1002/mrm.27073
code_url: https://github.com/kamesy/QSM.jl
license: MIT
image: ghcr.io/astewartau/qsm-ci/julia-qsm@sha256:b3c048acd8a88f23b7a04378f2b85dbac433bcc78b3d9cdf8ce58eb8a7478185   # v1
run: bash run.sh
# The original in its own pinned environment (QSMxT/QSM-CI#299): versions pinned (Manifest),
# output deterministic at the fixed thread count, and the same outside the container with the
# same Manifest. algorithms/_julia/fidelity/README.md; rerun whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:b3c048acd8a88f23b7a04378f2b85dbac433bcc78b3d9cdf8ce58eb8a7478185
  julia: 1.10.11 (Manifest algorithms/_julia/env/Manifest.toml)
  packages: QSM.jl fde4b92 (0.5.4)
  threads: 4 Julia, 4 FFTW, 1 BLAS   # run.sh / qsmci_io.jl
  host: Intel Core i5-11500 (rocketlake, AVX-512), podman; host Julia 1.10.11 without the sysimage
  tolerance: identical   # image twice, and image vs host Julia with the same Manifest, in vivo
  result: pass
  report: algorithms/_julia/fidelity/REPORT.md
parameters:
- name: lambda
  default: 0.001
  description: TV regularization
- name: rho
  default: "100*lambda"
  description: ADMM penalty (TV split)
- name: mu
  default: 1
  description: ADMM penalty (data-term split)
- name: tol
  default: 0.001
  description: stopping tolerance
- name: max_iter
  default: 250
  description: maximum ADMM iterations (`maxit`)
- name: newton_tol
  default: 1e-06
  description: Newton stopping tolerance (`toln`)
- name: newton_iter
  default: 10
  description: maximum Newton iterations (`maxitn`)
- name: pad
  default: 0
  description: "QSM.jl `pad` (all three axes): >= 0 zero-pads to a fast FFT size (QSM.jl default 0: padding only up to that size); -1 does not pad, as QSM.rs"
