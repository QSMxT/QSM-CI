name: MEDI (QSM.rs)
slug: medi-qsmrs
algorithm: medi
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
qsmxt_args: [--no-medi-smv]   # run.sh passes --smv false; `qsmxt run` MEDI has SMV on by default
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude unconditionally
description: >
  Morphology Enabled Dipole Inversion: magnitude-guided edge regularization.
citation: Liu et al., NeuroImage 2012
authors:
- name: Jing Liu
- name: Tian Liu
- name: Ludovic de Rochefort
- name: James Ledoux
- name: Ildar Khalidov
- name: Weiwei Chen
- name: A. John Tsiouris
- name: Cynthia Wisnieff
- name: Pascal Spincemaille
- name: Martin R. Prince
- name: Yi Wang
doi: 10.1016/j.neuroimage.2011.08.082
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
# MEDI uses magnitude for its morphological (edge) weighting — the plain dipole stage doesn't take
# magnitude, so this method opts it in as an optional input (surfaced by `qsm-ci run medi-qsmrs`).
parameters:
  - name: lambda
    default: 1000
    description: data-fidelity weight, on MEDI's scale (larger = closer data fit, less regularization)

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: MEDI: MEDI_L1's own model and defaults (lambda on MEDI's scale, 1e-3 -> 1000; SMV, MERIT, CSF zero reference; QSM.rs#285/#288). Tuned values removed 2026-11-10; re-sweep. Was: Swept lambda on sim+invivo (2026-08). Tuned both: sim 3e-4, invivo 0.01 (+0.35 xSIM)."
