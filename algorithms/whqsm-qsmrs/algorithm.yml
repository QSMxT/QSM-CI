name: WH-QSM (QSM.rs)
slug: whqsm-qsmrs
algorithm: whqsm
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude for a magnitude weight
description: >
  Weak-Harmonic QSM: jointly estimates susceptibility and a residual harmonic background field, correcting imperfect background-field removal. Fixed settings as in WH_nlTV.m: mu2 1, muh (harmonic ADMM weight) 5, tolDelta 1e-6.
citation: Milovic et al., Magn Reson Med 2019
authors:
- name: Carlos Milovic
- name: Berkin Bilgic
- name: Bo Zhao
- name: Christian Langkammer
- name: Cristian Tejos
- name: Julio Acosta-Cabronero
doi: 10.1002/mrm.27483
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
parameters:
  - name: alpha1
    default: 2e-4
    description: gradient L1 (TV) penalty
  - name: mu1
    default: 2e-2
    description: gradient-consistency ADMM weight
  - name: beta
    default: 150
    description: harmonic-constraint weight
  - name: max_iter
    default: 150
    description: iterations
  - name: tol_update
    default: 0.1
    description: convergence threshold on the solution update (percent)
  - name: weight
    default: flat
    description: "data weight: flat (1 over the whole volume, WH_nlTV.m's default), flat-in-mask (1 inside the mask; qsmxt from v12.0.0), max-normalised or in-vivo (from the magnitude)"

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: WH-QSM: radians inside (QSM.rs#234), WH_nlTV.m's flat weight and FANSI's discrete kernel (#414). Tuned values removed 2026-11-10; re-sweep. Was: Swept alpha1/beta on sim+invivo (2026-08). sim tuned (alpha1 3e-5, beta 75); invivo default optimal (+0.006 negligible)."
