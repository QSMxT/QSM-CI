name: WH-QSM (QSM.rs)
slug: whqsm-qsmrs
algorithm: whqsm
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude for a magnitude weight
description: >
  Weak-Harmonic QSM: jointly estimates susceptibility and a residual harmonic background field, correcting imperfect background-field removal.
citation: Milovic et al., Magn Reson Med 2019
authors:
- name: Carlos Milovic
- name: Berkin Bilgic
- name: Bo Zhao
- name: Christian Langkammer
- name: Cristian Tejos
- name: Julio Acosta-Cabronero
doi: 10.1002/mrm.27483
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: alpha1
    default: 2e-4
    tuned:
      sim: 3e-5
    description: gradient L1 (TV) penalty
  - name: mu1
    default: 2e-2
    description: gradient-consistency ADMM weight
  - name: beta
    default: 150
    tuned:
      sim: 75
    description: harmonic-constraint weight
  - name: max_iter
    default: 300
    description: iterations
  - name: tol_update
    default: 0.1
    description: convergence threshold on the solution update (percent)
  - name: weight
    default: flat
    description: "data weight: flat (1 over the whole volume, WH_nlTV.m's default), flat-in-mask (1 inside the mask; a qsmxt after v11.0.0), max-normalised or in-vivo (from the magnitude)"

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: partial
  note: "Swept alpha1/beta on sim+invivo (2026-08). sim tuned (alpha1 3e-5, beta 75); invivo default optimal (+0.006 negligible)."
