name: NDI (QSM.rs)
slug: ndi-qsmrs
algorithm: ndi
source: qsmrs
stage: dipole
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude (the data weight) to a qsmxt that has it
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Nonlinear Dipole Inversion: gradient-descent solve of a nonlinear (wrapped-phase) data term; effectively tuning-free.
citation: Polak et al., NMR Biomed 2020
authors:
- name: Daniel Polak
- name: Itthi Chatnuntawech
- name: Jaeyeon Yoon
- name: Siddharth Srinivasan Iyer
- name: Carlos Milovic
- name: Jongho Lee
- name: Peter Bachert
- name: Elfar Adalsteinsson
- name: Kawin Setsompop
- name: Berkin Bilgic
doi: 10.1002/nbm.4271
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:d9e80a9b39c8e5a5d68fcb94fc7a894534ee16e9ec5180013e6420462bfa4f72   # interim-625b9f3: PRE-RELEASE build of QSMxT main 625b9f3 (v11 re-runs only)
run: bash run.sh
parameters:
  - name: tau
    default: 2.0
    description: gradient-descent step size
  - name: alpha
    default: 1e-5
    description: L2 regularization weight
  - name: max_iter
    default: 200
    description: iterations
  - name: weight_norm
    default: global-max
    description: "magnitude-weight normaliser: global-max (FANSI's max(mag), the original's) or mask-p999 (the brain's 99.9th percentile); a qsmxt after v11.0.0"
