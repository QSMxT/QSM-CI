name: χ-separation (MEDI)
slug: chisep-medi
algorithm: chisep
variant: medi
source: snu
stage: chi-separation
language: MATLAB
family: iterative
learning: none
engine: χ-separation toolbox
description: >
  χ-separation (MEDI variant) — separates net susceptibility into paramagnetic (χ+, iron) and
  diamagnetic (χ−, myelin/calcium) sources using the local field, a QSM/χ_total map, and an R2' map,
  with a morphology-enabled dipole (MEDI) regulariser. From the SNU-LIST chi-separation toolbox.
authors:
- name: Hyeong-Geol Shin
- name: Jingu Lee
- name: Jongho Lee
doi: 10.1016/j.neuroimage.2021.118371
citation: Shin et al., NeuroImage 2021
code_url: https://github.com/SNU-LIST/chi-separation
license: academic use; toolbox obtained via the SNU-LIST Google Form
image: ghcr.io/astewartau/qsm-ci/chi-sep-medi@sha256:06ffc17a55223b05eb1442d9092b751b64a50e0e39320602a289b5c2ca9d2615   # v2. TODO: pin v3 (empty CSF mask, #315) by digest once pushed
run: bash run.sh
runner: highmem
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:06ffc17a55223b05eb1442d9092b751b64a50e0e39320602a289b5c2ca9d2615
  matlab: R2023b Update 5 (23.2.0.2459199), Image Processing Toolbox 23.2, Signal Processing Toolbox 23.2
  tolerance: identical   # chi-para, chi-dia and every intermediate, phantom and in vivo, 8 threads
  result: pass
  report: algorithms/chisep-medi/fidelity/REPORT.md
parameters:
  - name: lambda
    default: 1
    description: >
      MEDI data-fidelity / morphology regularisation weight passed to chi_sep_MEDI (params.lambda) —
      the method's primary regularisation knob. Larger = smoother/more-regularised source maps.
      (No CSF term: the isolated-eval stage contract provides no CSF mask, so mask_CSF is empty, as
      in the toolbox GUI without one.)
# Inputs consumed (isolated eval, fed ground truth): local field + R2' + QSM + mask + magnitude.
# Produces two source maps: chi-para (χ+) and chi-dia (χ−). No CSF term (no CSF mask in the stage
# contract; mask_CSF = [] as in the toolbox GUI). Same GHCR/image caveat as the iLSQR submission — runs via `--runner local`.
