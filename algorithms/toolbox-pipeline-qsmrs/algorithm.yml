name: Toolbox pipeline (QSMxT / QSM.rs)
slug: toolbox-pipeline-qsmrs
algorithm: toolbox-pipeline
source: qsmrs
stage: pipeline
# A measured R2′ for the χ-separation pipelines, when the dataset ships one, and the dataset's brain
# mask, used only with `dataset_mask` (run.sh).
optional_inputs: [r2prime, mask]
language: Rust
family: pipeline
learning: none
engine: QSMxT / QSM.rs
description: >
  A whole original toolbox's QSM pipeline, from the raw echoes to χ, as QSMxT reproduces it with
  QSM.rs (`qsmxt run --pipeline <id>`): the candidate side of pipeline parity (QSMxT/QSM-CI#421).
  One submission covers every pipeline; the `pipeline` parameter picks it.
authors:
- name: Ashley Stewart
  note: QSMxT / QSM.rs
code_url: https://github.com/QSMxT/QSMxT
license: GPL-3.0
# QSMxT v12.0.0 (QSM.rs v0.42.0) is the first release with `qsmxt run --pipeline` (QSMxT/QSMxT#514).
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
# A parity candidate, not a method to score or list on the site: each pipeline is compared with
# the toolbox's own script, not with ground truth.
parity_only: true
parameters:
- name: pipeline
  default: qsmxt-defaults
  description: >
    the pipeline qsmxt runs: qsmxt-defaults, or a toolbox's: medi-toolbox, sti-suite-ilsqr,
    sti-suite-star, qsmart, heidi, chi-sep-ilsqr, chi-sep-medi, chi-sepnet, decompose, uk-biobank
- name: dataset_mask
  default: false
  description: >
    use the dataset's brain mask (`--use-custom-masks`) instead of the one the pipeline makes:
    for a toolbox whose own mask needs data the pipeline is not given (UK Biobank's T1 mask)
