name: HC-ChiSep (QSM-CI)
slug: hc-chisep-qsmci
algorithm: hc-chisep
source: qsmci
stage: chi-separation
language: Python
family: model-based
learning: none
inputs: [chimap, r2prime, magnitude, mask, params]  # + se_magnitude when present (soft MWF evidence); fiber_angle is read ONLY in the optional dti comparison mode
engine: Independent
description: >
  HC-ChiSep — hollow-cylinder χ-separation with signal-derived fibre orientation (no DTI, no
  segmentation). White-matter fibre-to-B0 angle θ and myelin-water fraction (MWF) are estimated
  per voxel from the multi-echo GRE magnitude's multi-compartment "beat" (myelin/axonal/
  extra-axonal pool interference, Wharton–Bowtell hollow-cylinder model), with the total
  reversible decay rate anchored to the R2' input (R2'_meso = R2'_obs − R2'_hc(θ,MWF) ≥ 0).
  WM-like voxels are found by model selection (anchored hollow-cylinder vs free mono-exponential
  fit) with a soft, χ_total-gated posterior weight. In WM, χ− follows the published
  myelin-content↔MWF anchor (|χ−| = 0.038 ppm ↔ MWF 0.12) with the exact constraint χ+ ≥ 0 and
  confidence-weighted spatial regularisation; elsewhere the two-source closed form
  χ+ = (R2' + Dr−·χ_total)/(Dr+ + Dr−), |χ−| = χ+ − χ_total. Relaxivities are declared
  parameters (see drp/drn) defaulting to the published Dr+ = 137·B0/3 Hz/ppm (Shin 2021) and
  Dr− = Dr+. The WM branch runs only when the echo train can resolve a multi-compartment
  signature (TE span ≥ 30 ms and TE_max ≥ 35 ms, i.e. 3 and 3.5 myelin-water T2); otherwise the
  method reduces to the closed-form solve.
  MATCHED-MODEL CAVEAT: the forward family used here (hollow-cylinder pools, the MWF↔χ− anchor)
  overlaps the published family the χ-separation phantom generators implement, so read phantom
  scores as "what is recoverable when the model class is right" rather than as a model-agnostic
  result; prefer the detrended-NRMSE and cross-phantom columns.
  KNOWN LIMITATIONS: the WM-likeness statistic is weak even where it applies (AUC ≈ 0.73–0.77
  against single-compartment WM on the one phantom with a simulated beat) because it measures
  non-mono-exponentiality, which strong static dephasing also produces — treat θ/MWF as
  low-confidence. The χ_total gate classifies calcification as WM-like. χ+ in the WM branch is
  shrunk toward a small WM prior, so genuinely elevated WM iron (MS lesion rims, WM iron in
  neurodegeneration) is suppressed.
authors:
- name: Ashley Stewart
doi: null
citation: >
  Stewart A., "HC-ChiSep: hollow-cylinder chi-separation with signal-derived fibre
  orientation", QSM-CI, 2026. The underlying biophysical models are cited in recon.py.
code_url: https://github.com/QSMxT/QSM-CI
license: MIT
image: ghcr.io/astewartau/qsm-ci/hc-chisep-qsmci:v2
run: bash run.sh
parameters:
  - name: drp
    default: 137*B0/3
    description: >
      paramagnetic relaxivity Dr+ in Hz/ppm ($HCCHISEP_DRP). Default is the published
      field-scaled empirical calibration 137·B0/3 (Shin et al. 2021), the same value the rest of
      the field assumes. `auto` opts into self-calibration (robust lower envelope of R2'/χ_total
      over χ_total > 0.02 ppm). Self-calibration is NOT the default: it is accurate only where
      R2' is exact and the forward model is χ+ = R2'/Dr+ in the calibration voxels — on a
      noiseless phantom it recovers the generator's constant to four significant figures, but
      with an estimated R2' the same estimator spans 241–755 Hz/ppm on one dataset.
  - name: drn
    default: drp
    description: >
      diamagnetic relaxivity Dr− in Hz/ppm ($HCCHISEP_DRN), used by the closed-form branch;
      `drp` (the default) sets it equal to Dr+, the co-located Shin convention; 0 is the Ridani
      convention (all R2' outside WM is paramagnetic — a statement about tissue composition).
      Dr− also fixes how the two input channels are weighted: Dr−=0 reads χ+ off R2' alone,
      Dr−=Dr+ averages R2'/Dr+ with χ_total. Measured on the chisep-mc phantom, Dr−=0 scores
      better when handed the TRUE R2' (avg MSPE 0.78 vs 2.69) but 10.9× worse once R2' is
      generated rather than given (8.54 vs 1.94), and 8.6× worse on the Ridani phantoms where
      Dr+ is mis-specified. The symmetric default is the one that survives an imperfect R2'.
  - name: force_wm
    default: 0
    description: >
      $HCCHISEP_FORCE_WM=1 runs the WM branch even when the echo train cannot resolve a
      multi-compartment signature. Diagnostic only — the model-selection statistic cannot
      separate a myelin beat from static dephasing on a short echo train.
  - name: mode
    default: headline
    description: >
      headline = signal-derived orientation (fiber_angle NOT read); dti = θ pinned to the
      fiber_angle input (DTI-informed comparison arm); closed-form = the two-source closed-form
      solve everywhere (ablation, no beat machinery). Set via $HCCHISEP_MODE.
  - name: lam
    default: 0.7
    description: >
      weight of the per-voxel MWF route (χ+ = χ_total + K·MWF) against the self-calibrated WM χ+
      prior median — the main shrinkage knob of the WM branch.
  - name: w_center
    default: 1.5
    description: >
      centre (log10 SSE ratio, anchored-HC vs mono-exponential) of the soft WM-likeness sigmoid;
      scale 0.3. The ratio statistic is scale-free, so the centre transfers across SNR.
  - name: smooth
    default: "off"
    description: >
      OPTIONAL grain reduction of the R2'-noise-limited χ maps (set via $HCCHISEP_SMOOTH).
      off (default) = pristine baseline. auto = enable ONLY if the input R2' is noisy
      (χ-grain g = σ_R2'/Dr+ ≥ τ, default 0.008 ppm; τ via $HCCHISEP_SMOOTH_TAU); on = force;
      a float forces TV-regularised joint inversion at that λ ($HCCHISEP_SMOOTH_LAM, default 0.01).
      Background: the unregularised split copies R2' input noise identically into χ+ and χ- (the
      "shared grain"); because the paper metrics are ROI-mean-based this grain barely affects them,
      so the SCORED submission is left as the faithful, noise-carrying baseline (smooth=off). The
      recommended cosmetic opt-in is TV joint inversion at λ=0.01, which on ground-truth phantoms
      keeps χ+ ROI error negligible and slightly IMPROVES χ- MSPE. Experimental variants are all
      env-gated OFF: χ_total-guided filtering ($HCCHISEP_TVINV with _PRIOR=guided, $HCCHISEP_HARDCON,
      $HCCHISEP_GUIDE/_GF_R/_GF_EPS) and R2'-input denoise ($HCCHISEP_R2DENOISE/_R2STR, $HCCHISEP_SNRW).
      The guided/hard-constraint ones look cleanest and win phantom χ- but OVER-SMOOTH in vivo (maps
      smoother than the input QSM, reference-agreement drops) — hence not the default. Input-denoise
      variants hurt ROI-mean accuracy and are kept only for reproducibility of the investigation.
tuned:
  dataset: data/sim/chisep-ship
  note: >
    hyperparameters (smoothing scales, soft-weight sigmoid, lam, normalised-convolution sigma) were
    selected by scoring on the chisep-ship phantom's ground truth; the physics (hollow-cylinder
    parameters, MWF↔χ− anchor, Dr conventions) is fixed from the published model family, and Dr+ is
    self-calibrated from the inputs at run time.
# Produces chi-para (χ+ ≥ 0) and chi-dia (|χ−| ≥ 0, positive magnitude). Runtime ~2 min full brain
# (1.3 M voxels, 8 echoes) on 14 CPU cores; O(N·|library|) chunked-GEMM grid search, rho-binned.
