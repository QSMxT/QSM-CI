name: Complex fit + ROMEO (QSM.rs)
slug: fit-ppm-complex-qsmrs
algorithm: fit-ppm-complex
source: qsmrs
stage: field-mapping
language: Rust
family: direct
learning: none
inputs: [phase, magnitude, mask, params]
engine: QSMxT / QSM.rs
qsmxt_value: romeo   # QSMxT runs the complex fit as ROMEO field mapping with --b0-estimation complex-fit (the `unwrapping` parameter's default)
qsmxt_args: [--b0-estimation complex-fit]
description: >
  MEDI's complex fit of the echoes (QSM.rs's port of Fit_ppm_complex, `qsmxt fieldmap
  --b0-estimation complex-fit`), unwrapped spatially with ROMEO by default, or with QSM.rs's port
  of MEDI's region-growing unwrapPhase (`unwrapping: medi-region-growing`), which makes it MEDI's
  field map. Its pair is fit-ppm-complex-cornell, run with MEDI's region growing and compared on
  the total field, the fit itself (ifreq_raw), its noise map (n_std) and ARLO's R2* (r2star),
  which this entry writes as intermediates.
citation: Liu et al., Magn Reson Med 2013;69(2):467-476
authors:
- name: Tian Liu
- name: Cynthia Wisnieff
- name: Min Lou
- name: Weiwei Chen
- name: Pascal Spincemaille
- name: Yi Wang
doi: 10.1002/mrm.24272
code_url: https://github.com/astewartau/QSM.rs
license: MIT
# `--b0-estimation complex-fit` and QSMxT/QSMxT#462's `--complex-fit-output` /
# `--complex-fit-noise-output` are in QSMxT from v11.0.0.
# Parity runs a qsmxt build or release (parity/thresholds.yml, fit-ppm-complex).
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
# Fit_ppm_complex's own defaults (as fit-ppm-complex-cornell's).
parameters:
- name: reltol
  default: 1e-4
  description: Gauss-Newton stop, relative to the norm of the initial field estimate
- name: max_iter
  default: 30
  description: maximum Gauss-Newton iterations of the complex fit
- name: unwrapping
  default: romeo
  description: "spatial unwrapping of the fit: romeo (QSMxT's default) or medi-region-growing (MEDI's unwrapPhase, as fit-ppm-complex-cornell; needs a qsmxt with `qsmxt fieldmap medi-region-growing`)"
