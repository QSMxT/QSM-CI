description: >
  DECOMPOSE-QSM as its paper describes it (Chen et al. 2021): FSL BET on the first echo, STI Suite
  Laplacian unwrapping, V-SHARP and STAR-QSM per echo with whole-brain mean referencing, then the
  three-stage fit with lsqlin (sum-to-one amplitudes, R2*0) and lsqnonlin (χ±) on per-voxel
  S(0) = 1 data. QSM-CI's MATLAB of the paper (it ships no code); the reference for QSMxT's
  `decompose` pipeline (QSMxT/QSM-CI#421).
