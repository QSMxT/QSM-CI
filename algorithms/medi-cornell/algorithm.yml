name: MEDI (MEDI toolbox)
slug: medi-cornell
algorithm: medi
source: cornell
stage: dipole
# MEDI is a morphology-enabled dipole inversion: on top of the plain dipole inputs
# (localfield + mask + params) it also reads the magnitude to build the edge/morphology
# gradient mask (see the `percentage` parameter). `optional_inputs` adds magnitude to
# this method's input contract only — the harness mounts it and passes --magnitude, and
# other dipole methods are unaffected. Without it, recon.m fails on a missing
# /input/magnitude.nii.gz.
language: MATLAB
family: iterative
learning: none
engine: MEDI toolbox
inputs: [localfield, mask, params, magnitude]  # recon.m reads magnitude.nii.gz unconditionally for the data-fidelity weight
description: Morphology Enabled Dipole Inversion (Cornell MEDI toolbox 2024.11.26), compiled from
  MATLAB and run on the license-free MATLAB Runtime. Solves the L1 morphology-regularized
  dipole inversion directly on the local (tissue) field (no background-field removal).
authors:
- name: Jing Liu
- name: Tian Liu
- name: Ludovic de Rochefort
- name: James Ledoux
- name: Ildar Khalidov
- name: Weiwei Chen
- name: A. John Tsiouris
- name: Cynthia Wisnieff
- name: Pascal Spincemaille
- name: Martin R. Prince
- name: Yi Wang
doi: 10.1016/j.neuroimage.2011.08.082
citation: Liu et al., NeuroImage 2012
code_url: http://pre.weill.cornell.edu/mri/pages/qsm.html
license: See Cornell MEDI toolbox license
image: ghcr.io/astewartau/qsm-ci/matlab-medi@sha256:122ac0095b1472b80f4e5441be2dd87fb6d730c101663365fb88be747ebd24f4   # v3
run: bash run.sh
smoke_box: 32   # PR --smoke gate fits a 32^3 central box (fast); full score.yml run is unaffected
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:122ac0095b1472b80f4e5441be2dd87fb6d730c101663365fb88be747ebd24f4
  matlab: R2023b Update 5 (23.2.0.2459199), MEDI toolbox 2024.11.26
  tolerance: identical   # chi and every intermediate, in silico and in vivo, 8 threads
  result: pass
  report: algorithms/medi-cornell/fidelity/REPORT.md
parameters:
- name: lambda
  default: 1000
  description: data-fidelity weight (larger = closer data fit, less regularization); 1000 is Cornell's default
- name: smv_radius
  default: 0
  description: spherical-mean-value radius (mm) for extra background removal; 0 disables (default now off — input is already a local field)
- name: percentage
  default: 0.9
  description: fraction of voxels kept as edges in the morphology gradient mask
- name: merit
  default: 0
  description: model-error reduction (iterative reweighting); 1 enables

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: pending
  note: "Converted from a bfr+dipole span (PDF+MEDI) to a pure dipole inversion (MEDI_L1 on the local field); the old lambda=520 tuning was for the span and no longer applies. Default lambda is Cornell's 1000 since v3 (was 100). Needs re-sweeping as a dipole method."
