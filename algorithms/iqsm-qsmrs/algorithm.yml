name: iQSM (QSM.rs)
slug: iqsm-qsmrs
algorithm: iqsm
source: qsmrs
stage: end-to-end
language: Rust
family: deep-learning
learning: pretrained
inputs: [phase, magnitude, mask, params]
optional_inputs: [magnitude]   # without it qsmxt weights the echoes by TE² alone, as the original
engine: QSMxT / QSM.rs
description: >
  iQSM as QSM.rs runs it: the authors' trained weights exported to ONNX and run by `qsmxt invert
  iqsm` (QSM.rs's ONNX engine, CPU), from every echo's wrapped phase, each echo through the network,
  combined with (magnitude × TE)² weights as the authors' Python code does. The QSM.rs port of the
  `iqsm` entry, which runs the authors' own code and weights.
authors:
- name: Gao Y.
- name: Xiong Z.
- name: Fazlollahi A.
- name: Nestor P.J.
- name: Vegh V.
- name: Nasrallah F.
- name: Winter C.
- name: Pike G.B.
- name: Crozier S.
- name: Liu F.
- name: Sun H.
- name: Ashley Stewart
  note: QSM.rs / QSMxT ONNX port
doi: 10.1016/j.neuroimage.2022.119410
citation: Gao et al., NeuroImage 2022
code_url: https://github.com/astewartau/QSM.rs
license: 'MIT (QSM.rs); the weights keep the original''s terms: See repository (used with author permission)'
# The weights are QSM.rs's ONNX exports (qsmxt/qsm-onnx-weights), baked into the image with
# algorithms/_qsmxt/models.Dockerfile, since a submission runs with no network.
# `qsmxt invert iqsm` is in QSMxT main (QSMxT/QSMxT#460) but in no release yet: v10.0.0 lacks it.
# Repin to the first release that has it, then drop ci_skip. The parity workflow runs it with qsmxt
# built from source.
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:3fd27500c18778edc21fd771828573e01c353e4c6147124977293e51256a9053   # v10.0.0-models-2
run: bash run.sh
ci_skip: true   # until the image has `qsmxt invert iqsm` (see image:)
parameters:
- name: echo_weighting
  default: mag2-te2
  description: >
    Echo weighting of the multi-echo combination (`--echo-weighting`): `mag2-te2` = (magnitude ×
    TE)², the authors' Python code (the original entry's); `mag-te2` = magnitude × TE², their MATLAB
    code.
