name: FANSI nlTGV (FANSI toolbox)
slug: fansi-nltgv
algorithm: fansi
variant: nltgv
source: fansi   # the authors' FANSI toolbox; pairs with fansi-nltgv-qsmrs (QSM.rs's port) in the parity workflow
stage: dipole
language: MATLAB
family: iterative
learning: none
engine: FANSI toolbox 93044a3 (nlTGV.m)
inputs: [localfield, mask, params, magnitude]
description: >
  Fast Nonlinear Susceptibility Inversion with total-generalized-variation regularization, the
  authors' nlTGV.m from the FANSI toolbox (commit 93044a3) with its own defaults, compiled from
  MATLAB and run on the license-free MATLAB Runtime.
citation: Milovic et al., Magn Reson Med 2018
authors:
- name: Carlos Milovic
- name: Berkin Bilgic
- name: Bo Zhao
- name: Julio Acosta-Cabronero
- name: Cristian Tejos
doi: 10.1002/mrm.27073
code_url: https://gitlab.com/cmilovic/FANSI-toolbox
license: "No license file; author toolbox distribution"
image: ghcr.io/astewartau/qsm-ci/fansi@sha256:e34728c1a66c2ab7654bfcf5308ed507db79da9d7be599936a77156cd4df8730   # nltgv-v2
run: bash run.sh
smoke_box: 32
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-30
  image: sha256:e34728c1a66c2ab7654bfcf5308ed507db79da9d7be599936a77156cd4df8730   # nltgv-v2
  matlab: R2023b Update 5 (23.2.0.2459199)
  sources: FANSI-toolbox 93044a3
  tolerance: identical   # chi and every intermediate, in silico and in vivo, 8 threads
  result: pass
  report: algorithms/fansi-nltgv/fidelity/REPORT.md
# nlTGV.m's own defaults where it has them; the field is scaled to radians at the echo spacing TE(2) − TE(1), as QSM.rs's
# port does by default. See BUILD.md and recon.m.
parameters:
- name: alpha1
  default: 0.0002
  description: first-order (TGV) L1 penalty (no default in nlTGV.m; the toolbox's demos use 2e-4)
- name: alpha0
  default: 2*alpha1
  description: second-order (curvature) penalty
- name: mu1
  default: 100*alpha1
  description: first-order ADMM weight
- name: mu0
  default: 2*mu1
  description: second-order ADMM weight
- name: mu2
  default: 1
  description: fidelity-consistency ADMM weight
- name: max_iter
  default: 150
  description: maximum ADMM iterations
- name: tol_update
  default: 0.1
  description: stop when the relative update (%) falls below this
- name: tol_delta
  default: 1e-06
  description: Newton tolerance of the nonlinear data step
