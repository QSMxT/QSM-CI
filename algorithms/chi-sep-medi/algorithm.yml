name: χ-separation (MEDI)
slug: chi-sep-medi
stage: chi-separation
language: MATLAB
family: iterative
learning: none
engine: χ-separation toolbox
description: >
  χ-separation (MEDI variant) — separates net susceptibility into paramagnetic (χ+, iron) and
  diamagnetic (χ−, myelin/calcium) sources using the local field, a QSM/χ_total map, and an R2' map,
  with a morphology-enabled dipole (MEDI) regulariser. From the SNU-LIST chi-separation toolbox.
authors:
- name: Hyeong-Geol Shin
- name: Jingu Lee
- name: Jongho Lee
doi: 10.1016/j.neuroimage.2021.118371
citation: Shin et al., NeuroImage 2021
code_url: https://github.com/SNU-LIST/chi-separation
license: academic use; toolbox obtained via the SNU-LIST Google Form
image: ghcr.io/astewartau/qsm-ci/chi-sep-medi:v1
run: bash run.sh
matlab:
  entry: recon.m
  runtime: r2026a
# Inputs consumed (isolated eval, fed ground truth): local field + R2' + QSM + mask + magnitude.
# Produces two source maps: chi-para (χ+) and chi-dia (χ−). CSF referencing disabled (no CSF mask in
# the stage contract). Same GHCR/image caveat as the iLSQR submission — runs via `--runner local`.
