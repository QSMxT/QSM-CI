name: TV (ADMM)
slug: tv
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Total Variation regularized dipole inversion solved with ADMM.
citation: Bilgic et al., MRM 2014
authors:
- name: Berkin Bilgic
- name: Audrey P. Fan
- name: Jonathan R. Polimeni
- name: Stephen F. Cauley
- name: Marta Bianciardi
- name: Elfar Adalsteinsson
- name: Lawrence L. Wald
- name: Kawin Setsompop
doi: 10.1002/mrm.25029
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.4.0
run: bash run.sh
parameters:
  - name: lambda
    default: 1e-4
    tuned:
      sim: 3e-5
      invivo: 3e-4
    description: TV regularization
  - name: rho
    default: 1.0
    description: ADMM penalty
  - name: max_iter
    default: 1000
    description: iterations

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: tuned
  note: "Swept lambda on sim+invivo (2026-08). Tuned both: sim 3e-5, invivo 3e-4."
