name: TGV (QSM.rs)
slug: tgv-qsmrs
algorithm: tgv
source: qsmrs
stage: bfr+dipole
language: Rust
family: iterative
learning: none
inputs: [totalfield, mask, params]  # the artifacts this method actually reads (a subset of the stage's inputs)
engine: QSMxT / QSM.rs
description: >
  Total Generalized Variation single-step reconstruction: total field -> susceptibility, doing its own background field removal.
citation: Langkammer et al., NeuroImage 2015
authors:
- name: Christian Langkammer
- name: Kristian Bredies
- name: Benedikt A. Poser
- name: Markus Barth
- name: Gernot Reishofer
- name: Audrey Peiwen Fan
- name: Berkin Bilgic
- name: Franz Fazekas
- name: Caterina Mainero
- name: Stefan Ropele
doi: 10.1016/j.neuroimage.2015.02.041
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:c78a9ffb14b54c319cb5fb3409ccf06ac83bb79bf250a0baa2663710255b709e   # v12.0.0
run: bash run.sh
parameters:
  - name: iterations
    default: 1000
    description: iterations
  # α are in TGV.jl's rad units at the scan's echo time (--te, default the first) and field strength
  # (qsmxt v11). The defaults are TGV.jl's (regularization 2). v10's α were in ppm, so its tuned
  # values do not carry over (see tuning below).
  - name: alpha1
    default: 0.003
    description: first-order (gradient) weight, rad at the echo time
  - name: alpha0
    default: 0.002
    description: second-order weight, rad at the echo time
  # Parity switches (qsmxt invert tgv after v10.0.0): reproduce QuantitativeSusceptibilityMappingTGV.jl
  # where QSM.rs's default differs. Not tuning parameters.
  - name: reference_divergence
    default: false
    description: TGV.jl's divergence in the w update instead of the exact adjoint (anisotropic voxels only)
  - name: reference_edge_erosion
    default: false
    description: erode the mask as TGV.jl does, not from the array's edge (masks reaching an array face only)
  - name: reference_output_box
    default: false
    description: χ over TGV.jl's whole output box, including the rim just outside the eroded mask

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: TGV: TGV.jl's rad-unit alpha at the scan's TE and B0 (QSM.rs#231), exact adjoint and edge erosion (#324); defaults alpha1 0.003, alpha0 0.002 rad. Tuned values removed 2026-11-10; re-sweep. Was: Swept alpha1/alpha0 on sim (bfr+dipole span; sim-only). Tuned sim: alpha1 1.5e-4."
