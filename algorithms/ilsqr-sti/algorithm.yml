name: iLSQR (STI Suite)
slug: ilsqr-sti
algorithm: ilsqr
source: sti
stage: dipole
language: MATLAB
family: iterative
learning: none
engine: STI Suite
description: Iterative LSQR dipole inversion from STI Suite v3 (the reference iLSQR implementation),
  compiled from MATLAB and run on the license-free MATLAB Runtime. Takes the local field and solves
  for susceptibility with streaking-artifact reduction.
authors:
- name: Wei Li
- name: Nian Wang
- name: Fang Yu
- name: Hui Han
- name: Wei Cao
- name: Rebecca Romero
- name: Bundhit Tantiwongkosi
- name: Timothy Q. Duong
- name: Chunlei Liu
doi: 10.1016/j.neuroimage.2014.12.043
citation: Li et al., NeuroImage 2015
code_url: https://people.eecs.berkeley.edu/~chunlei.liu/software.html
license: See STI Suite license
image: ghcr.io/astewartau/qsm-ci/matlab-sti-ilsqr@sha256:fa2660014473dbff51a6ddd6aba0840074349ce6d97be9efd0cb8afe6c1c597c   # v2
run: bash run.sh
matlab:
  entry: recon.m
  runtime: r2023b
# Container vs the authors' code in licensed MATLAB with the real toolboxes (QSMxT/QSM-CI#300;
# fidelity/REPORT.md). Rerun and update whenever the image changes.
fidelity:
  date: 2026-10-28
  image: sha256:fa2660014473dbff51a6ddd6aba0840074349ce6d97be9efd0cb8afe6c1c597c
  matlab: R2023b Update 5 (23.2.0.2459199), Image Processing Toolbox 23.2
  tolerance: identical   # chi and the tissue phase, in silico and in vivo, 8 threads
  result: pass
  report: algorithms/ilsqr-sti/fidelity/REPORT.md
params:
- name: padsize
  default: 12
  description: zero-pad size (voxels, isotropic) to improve numerical accuracy of the inversion
