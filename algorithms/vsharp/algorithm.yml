name: V-SHARP
slug: vsharp
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Variable-radius SHARP: SMV deconvolution with a spatially varying kernel radius.
citation: Wu et al., Magn Reson Med 2012
authors:
- name: Bing Wu
- name: Wei Li
- name: Arnaud Guidon
- name: Chunlei Liu
doi: 10.1002/mrm.23000
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.4.0
run: bash run.sh
parameters:
  - name: threshold
    default: 0.02
    description: deconvolution threshold
  - name: max_radius_factor
    default: 0.5
    description: × min voxel size
  - name: min_radius_factor
    default: 0.0
    description: × max voxel size

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: default-optimal
  note: "Swept threshold on sim (sim-only); best beat default by only +0.002 (noise). Left at default."
