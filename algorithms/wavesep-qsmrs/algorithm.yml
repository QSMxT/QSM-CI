name: WaveSep (QSM.rs)
slug: wavesep-qsmrs
algorithm: wavesep
source: qsmrs
stage: chi-separation
language: Rust
family: iterative
learning: none
inputs: [chimap, r2prime, mask, params]  # χ_total + R2' only, as the original (wavesep)
engine: QSMxT / QSM.rs
description: >
  WaveSep (Fang et al. 2023) as the Rust implementation in QSM.rs, run by `qsmxt separate
  wavesep`: χ+ + χ− ≈ χ_total and χ+ − χ− ≈ R2'/Dr under a wavelet-domain L1 prior (db4, maximum
  level), solved by proximal gradient with the authors' defaults (α 0.2, λ 0.02, ≤ 100 iterations,
  early stop at a relative change of 1e-3). The QSM.rs port of the `wavesep` entry, which runs the
  authors' Python solver.
authors:
- name: Zhenghan Fang
  note: original WaveSep method and code
- name: Hyeong-Geol Shin
- name: Peter van Zijl
- name: Xu Li
- name: Jeremias Sulam
- name: Ashley Stewart
  note: QSM.rs / QSMxT Rust port
doi: 10.1007/978-3-031-44858-4_6
citation: >
  Fang, Shin, van Zijl, Li, Sulam, "WaveSep: A Flexible Wavelet-Based Approach for Source Separation in
  Susceptibility Imaging", Machine Learning in Clinical Neuroimaging (MLCN), MICCAI 2023, Springer LNCS.
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:9258c10e34cd0019dbab12746977813fe0a0b3ad92b13986d1d9ffb2c3326b57   # v10.0.0
run: bash run.sh
parameters:
- name: Dr
  default: 137.0
  description: >
    Static-dephasing relaxivity (Hz/ppm), used for both sources as the original does (`--dr-pos`,
    `--dr-neg`). 137 is the qsm-forward phantom's kernel, the `wavesep` entry's default.
- name: lambda
  default: 0.02
  description: wavelet-domain L1 (soft-thresholding) weight
- name: alpha
  default: 0.2
  description: proximal-gradient step
- name: max_iter
  default: 100
  description: maximum proximal-gradient iterations (early stop at a relative change of 1e-3)
