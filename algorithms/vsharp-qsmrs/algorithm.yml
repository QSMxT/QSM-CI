name: V-SHARP (QSM.rs)
slug: vsharp-qsmrs
algorithm: vsharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Variable-radius SHARP: background removal by SMV filtering with a spatially varying kernel radius
  (largest kernel that fits at each voxel). A truncated-SVD deconvolution of the SMV high-pass is an
  option (off by default, as in QSMxT; on in the simulation-tuned run).
citation: Wu et al., Magn Reson Med 2012
authors:
- name: Bing Wu
- name: Wei Li
- name: Arnaud Guidon
- name: Chunlei Liu
doi: 10.1002/mrm.23000
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
# Defaults are QSMxT's: no deconvolution (threshold 0.05 when on). Deconvolution is the
# simulation-tuned value only.
parameters:
  - name: deconvolve
    default: false
    tuned:
      sim: "true"   # quoted: the tuned pass passes it on as --set deconvolve=true
    description: undo the SMV high-pass with a truncated-SVD deconvolution
  - name: threshold
    default: 0.05
    description: deconvolution (TSVD) threshold; only used with deconvolve=true
  - name: max_radius
    default: 12.0
    description: largest (starting) SMV kernel radius (mm)
  - name: min_radius
    default: 1.0
    description: smallest SMV kernel radius (mm)
  - name: radius_step
    default: 1.0
    description: step between SMV kernel radii (mm)
  - name: grid
    default: isotropic
    description: "working grid: isotropic (1 mm), native or finest; QSM.jl works on the native grid"
  - name: ball
    default: default
    description: "SMV ball: default (QSM.rs's) or qsmjl (QSM.jl's); a parity switch, not a tuning parameter"

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-10
  status: tuned
  note: "Swept on sim with qsmxt v10.0.0: deconvolve at threshold 0.05 (xSIM 0.845) beat threshold 0.2 (0.820) and no deconvolution (0.803), so deconvolve=true is the sim-tuned value. Since 2026-11 the default follows QSMxT (no deconvolution), so the default run and the harmonization runs match what QSMxT users get."
