name: V-SHARP (QSM.rs)
slug: vsharp-qsmrs
algorithm: vsharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Variable-radius SHARP: SMV deconvolution with a spatially varying kernel radius.
citation: Wu et al., Magn Reson Med 2012
authors:
- name: Bing Wu
- name: Wei Li
- name: Arnaud Guidon
- name: Chunlei Liu
doi: 10.1002/mrm.23000
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v9.4.0
run: bash run.sh
# Defaults confirmed against the pinned image (qsmxt v9.4.0 → QSM.rs v0.15.0 qsm-core v0.18.0):
# threshold 0.05, max radius 12, min radius / step 1 — verified by reproducing the default output.
parameters:
  - name: threshold
    default: 0.05
    description: deconvolution threshold
  - name: max_radius
    default: 12.0
    description: max (starting) SMV kernel radius, × min voxel size
  - name: min_radius
    default: 1.0
    description: min radius / step between radii, × max voxel size

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: default-optimal
  note: "Swept threshold on sim (sim-only); best beat default by only +0.002 (noise). Left at default."
