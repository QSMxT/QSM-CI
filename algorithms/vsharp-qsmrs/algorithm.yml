name: V-SHARP (QSM.rs)
slug: vsharp-qsmrs
algorithm: vsharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Variable-radius SHARP: background removal by SMV filtering with a spatially varying kernel radius
  (largest kernel that fits at each voxel). Since qsmxt v10.0.0 the SMV high-pass is not
  deconvolved by default (deconvolve=true restores the TSVD deconvolution).
citation: Wu et al., Magn Reson Med 2012
authors:
- name: Bing Wu
- name: Wei Li
- name: Arnaud Guidon
- name: Chunlei Liu
doi: 10.1002/mrm.23000
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v10.0.0   # the shared QSMxT engine image
run: bash run.sh
# Defaults are qsmxt v10.0.0's (`qsmxt bgremove vsharp`): no deconvolution, radii 12 → 1 mm.
parameters:
  - name: deconvolve
    default: false
    description: undo the SMV high-pass with a truncated-SVD deconvolution (off by default since qsmxt v10.0.0)
  - name: threshold
    default: 0.2
    description: deconvolution (TSVD) threshold; only used with deconvolve=true
  - name: max_radius
    default: 12.0
    description: largest (starting) SMV kernel radius (mm)
  - name: min_radius
    default: 1.0
    description: smallest SMV kernel radius (mm)

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: default-optimal
  note: "Swept threshold on sim (sim-only); best beat default by only +0.002 (noise). Left at default."
