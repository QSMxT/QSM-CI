name: V-SHARP (QSM.rs)
slug: vsharp-qsmrs
algorithm: vsharp
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Variable-radius SHARP: background removal by SMV filtering with a spatially varying kernel radius
  (largest kernel that fits at each voxel), then a truncated-SVD deconvolution of the SMV high-pass.
citation: Wu et al., Magn Reson Med 2012
authors:
- name: Bing Wu
- name: Wei Li
- name: Arnaud Guidon
- name: Chunlei Liu
doi: 10.1002/mrm.23000
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt:v10.0.0   # the shared QSMxT engine image
run: bash run.sh
# Radii are qsmxt v10.0.0's defaults. QSM-CI deconvolves at threshold 0.05; qsmxt v10's own default
# is no deconvolution (threshold 0.2 when on).
parameters:
  - name: deconvolve
    default: true
    description: undo the SMV high-pass with a truncated-SVD deconvolution
  - name: threshold
    default: 0.05
    description: deconvolution (TSVD) threshold; only used with deconvolve=true
  - name: max_radius
    default: 12.0
    description: largest (starting) SMV kernel radius (mm)
  - name: min_radius
    default: 1.0
    description: smallest SMV kernel radius (mm)

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-10
  status: tuned
  note: "Defaults chosen on sim with qsmxt v10.0.0: deconvolve at threshold 0.05 (xSIM 0.845) beat threshold 0.2 (0.820) and no deconvolution (0.803). The 2026-08 threshold sweep ran against a documented default (0.05) the engine never used (0.2)."
