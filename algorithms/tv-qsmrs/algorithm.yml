name: TV-ADMM (QSM.rs)
slug: tv-qsmrs
algorithm: tv
source: qsmrs
stage: dipole
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
description: >
  Total Variation regularized dipole inversion solved with ADMM.
citation: Bilgic et al., MRM 2014
authors:
- name: Berkin Bilgic
- name: Audrey P. Fan
- name: Jonathan R. Polimeni
- name: Stephen F. Cauley
- name: Marta Bianciardi
- name: Elfar Adalsteinsson
- name: Lawrence L. Wald
- name: Kawin Setsompop
doi: 10.1002/mrm.25029
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: lambda
    default: 1e-3
    description: TV regularization
  - name: rho
    default: 2e-2
    description: ADMM penalty
  - name: max_iter
    default: 250
    description: iterations

