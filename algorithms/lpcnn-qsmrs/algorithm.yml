name: LPCNN (QSM.rs)
slug: lpcnn-qsmrs
algorithm: lpcnn
source: qsmrs
stage: dipole
language: Rust
family: deep-learning
learning: pretrained
inputs: [localfield, mask, params]
engine: QSMxT / QSM.rs
description: >
  LPCNN as QSM.rs runs it: the authors' trained weights exported to ONNX and run by `qsmxt invert
  lpcnn` (QSM.rs's ONNX engine, CPU). The QSM.rs port of the `lpcnn` entry, which runs the authors'
  own code and weights.
authors:
- name: Lai K-W.
- name: Aggarwal M.
- name: van Zijl P.
- name: Li X.
- name: Sulam J.
- name: Ashley Stewart
  note: QSM.rs / QSMxT ONNX port
doi: 10.1007/978-3-030-59713-9_13
citation: Lai et al., Lecture Notes in Computer Science 2020
code_url: https://github.com/astewartau/QSM.rs
license: 'MIT (QSM.rs); the weights keep the original''s terms: none declared; used with author permission'
# The weights are QSM.rs's ONNX exports (qsmxt/qsm-onnx-weights), baked into the image with
# algorithms/_qsmxt/models.Dockerfile, since a submission runs with no network.
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:4327e61dec101830cd9620049ea216939ea9bbb235e26688d198d90481c6f7df   # v10.0.0-models
run: bash run.sh
