name: FANSI-nlTGV (QSM.rs)
slug: fansi-nltgv-qsmrs
algorithm: fansi
variant: nltgv
source: qsmrs
stage: dipole
inputs: [localfield, mask, params, magnitude]  # run.sh passes --magnitude (the data weight) to a qsmxt that has it
language: Rust
family: iterative
learning: none
engine: QSMxT / QSM.rs
qsmxt_value: fansi-tgv   # QSMxT's name for FANSI with nonlinear-TGV regularization
description: >
  FANSI with nonlinear total-generalized-variation (second-order) regularization, solved with ADMM.
citation: Milovic et al., Magn Reson Med 2018
authors:
- name: Carlos Milovic
- name: Berkin Bilgic
- name: Bo Zhao
- name: Julio Acosta-Cabronero
- name: Cristian Tejos
doi: 10.1002/mrm.27073
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: alpha1
    default: 2e-4
    description: first-order (TGV) L1 penalty
  - name: alpha0
    default: 4e-4
    description: second-order (curvature) penalty
  - name: mu1
    default: 2e-2
    description: gradient-consistency ADMM weight
  - name: max_iter
    default: 150
    description: iterations
  - name: tol_update
    default: 0.1
    description: convergence threshold on the solution update (percent)

# Parameter-tuning provenance (from the Bunya sweep). status: stale = re-sweep needed.
tuning:
  date: 2026-08
  status: stale
  note: "Tuned on QSMxT v10 (QSM.rs v0.39); v11 (QSM.rs v0.41) changed it: FANSI nlTGV: radians inside, magnitude weight and mu defaults (QSM.rs#237), FANSI's discrete kernel (#414). Tuned values removed 2026-11-10; re-sweep. Was: Swept alpha1/alpha0 on sim+invivo (2026-08). Tuned both."
