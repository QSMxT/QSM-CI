name: QSMnetME
slug: qsmnetme
algorithm: qsmnetme
source: snu
stage: dipole
language: Python
family: deep-learning
learning: pretrained
inputs: [localfield, mask, params]  # the artifacts this method actually reads (a subset of the stage's inputs)
engine: χ-separation toolbox
description: >
  QSMnetME — the QSM network of the SNU-LIST χ-separation toolbox v1.1.3 (models/240904_QSMnet.onnx),
  a QSMnet-style 3D U-Net trained on multi-echo data, which the toolbox runs to make χ-sepnet's QSM
  channel. Run here by the toolbox's route (`chi_sepnet_general`): the local field rotated into the
  training frame (B0 along z, 1 mm), z-scored with the χ-sepnet field statistics, the network on the
  whole frame, de-normalised with the COSMOS statistics, and mapped back onto the acquired grid.
  ONNX Runtime, CPU.
authors:
- name: Minjun Kim
- name: Hyeong-Geol Shin
- name: Jongho Lee
doi: 10.1002/hbm.70136
citation: Kim et al., Hum Brain Mapp 2025 (χ-sepnet; QSMnetME)
code_url: https://github.com/SNU-LIST/chi-separation
license: academic use; toolbox obtained via the SNU-LIST Google Form
# The toolbox's networks + normalisation file (algorithms/chisepnet/BUILD.md; shared with chisepnet).
image: ghcr.io/astewartau/qsm-ci/chisep-toolbox@sha256:dcac7d9f05fe02ee44522feaabc839473db61257feed60648bea698911a6521d   # v1 (config d127ddf2)
run: bash run.sh
# The route was recovered from the toolbox's P-code (chi_sepnet_general.p, chi_sepnet.p,
# CalculateRotMat.p) by black-box probing in licensed MATLAB R2023b (astewartau/QSM.rs#377,
# 2026-11-03), and chisep_route.py reproduces the toolbox's QSM channel to 1.7e-5 % (64x60x48 at
# 0.8x0.9x1.1 mm, B0 tilted) and 1.9e-5 % (1 mm, B0 along z) NRMSE: ONNX Runtime's thread rounding.
# The toolbox keeps this QSM internal; mapping it back to the acquired grid is the toolbox's
# treatment of the χ maps it returns.
