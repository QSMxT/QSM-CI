name: HARPERELLA (QSM.rs)
slug: harperella-qsmrs
algorithm: harperella
source: qsmrs
stage: bfr
language: Rust
family: iterative
learning: none
inputs: [totalfield, mask]  # the artifacts this method actually reads
engine: QSMxT / QSM.rs
description: >
  Laplacian-based background field removal (HARPERELLA's harmonic phase removal) on the
  multi-echo total field. The published method also unwraps, starting from one wrapped echo.
citation: Li et al., NMR Biomed 2014
authors:
- name: Wei Li
- name: Alexandru V. Avram
- name: Bing Wu
- name: Xue Xiao
- name: Chunlei Liu
doi: 10.1002/nbm.3056
code_url: https://github.com/astewartau/QSM.rs
license: MIT
image: ghcr.io/astewartau/qsm-ci/qsmxt@sha256:5a353a43b0a6ceeb2b8ec57422a56770d5e86e1d551e727b72ca5089b2e5277e   # v11.0.0
run: bash run.sh
parameters:
  - name: radius
    default: 10.0
    description: SMV kernel radius (mm)
  - name: max_iter
    default: 40
    description: iterations
  - name: tol
    default: 1e-6
    description: tolerance
  - name: rim
    default: whole
    description: "boundary-rim Laplacian values set to zero: whole (the whole rim, QSM.rs's default) or sti (STI Suite's 20 % largest); a qsmxt after v11.0.0"

  - name: erode_voxels
    default: 0
    description: "erode the brain mask by this many voxels (6-connected) before background removal, as qsmxt run --bf-erode-voxels; the field is left whole (uses qsmxt mask erode, also in v11.0.0)"
# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: pending
  note: "Not tuned for this input. The 2026-08 sweep (radius, tuned sim 3) ran on the wrapped first echo; since qsmxt v10.0.0 QSM-CI gives it the multi-echo total field."
