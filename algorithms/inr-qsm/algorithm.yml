name: INR-QSM (PyTorch)
slug: inr-qsm
algorithm: inr-qsm
source: amri
stage: dipole
language: Python
family: deep-learning
learning: untrained
engine: Independent
description: >
  INR-QSM — a subject-specific UNSUPERVISED deep-learning dipole inversion using an implicit neural
  representation. No pretrained weights: a sine-activated coordinate MLP (SIREN) is OPTIMIZED
  per-subject so that the susceptibility it represents, pushed through the QSM dipole forward model,
  reproduces the input local field, with edge-weighted TV and gradient-domain regularizers. Consumes
  the local (tissue) field in ppm and produces susceptibility (ppm). The dipole kernel is built from
  the B0 direction and voxel size. Runs CPU-only by default (the reference is GPU-oriented, ~10 GB
  VRAM; see RUNTIME/GPU CAVEAT in README). Because it optimizes per input volume with a patch-based
  non-local phase-compensation scheme, runtime is long.
authors:
- name: Zhang M.
- name: Feng R.
- name: Li Z.
- name: Feng J.
- name: Wu Q.
- name: Zhang Z.
- name: Ma C.
- name: Wu J.
- name: Yan F.
- name: Liu C.
- name: Zhang Y.
- name: Wei H.
doi: 10.1016/j.media.2024.103173
code_url: https://github.com/AMRI-Lab/INR-QSM
# The INR-QSM repo ships NO LICENSE file. Treat as academic use; cite the paper.
license: none declared (no LICENSE in repo); academic use, cite the paper
image: ghcr.io/astewartau/qsm-ci/inr-qsm:v2
run: bash run.sh
smoke_box: 32   # PR --smoke gate fits a 32^3 central box (fast); full score.yml run is unaffected
# MANUAL tier: never scored automatically — dispatch score.yml with scope=inr-qsm (or
# include_manual=true). Why: the full-size CPU optimization needs the 31 GB self-hosted box
# (OOMs hosted) AND takes ~17 h per run there (2026-09-08 log: 50 epochs at ~20 min each, two
# runs contending) against a 6-h cap, and a dipole focus job needs 1 isolated + every composed
# column. 29 automatic attempts since 2026-07-25 finished 3 times (last 2026-07-25), each failure
# holding a self-hosted runner for its whole cap. `gpu` is the honest tier once a GPU runner exists.
runner: manual
timeout_minutes: 2880   # honored on self-hosted/manual only; ~4 h/run with the box to itself
jobs: 1                 # one optimization at a time — each one already uses every core
compose:                # composed only with the GT field map on the two reference BFR methods
  fieldmaps: [gt]
  bfrs: [vsharp-qsmrs, pdf-qsmrs]
# Notes on how QSM-CI runs this method vs. its reference (shown on the submission page).
ci_notes:
- >
  Executed CPU-only. The reference optimizes per subject on an NVIDIA GPU with mixed precision, so
  runtime here is substantially longer and not comparable to GPU timings.
parameters:
- name: epoch
  default: 50
  description: >
    Number of per-subject optimization epochs (reference config.py default 50). Main runtime/quality
    knob; fewer epochs run faster but under-fit.
- name: star_lr
  default: 1.0e-5
  description: Starting Adam learning rate at the first epoch (reference default 1e-5).
- name: end_lr
  default: 2.0e-7
  description: Final learning rate at the last epoch, reached by an exponential schedule (reference default 0.02e-5).
- name: hidden_dim_num
  default: 512
  description: Width (neurons per layer) of the SIREN coordinate MLP (reference default 512).
- name: num_layers
  default: 10
  description: Number of layers in the SIREN MLP (reference default 10).
- name: TV_weight
  default: 0.15
  tuned:
    sim: 0.01
    invivo: 0.02
  description: Weight of the edge-weighted total-variation regularizer (reference default 0.15).
- name: gd_weight
  default: 1.0
  description: Weight of the gradient-domain data-consistency regularizer (reference default 1.0).

# Parameter-tuning provenance (from the Bunya sweep) - so this method is not re-swept later.
tuning:
  date: 2026-08
  status: tuned
  note: "Swept TV_weight on sim+invivo (GPU, 2026-08). Deterministic (reruns identical) -> tuned: sim 0.01, invivo 0.02."
