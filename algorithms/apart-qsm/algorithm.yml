name: APART-QSM
slug: apart-qsm
stage: chi-separation
engine: APART-QSM (AMRI-Lab), MATLAB
description: >
  APART-QSM — an iterative susceptibility-source separation method that fits complex multi-echo GRE data
  to jointly estimate paramagnetic (χ+, iron) and diamagnetic (χ−, myelin/calcium) susceptibility. Unlike
  χ-separation methods that take a precomputed R2' and QSM, APART-QSM performs its own iterative data
  fitting (magnitude-decay a-map + field/QSM) to break the para/dia degeneracy. It ingests per-echo
  magnitude and LOCAL (background-removed) phase plus an R2 map and an initial QSM, and returns χ+ and
  χ− (the latter reported as a positive magnitude).
authors:
- name: Zhenghao Li
- name: Ruimin Feng
- name: Qiangqiang Liu
- name: Jie Feng
- name: Guoyan Lao
- name: Ming Zhang
- name: Hongjiang Wei
doi: 10.1016/j.neuroimage.2023.120148
citation: Li et al., NeuroImage 2023
code_url: https://github.com/AMRI-Lab/APART-QSM
license: academic use
image: ghcr.io/astewartau/qsm-ci/apart-qsm:v1
optional_inputs: [phase]
run: bash run.sh
matlab:
  entry: recon.m
  runtime: r2023b
# Inputs consumed: magnitude (multi-echo) + localfield (re-projected to per-echo local phase) + mask +
# chimap (initial QSM) + params; R2 is estimated from the multi-echo magnitude (R2* proxy). Produces two
# source maps: chi-para (χ+) and chi-dia (χ−, |χ−|).
# NOTE: the GHCR image above is not built yet. The core solver apart_qsm_single_ori.m is NOT in the
# public AMRI-Lab/APART-QSM repo (only the demo + helpers ship) and MATLAB needs a run-time license, so
# this runs via `--runner local` (run.sh) once the solver is obtained from the authors. See BUILD.md.
